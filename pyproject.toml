"src/app/gateway/live_chat_companion_context.py" = ["BLE001"]
"src/app/gateway/live_chat_live_voice_profile.py" = ["I001", "UP034", "UP035"]
"src/app/gateway/live_chat_low_latency_stream.py" = ["UP035"]
"src/app/gateway/live_chat_provider_metrics.py" = ["UP035"]
"src/app/gateway/live_chat_provider_routing.py" = ["UP035", "UP037"]
"src/app/gateway/live_chat_release_aggregation.py" = ["UP035"]
"src/app/gateway/live_chat_release_gate.py" = ["UP035"]
"src/app/gateway/live_chat_stream_retry.py" = ["BLE001"]
"src/app/gateway/live_material_context.py" = ["UP035"]
"src/app/gateway/live_observation_generation.py" = ["UP035"]
