"src/app/gateway/live_voice_runtime_offload.py" = ["BLE001"]
"src/app/gateway/tts_live_call_websocket.py" = ["BLE001", "UP035"]
"src/app/gateway/tts_stream_contract.py" = ["UP035", "UP037"]
"src/app/gateway/tts_stream_diagnostics.py" = ["BLE001", "S110"]
"src/app/providers/lmstudio_provider.py" = ["BLE001", "RUF012", "UP006", "UP007", "UP035", "UP045"]
"src/app/providers/stt_live_runtime_support.py" = ["BLE001"]
