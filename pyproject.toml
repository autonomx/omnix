[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --strict-markers --import-mode=importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "postgres: requires disposable PostgreSQL",
  "multiprocess: requires multiple processes",
  "gpu: requires a GPU/model runtime",
  "live_provider: calls a live external/provider service",
  "playwright: browser automation test",
  "slow: long-running deterministic test",
  "smoke: quick smoke test",
  "api: API contract test",
  "frontend: frontend-oriented Python test",
  "js_analysis: static JavaScript analysis",
  "e2e: end-to-end test",
  "functional: functional test",
  "live_codex: opt-in real ChatGPT-authenticated Codex test",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "app.runtime.config",
  "app.runtime.capabilities",
  "app.runtime.contracts",
  "app.runtime.paths",
  "app.runtime.net",
  "app.security.*",
]
ignore_errors = false
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.runtime.background", "app.runtime.logging"]
ignore_errors = true
