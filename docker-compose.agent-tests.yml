services:
  postgres-agent-tests:
    image: postgres:17-alpine
    container_name: omnix-postgres-agent-tests
    environment:
      POSTGRES_DB: omnix_test
      POSTGRES_USER: omnix_test
      POSTGRES_PASSWORD: omnix_test
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:${OMNIX_AGENT_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U omnix_test -d omnix_test
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
