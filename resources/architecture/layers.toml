narration = ["narration", "narration.ai", "narration.cognitive", "narration.narrative", "narration.narrative_engine", "narration.narrative_delivery", "narration.narrative_reference", "narration.narrative_repository", "narration.narrative_retirement", "narration.response_generation", "narration.dialogue", "narration.dialogue_state", "narration.npc_dialogue", "narration.presentation", "narration.coherence", "narration.prompt_profiles", "narration.visual", "narration.story", "narration.journal", "narration.campaign_journal_runtime"]
genesis = ["genesis", "genesis.creator", "genesis.profiles", "genesis.modding", "genesis.worlds", "genesis.forge"]
session = ["session", "session.jobs", "session.interactive_cli_state_checkpoint"]
edge = ["edge", "edge.api", "edge.hermes", "edge.replay", "edge.narrative_replay", "feature", "declarations", "edge.services", "edge.release_finalization", "edge.release_gates", "edge.local_live_smoke", "edge.dialogue_quality_benchmark", "edge.local_dialogue_quality_fixtures", "edge.agent", "__init__"]

[production]
entrypoints = ["src/__init__.py", "src/launch.py", "src/main.py", "src/services/stt/nemotron_eou_stt_server.py", "src/services/stt/parakeet_stt_runtime.py", "src/services/stt/parakeet_stt_server.py", "src/services/tts/tts_server.py", "src/sitecustomize.py", "src/usercustomize.py"]
