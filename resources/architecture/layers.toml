[layers.kernel]
packages = ["app.runtime", "app.config", "app.security", "app.observability", "app.events", "app.persistence", "app.jobs", "app.assets", "app.capabilities", "app.conversation", "app.text"]
may_import = ["kernel"]

[layers.shared_services]
packages = ["app.providers", "app.prompts", "app.platform"]
may_import = ["kernel", "shared_services"]

[layers.features]
packages = ["app.chat", "app.live_voice", "app.characters", "app.assistant_memory", "app.assistant_memory_v2", "app.rpg", "app.trading", "app.agent_runtime", "app.assistant_tools", "app.audiobook", "app.image", "app.voice", "app.research", "app.story", "app.hermes", "app.companion_activity", "app.desktop_companion", "app.live_speech", "app.replay"]
may_import = ["kernel", "shared_services"]
feature_contract_module = "contracts"

[layers.composition]
packages = ["app.gateway", "app.production", "app.worker", "app.launcher", "app.runtime_composition"]
may_import = ["*"]

[owners]
platform_table_sql = ["app/persistence/job_repository.py", "app/persistence/execution_repositories.py", "app/persistence/outbox_repository.py", "app/persistence/identity_service.py", "app/persistence/audit.py", "app/persistence/migrations.py", "app/persistence/retention.py"]
blob_store_construction = ["app/persistence/blob_store.py", "app/persistence/storage.py"]
tenant_bootstrap = ["app/persistence/identity_service.py", "app/persistence/startup.py", "app/production.py", "app/runtime_composition.py", "app/worker.py"]

[rpg_core]
packages = ["app.rpg.core", "app.rpg.session", "app.rpg.combat", "app.rpg.economy", "app.rpg.items", "app.rpg.world", "app.rpg.social", "app.rpg.action_resolver"]

[production]
entrypoints = ["src/__init__.py", "src/launch.py", "src/main.py", "src/nemotron_eou_stt_server.py", "src/openai_api.py", "src/parakeet_stt_runtime.py", "src/parakeet_stt_server.py", "src/tts_server.py", "src/sitecustomize.py", "src/usercustomize.py"]
