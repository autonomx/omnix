[layers.kernel]
packages = ["app.caching", "app.runtime", "app.config", "app.settings", "app.security", "app.observability", "app.events", "app.persistence", "app.jobs", "app.assets", "app.capabilities", "app.conversation", "app.errors"]
may_import = ["kernel"]

[layers.shared_services]
packages = ["app.providers", "app.prompts", "app.models"]
may_import = ["kernel", "shared_services"]

# ADR-0016: platform and app modules are not listed here. Each feature package
# declares its tier in feature.py (FeatureModule.tier); a nested feature belongs
# to the outermost feature package that contains it.
[layers.platform]
tier = "platform"
may_import = ["kernel", "shared_services"]

[layers.apps]
tier = "app"
may_import = ["kernel", "shared_services"]

[layers.composition]
# PA-5.3: the gateway, workers, launcher and runtime composition sit in app/composition/.
packages = ["app.composition", "services"]
may_import = ["*"]

[modules]
# A module imports another module only through this contract module (or a
# package of that name), only when it declares the other in depends_on, and
# only when the other is a platform capability.
contract_module = "contracts"

# Transitional (PA-0.2): code that belongs to a module but lives outside its
# package. Empty since PA-5.3 moved replay into app/apps/rpg/.
[modules.package_owners]

[owners]
platform_table_sql = ["app/persistence/job_repository.py", "app/persistence/execution_repositories.py", "app/persistence/outbox_repository.py", "app/persistence/identity_service.py", "app/persistence/audit.py", "app/persistence/migrations.py", "app/persistence/retention.py"]
blob_store_construction = ["app/persistence/blob_store.py", "app/persistence/storage.py", "app/assets/content.py"]
tenant_bootstrap = ["app/persistence/identity_service.py", "app/persistence/startup.py", "app/composition/production.py", "app/composition/runtime_composition.py"]

[rpg_core]
packages = ["app.apps.rpg.foundation.core", "app.apps.rpg.session", "app.apps.rpg.rules.combat", "app.apps.rpg.rules.economy", "app.apps.rpg.rules.items", "app.apps.rpg.world", "app.apps.rpg.world.social", "app.apps.rpg.rules.action_resolver", "app.apps.rpg.narration.memory_writer", "app.apps.rpg.narration.memory_actor", "app.apps.rpg.narration.memory_retrieval", "app.apps.rpg.narration.memory_world", "app.apps.rpg.narration.memory_prompt", "app.apps.rpg.rules.ambient_intent", "app.apps.rpg.rules.pending_interactions", "app.apps.rpg.rules.runtime_promotions", "app.apps.rpg.rules.semantic_interaction", "app.apps.rpg.rules.location_registry", "app.apps.rpg.rules.quest", "app.apps.rpg.rules.choice", "app.apps.rpg.narration.narrative", "app.apps.rpg.narration.cognitive", "app.apps.rpg.edge.agent"]
# Packages that moved inside session/ and world/ in R-3 keep their own (non-core) rules;
# context persistence packages stamp wall-clock time, as foundation.persistence does.
exclude = ["app.apps.rpg.session.persistence", "app.apps.rpg.world.persistence", "app.apps.rpg.session.jobs", "app.apps.rpg.session.interactive_cli_state_checkpoint", "app.apps.rpg.world.world_graph", "app.apps.rpg.world.locations", "app.apps.rpg.world.spatial", "app.apps.rpg.world.tactical_spatial", "app.apps.rpg.world.tactical_spatial_service", "app.apps.rpg.world.map_actions", "app.apps.rpg.world.map_actor_footprints", "app.apps.rpg.world.map_content_editor", "app.apps.rpg.world.map_content_validation", "app.apps.rpg.world.map_contracts", "app.apps.rpg.world.map_effective_geometry", "app.apps.rpg.world.map_geometry_patch", "app.apps.rpg.world.map_geometry_patch_service", "app.apps.rpg.world.map_grid_contracts", "app.apps.rpg.world.map_hierarchy", "app.apps.rpg.world.map_instance_runtime", "app.apps.rpg.world.map_living_overlay", "app.apps.rpg.world.map_living_state", "app.apps.rpg.world.map_observer_runtime", "app.apps.rpg.world.map_observer_service", "app.apps.rpg.world.map_overlay_projection", "app.apps.rpg.world.map_projection", "app.apps.rpg.world.map_repository", "app.apps.rpg.world.map_serialization", "app.apps.rpg.world.map_settlement_assembler", "app.apps.rpg.world.map_world_integration", "app.apps.rpg.world.grid_runtime_performance", "app.apps.rpg.world.grid_runtime_performance_service", "app.apps.rpg.world.npc", "app.apps.rpg.world.npc_evolution", "app.apps.rpg.world.memory", "app.apps.rpg.world.scene"]

# Track R (R-1 to R-3): RPG's bounded contexts, lowest first; docs/architecture/RPG_CONTEXTS.md.
# A context imports only the contexts listed before it (AL017). Every top-level
# entry of app/apps/rpg belongs to exactly one context.
[rpg_contexts]
order = ["foundation", "rules", "world", "narration", "genesis", "session", "edge"]
# Each context is a package under app/apps/rpg (R-3); its entries are the
# context root and the former top-level entries now inside it.
foundation = ["foundation", "foundation.core", "foundation.compat", "foundation.safe_values", "foundation.events", "foundation.debug_logging", "foundation.performance_trace", "foundation.analytics", "foundation.response_trace_headers", "foundation.llm_priority", "foundation.llm_app_gateway", "foundation.provider_access", "foundation.narrative_provider", "foundation.persistence", "foundation.foreground_turn_record", "foundation.systems", "foundation.sandbox"]
rules = ["rules", "rules.action_resolver", "rules.items", "rules.economy", "rules.combat", "rules.interactions", "rules.party", "rules.player", "rules.character", "rules.validation", "rules.survival", "rules.survival_action_context", "rules.survival_tick_runtime", "rules.quest", "rules.choice"]
world = ["world", "world.world_graph", "world.locations", "world.spatial", "world.tactical_spatial", "world.tactical_spatial_service", "world.map_actions", "world.map_actor_footprints", "world.map_content_editor", "world.map_content_validation", "world.map_contracts", "world.map_effective_geometry", "world.map_geometry_patch", "world.map_geometry_patch_service", "world.map_grid_contracts", "world.map_hierarchy", "world.map_instance_runtime", "world.map_living_overlay", "world.map_living_state", "world.map_observer_runtime", "world.map_observer_service", "world.map_overlay_projection", "world.map_projection", "world.map_repository", "world.map_serialization", "world.map_settlement_assembler", "world.map_world_integration", "world.grid_runtime_performance", "world.grid_runtime_performance_service", "world.npc", "world.npc_evolution", "world.social", "world.memory", "world.scene"]
narration = ["narration", "narration.ai", "narration.cognitive", "narration.narrative", "narration.narrative_engine", "narration.narrative_delivery", "narration.narrative_reference", "narration.narrative_repository", "narration.narrative_retirement", "narration.response_generation", "narration.dialogue", "narration.dialogue_state", "narration.npc_dialogue", "narration.presentation", "narration.coherence", "narration.prompt_profiles", "narration.visual", "narration.story", "narration.journal", "narration.campaign_journal_runtime"]
genesis = ["genesis", "genesis.creator", "genesis.profiles", "genesis.modding", "genesis.worlds", "genesis.forge"]
session = ["session", "session.jobs", "session.interactive_cli_state_checkpoint"]
edge = ["edge", "edge.api", "edge.hermes", "edge.replay", "edge.narrative_replay", "feature", "declarations", "edge.services", "edge.release_finalization", "edge.release_gates", "edge.local_live_smoke", "edge.dialogue_quality_benchmark", "edge.local_dialogue_quality_fixtures", "edge.agent", "__init__"]

# RQ-2.8 (A4): engine code holds no world content. AL021 counts strings in these contexts that name the starter
# world's people and places, or the ids the engine's old copies of it used; the world is its bundle,
# resources/examples/rpg/world-bundles/the-market-road/. The baseline only shrinks, to 0.
[rpg_world_content]
contexts = ["rules", "world", "session", "narration"]
names = ["Rusty Flagon", "Frosted Flagon", "Glimmerdeep", "Frostpine", "Frost Haven", "Icefang", "Bran", "Mira", "Elara",
         "Aldric", "Tomas", "Thorin", "Elandra", "Kael", "Bryn", "Marta", "GuardCaptain", "loc_tavern", "loc_market",
         "loc_patrol", "rusty_flagon", "npc_innkeeper", "npc_merchant", "npc_guard_captain", "glimmerdeep_pass",
         "market_district", "northern_road", "old_quarry"]

[production]
entrypoints = ["src/__init__.py", "src/launch.py", "src/main.py", "src/services/stt/nemotron_eou_stt_server.py", "src/services/stt/parakeet_stt_runtime.py", "src/services/stt/parakeet_stt_server.py", "src/services/tts/tts_server.py", "src/sitecustomize.py", "src/usercustomize.py"]

