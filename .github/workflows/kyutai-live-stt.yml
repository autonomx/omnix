name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack playwright requests "websockets>=12"
          npm install

      - name: Lint Kyutai live STT modules
        run: |
          ruff check \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py

      - name: Run Kyutai live STT unit and bridge tests
        run: |
          python -m pytest \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            -q --tb=short

      - name: Typecheck negotiated STT browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-stt-typecheck.txt
          typecheck_status=${PIPESTATUS[0]}
          set -e
          if grep -E "live-(voice-websocket(\\.spec)?|accepted-final)\\.ts" live-stt-typecheck.txt; then
            echo "TypeScript errors were reported in the negotiated live STT path."
            exit "${typecheck_status:-1}"
          fi
          if [ "$typecheck_status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the negotiated live STT files."
          fi

      - name: Test negotiated browser STT client
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts
