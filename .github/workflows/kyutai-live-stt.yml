name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi uvicorn msgpack playwright "websockets>=12"

      - name: Lint Kyutai live STT modules
        run: |
          ruff check \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_live_stt.py

      - name: Run Kyutai live STT unit tests
        run: |
          python -m pytest \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_stt_streaming_audio.py \
            -q --tb=short
