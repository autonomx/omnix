name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Import launcher entry points on Python 3.10
        run: |
          python -c "from app.gateway.live_call_prewarm import register_live_call_prewarm_routes; from app.gateway.live_chat_async_sse_bridge import eager_async_sse_stream; from app.gateway.live_chat_lmstudio_diagnostics import install_live_chat_lmstudio_diagnostics_hook; from app.gateway.live_chat_prompt_window import install_live_chat_prompt_window_hook; from app.gateway.live_chat_prompt_dependency_stages import install_live_chat_prompt_dependency_stage_hook; from app.gateway.live_sse_transport import install_live_sse_transport_hook; from app.gateway.lmstudio_loaded_model_resolution import install_lmstudio_loaded_model_resolution_hook; from app.gateway.live_chat_provider_routing import route_chat_request; from app.gateway.live_chat_speculation import LiveSpeculationRequest; from app.gateway.live_voice_execution_lane import PriorityTtsScheduler; from app.gateway.live_voice_runtime_offload import get_cached_live_tts_provider; from app.gateway.live_voice_speculative_tts import SpeculativeTtsPrefetchRequest; from app.gateway.live_chat_speculation_handshake import register_live_chat_speculation_handshake_routes; from app.gateway.live_chat_speculation_inline_stream import register_live_chat_speculation_inline_stream_routes; from app.gateway.tts_live_call_pcm_diagnostics import install_tts_live_call_pcm_diagnostics_hook; from app.gateway.tts_live_call_startup_frame_policy import install_tts_live_call_startup_frame_policy; from app.gateway.tts_live_call_websocket import register_tts_live_call_websocket; from app.gateway.tts_stream_contract import TtsStreamRequest; from app.providers.kyutai_authority import KyutaiAuthorityMode; from app.launcher.runtime_control_app import app; import kyutai_stt_runtime"

      - name: Validate secure Moshi entrypoint
        run: bash -n scripts/kyutai_moshi_secure_entrypoint.sh

      - name: Lint live latency and launcher modules
        run: |
          ruff check \
            scripts/run_kyutai_moshi.py \
            src/app/chat/live_agent_store.py \
            src/app/launcher/huggingface_token_control.py \
            src/app/launcher/huggingface_token_store.py \
            src/app/launcher/kyutai_services.py \
            src/app/launcher/runtime_control_app.py \
            src/app/providers/lmstudio_provider.py \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/kyutai_transcript_normalization.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/blocking_route_offload.py \
            src/app/gateway/live_call_prewarm.py \
            src/app/gateway/live_chat_async_sse_bridge.py \
            src/app/gateway/live_chat_lmstudio_diagnostics.py \
            src/app/gateway/live_chat_prompt_cache.py \
            src/app/gateway/live_chat_prompt_dependency_stages.py \
            src/app/gateway/live_chat_prompt_window.py \
            src/app/gateway/live_chat_provider_routing.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/live_chat_speculative_tts.py \
            src/app/gateway/live_chat_speculation_handshake.py \
            src/app/gateway/live_chat_speculation_inline_stream.py \
            src/app/gateway/live_sse_transport.py \
            src/app/gateway/live_voice_execution_lane.py \
            src/app/gateway/live_voice_runtime_offload.py \
            src/app/gateway/live_voice_speculative_tts.py \
            src/app/gateway/lmstudio_loaded_model_resolution.py \
            src/app/gateway/tts_live_call_pcm_diagnostics.py \
            src/app/gateway/tts_live_call_startup_frame_policy.py \
            src/app/gateway/tts_live_call_websocket.py \
            src/app/gateway/tts_live_capabilities.py \
            src/app/gateway/tts_stream_contract.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_chat_response_metrics.py \
            src/tests/app/test_gateway_blocking_route_offload.py \
            src/tests/app/test_launcher_huggingface_token.py \
            src/tests/app/test_launcher_kyutai_readiness.py \
            src/tests/app/test_kyutai_launcher_services.py \
            src/tests/app/test_kyutai_moshi_launcher.py \
            src/tests/app/test_kyutai_stt_runtime.py \
            src/tests/app/test_kyutai_transcript_normalization.py \
            src/tests/app/test_live_call_prewarm.py \
            src/tests/app/test_live_chat_lmstudio_diagnostics.py \
            src/tests/app/test_live_chat_prompt_window.py \
            src/tests/app/test_live_chat_provider_routing.py \
            src/tests/app/test_live_chat_speculative_tts.py \
            src/tests/app/test_live_voice_execution_lane.py \
            src/tests/app/test_live_voice_speculative_tts.py \
            src/tests/app/test_lmstudio_loaded_model_resolution.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_prompt_cache.py \
            src/tests/app/test_live_chat_prompt_dependency_stages.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_live_chat_speculation_handshake.py \
            src/tests/app/test_live_chat_speculation_inline_stream.py \
            src/tests/app/test_live_sse_transport.py \
            src/tests/app/test_tts_live_call_pcm_diagnostics.py \
            src/tests/app/test_tts_live_call_startup_frame_policy.py \
            src/tests/app/test_tts_live_capabilities.py \
            src/tests/app/test_tts_stream_contract.py \
            src/tests/unit/chat/test_live_agent_store.py
          ruff check --ignore RUF100,TRY004 src/app/launcher/kyutai_readiness_control.py

      - name: Run live latency and launcher tests
        run: |
          python -m pytest \
            src/tests/app/test_chat_response_metrics.py \
            src/tests/app/test_gateway_blocking_route_offload.py \
            src/tests/app/test_launcher_huggingface_token.py \
            src/tests/app/test_launcher_kyutai_readiness.py \
            src/tests/app/test_kyutai_launcher_services.py \
            src/tests/app/test_kyutai_moshi_launcher.py \
            src/tests/app/test_kyutai_stt_runtime.py \
            src/tests/app/test_kyutai_transcript_normalization.py \
            src/tests/app/test_live_call_prewarm.py \
            src/tests/app/test_live_chat_lmstudio_diagnostics.py \
            src/tests/app/test_live_chat_prompt_window.py \
            src/tests/app/test_live_chat_provider_routing.py \
            src/tests/app/test_live_chat_speculative_tts.py \
            src/tests/app/test_live_voice_execution_lane.py \
            src/tests/app/test_live_voice_speculative_tts.py \
            src/tests/app/test_lmstudio_loaded_model_resolution.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_prompt_cache.py \
            src/tests/app/test_live_chat_prompt_dependency_stages.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_live_chat_speculation_handshake.py \
            src/tests/app/test_live_chat_speculation_inline_stream.py \
            src/tests/app/test_live_sse_transport.py \
            src/tests/app/test_tts_live_call_pcm_diagnostics.py \
            src/tests/app/test_tts_live_call_startup_frame_policy.py \
            src/tests/app/test_tts_live_capabilities.py \
            src/tests/app/test_tts_stream_contract.py \
            src/tests/unit/chat/test_live_agent_store.py \
            -q --tb=short

      - name: Typecheck live latency browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-stt-typecheck.txt
          typecheck_status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(call-prewarm-controller(\\.test)?|chat-submission-gateway(\\.test)?|conversation-durable-evaluation-controller(\\.test)?|runtime-provenance|voice-websocket(\\.spec)?|voice-controller|voice-turn-coordinator(\\.test)?|accepted-final|stt-authority-controller|speculation-controller(\\.test)?|speculation-early-trigger(\\.test)?|speculation-runtime(\\.test)?|speculation-eligibility-diagnostics(\\.test)?|speculation-handshake-transport(\\.test)?|tts-adaptive-buffer-controller(\\.test)?|tts-capability-controller|voice-clause-stabilizer(\\.test)?|speech-delivery-plan(\\.test)?|voice-pcm-worklet|voice-release-observer(-speech-end)?(\\.test)?|latency-rollout\\.spec)\\.(ts|tsx)|assistant-context-(controller|critical-path\\.test)\\.(ts|tsx)|chat-response-metrics-controller(\\.test)?\\.ts|characterClient(\\.test)?\\.ts|vite\\.config\\.ts|src/main\\.tsx)" live-stt-typecheck.txt; then
            echo "TypeScript errors were reported in the live latency rollout path."
            exit "${typecheck_status:-1}"
          fi
          if [ "$typecheck_status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the live latency files."
          fi

      - name: Test live latency browser controllers
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-call-prewarm-controller.test.ts \
            src/features/assistant-workspace/live-chat-submission-gateway.test.ts \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            src/features/assistant-workspace/live-speculation-controller.test.ts \
            src/features/assistant-workspace/live-speculation-early-trigger.test.ts \
            src/features/assistant-workspace/live-speculation-runtime.test.ts \
            src/features/assistant-workspace/live-speculation-eligibility-diagnostics.test.ts \
            src/features/assistant-workspace/live-speculation-handshake-transport.test.ts \
            src/features/assistant-workspace/live-voice-turn-coordinator.test.ts \
            src/features/assistant-workspace/live-voice-clause-stabilizer.test.ts \
            src/features/assistant-workspace/live-speech-delivery-plan.test.ts \
            src/features/assistant-workspace/assistant-context-critical-path.test.ts \
            src/features/assistant-workspace/live-tts-adaptive-buffer-controller.test.ts \
            src/features/assistant-workspace/live-voice-pcm-worklet.test.ts \
            src/features/assistant-workspace/live-voice-release-observer.test.ts \
            src/features/assistant-workspace/live-voice-release-observer-speech-end.test.ts \
            src/features/assistant-workspace/live-conversation-durable-evaluation-controller.test.ts \
            src/features/chatbot/chat-response-metrics-controller.test.ts \
            src/features/chatbot/characterClient.test.ts
