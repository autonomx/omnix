name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply live audio log remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          worklet_path = Path('apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.ts')
          worklet = worklet_path.read_text(encoding='utf-8')
          if '  enterIdle() {' not in worklet:
              rebuffer_start = (
                  "  beginRebuffering() {\n"
                  "    if (this.waitingForBuffer) return;\n"
                  "    this.waitingForBuffer = true;\n"
                  "    this.underrunCount += 1;\n"
              )
              idle_method = (
                  "  enterIdle() {\n"
                  "    if (!this.started && !this.waitingForBuffer) return;\n"
                  "    this.started = false;\n"
                  "    this.waitingForBuffer = false;\n"
                  "    this.waitingForFollowingSpeech = false;\n"
                  "    this.currentRebufferSamples = this.rebufferSamples;\n"
                  "    this.lastOutputSample = 0;\n"
                  "    this.emit('idle', {\n"
                  "      buffered_samples: this.queuedSamples,\n"
                  "      buffered_speech_samples: this.bufferedSpeechSamples,\n"
                  "      underrun_count: this.underrunCount,\n"
                  "    });\n"
                  "  }\n\n"
                  + rebuffer_start
              )
              if rebuffer_start not in worklet:
                  raise SystemExit('worklet rebuffer insertion point was not found')
              worklet = worklet.replace(rebuffer_start, idle_method, 1)

              idle_transition = (
                  "      if (this.inputEnded) return this.signalDrained();\n"
                  "      this.beginRebuffering();\n"
              )
              corrected_transition = (
                  "      if (this.inputEnded) return this.signalDrained();\n"
                  "      if (this.activeSegment === null && this.queuedSamples === 0) {\n"
                  "        this.enterIdle();\n"
                  "      } else {\n"
                  "        this.beginRebuffering();\n"
                  "      }\n"
              )
              if idle_transition not in worklet:
                  raise SystemExit('worklet idle transition point was not found')
              worklet = worklet.replace(idle_transition, corrected_transition, 1)
              worklet_path.write_text(worklet, encoding='utf-8')

          test_path = Path('apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'treats a completed persistent-session turn as idle instead of an underrun'
          if test_name not in tests:
              additions = r"""

            it('treats a completed persistent-session turn as idle instead of an underrun', () => {
              const processor = createProcessor();
              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-0',
                segmentKind: 'speech',
                phraseIndex: 0,
                samples: new Float32Array([0.2, 0.2, 0.2, 0.2]),
              });
              send(processor, { type: 'segment_end', segmentId: 'speech-0' });
              render(processor);

              expect(events(processor, 'started')).toHaveLength(1);
              expect(events(processor, 'idle')).toHaveLength(1);
              expect(events(processor, 'underrun')).toHaveLength(0);

              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-1',
                segmentKind: 'speech',
                phraseIndex: 1,
                samples: new Float32Array([0.3, 0.3]),
              });
              render(processor);
              expect(events(processor, 'started')).toHaveLength(1);

              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-1',
                segmentKind: 'speech',
                phraseIndex: 1,
                samples: new Float32Array([0.3, 0.3]),
              });
              send(processor, { type: 'segment_end', segmentId: 'speech-1' });
              render(processor);

              expect(events(processor, 'started')).toHaveLength(2);
              expect(events(processor, 'idle')).toHaveLength(2);
              expect(events(processor, 'underrun')).toHaveLength(0);
            });

            it('still counts starvation before an active segment ends as an underrun', () => {
              const processor = createProcessor();
              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-starved',
                segmentKind: 'speech',
                phraseIndex: 0,
                samples: new Float32Array([0.2, 0.2, 0.2, 0.2]),
              });
              render(processor);

              expect(events(processor, 'idle')).toHaveLength(0);
              expect(events(processor, 'underrun')).toEqual([
                expect.objectContaining({
                  buffered_samples: 0,
                  buffered_speech_samples: 0,
                  underrun_count: 1,
                }),
              ]);
            });
          """
              closing = '\n});\n'
              if not tests.endswith(closing):
                  raise SystemExit('worklet test suite closing marker was not found')
              test_path.write_text(tests[:-len(closing)] + additions + closing, encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser dependencies
        run: npm install

      - name: Typecheck changed live audio modules
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-audio-typecheck.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "live-(voice-pcm-worklet|voice-release-observer)\\.(ts|tsx)" live-audio-typecheck.txt; then
            exit "${status:-1}"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the changed live-audio files."
          fi

      - name: Test focused live audio controllers
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            src/features/assistant-workspace/live-voice-pcm-worklet.test.ts \
            src/features/assistant-workspace/live-voice-release-observer.test.ts

      - name: Commit tested live audio source
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.ts \
            apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.test.ts
          if git diff --cached --quiet; then
            echo "Live audio remediation is already committed."
          else
            git commit -m "Distinguish live TTS idle gaps from underruns"
            git push origin HEAD:${{ github.head_ref }}
          fi
