name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply live audio log remediation
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          worklet_path = Path('apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.ts')
          worklet = worklet_path.read_text(encoding='utf-8')
          if '  enterIdle() {' not in worklet:
              before_rebuffer = """  beginRebuffering() {
              if (this.waitingForBuffer) return;
              this.waitingForBuffer = true;
              this.underrunCount += 1;
          """
              after_rebuffer = """  enterIdle() {
              if (!this.started && !this.waitingForBuffer) return;
              this.started = false;
              this.waitingForBuffer = false;
              this.waitingForFollowingSpeech = false;
              this.currentRebufferSamples = this.rebufferSamples;
              this.lastOutputSample = 0;
              this.emit('idle', {
                buffered_samples: this.queuedSamples,
                buffered_speech_samples: this.bufferedSpeechSamples,
                underrun_count: this.underrunCount,
              });
            }

            beginRebuffering() {
              if (this.waitingForBuffer) return;
              this.waitingForBuffer = true;
              this.underrunCount += 1;
          """
              if before_rebuffer not in worklet:
                  raise SystemExit('worklet rebuffer insertion point was not found')
              worklet = worklet.replace(before_rebuffer, after_rebuffer, 1)

              before_idle = """    if (this.queue.length === 0 && !this.cancellationFade) {
              this.applyFadeOut(channel, written);
              this.maybeCompleteActiveSegment();
              if (this.inputEnded) return this.signalDrained();
              this.beginRebuffering();
            }
          """
              after_idle = """    if (this.queue.length === 0 && !this.cancellationFade) {
              this.applyFadeOut(channel, written);
              this.maybeCompleteActiveSegment();
              if (this.inputEnded) return this.signalDrained();
              if (this.activeSegment === null && this.queuedSamples === 0) {
                this.enterIdle();
              } else {
                this.beginRebuffering();
              }
            }
          """
              if before_idle not in worklet:
                  raise SystemExit('worklet idle transition point was not found')
              worklet = worklet.replace(before_idle, after_idle, 1)
              worklet_path.write_text(worklet, encoding='utf-8')

          test_path = Path('apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'treats a completed persistent-session turn as idle instead of an underrun'
          if test_name not in tests:
              additions = r"""

            it('treats a completed persistent-session turn as idle instead of an underrun', () => {
              const processor = createProcessor();
              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-0',
                segmentKind: 'speech',
                phraseIndex: 0,
                samples: new Float32Array([0.2, 0.2, 0.2, 0.2]),
              });
              send(processor, { type: 'segment_end', segmentId: 'speech-0' });
              render(processor);

              expect(events(processor, 'started')).toHaveLength(1);
              expect(events(processor, 'idle')).toHaveLength(1);
              expect(events(processor, 'underrun')).toHaveLength(0);

              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-1',
                segmentKind: 'speech',
                phraseIndex: 1,
                samples: new Float32Array([0.3, 0.3]),
              });
              render(processor);
              expect(events(processor, 'started')).toHaveLength(1);

              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-1',
                segmentKind: 'speech',
                phraseIndex: 1,
                samples: new Float32Array([0.3, 0.3]),
              });
              send(processor, { type: 'segment_end', segmentId: 'speech-1' });
              render(processor);

              expect(events(processor, 'started')).toHaveLength(2);
              expect(events(processor, 'idle')).toHaveLength(2);
              expect(events(processor, 'underrun')).toHaveLength(0);
            });

            it('still counts starvation before an active segment ends as an underrun', () => {
              const processor = createProcessor();
              send(processor, {
                type: 'push_segment_samples',
                segmentId: 'speech-starved',
                segmentKind: 'speech',
                phraseIndex: 0,
                samples: new Float32Array([0.2, 0.2, 0.2, 0.2]),
              });
              render(processor);

              expect(events(processor, 'idle')).toHaveLength(0);
              expect(events(processor, 'underrun')).toEqual([
                expect.objectContaining({
                  buffered_samples: 0,
                  buffered_speech_samples: 0,
                  underrun_count: 1,
                }),
              ]);
            });
          """
              closing = '\n});\n'
              if not tests.endswith(closing):
                  raise SystemExit('worklet test suite closing marker was not found')
              tests = tests[:-len(closing)] + additions + closing
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Import launcher entry points on Python 3.10
        run: |
          python -c "from app.gateway.live_chat_speculation import LiveSpeculationRequest; from app.providers.kyutai_authority import KyutaiAuthorityMode; from app.launcher.runtime_control_app import app; import kyutai_stt_runtime"

      - name: Lint live latency and launcher modules
        run: |
          ruff check \
            scripts/run_kyutai_moshi.py \
            src/app/launcher/huggingface_token_control.py \
            src/app/launcher/huggingface_token_store.py \
            src/app/launcher/kyutai_services.py \
            src/app/launcher/runtime_control_app.py \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/tts_live_capabilities.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_launcher_huggingface_token.py \
            src/tests/app/test_kyutai_launcher_services.py \
            src/tests/app/test_kyutai_moshi_launcher.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py

      - name: Run live latency and launcher tests
        run: |
          python -m pytest \
            src/tests/app/test_launcher_huggingface_token.py \
            src/tests/app/test_kyutai_launcher_services.py \
            src/tests/app/test_kyutai_moshi_launcher.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py \
            -q --tb=short

      - name: Typecheck live latency browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-stt-typecheck.txt
          typecheck_status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(voice-websocket(\\.spec)?|voice-controller|accepted-final|stt-authority-controller|speculation-controller|tts-adaptive-buffer-controller|tts-capability-controller|voice-clause-stabilizer|voice-pcm-worklet|voice-release-observer|latency-rollout\\.spec)\\.(ts|tsx)|src/main\\.tsx)" live-stt-typecheck.txt; then
            echo "TypeScript errors were reported in the live latency rollout path."
            exit "${typecheck_status:-1}"
          fi
          if [ "$typecheck_status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the live latency files."
          fi

      - name: Test live latency browser controllers
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            src/features/assistant-workspace/live-voice-pcm-worklet.test.ts \
            src/features/assistant-workspace/live-voice-release-observer.test.ts

      - name: Commit tested live audio source
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.ts \
            apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.test.ts
          if git diff --cached --quiet; then
            echo "Live audio remediation is already committed."
          else
            git commit -m "Distinguish live TTS idle gaps from underruns"
            git push origin HEAD:${{ github.head_ref }}
          fi
