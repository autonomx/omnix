name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply reviewed controller and websocket fixes
        if: github.event_name == 'pull_request'
        run: |
          cat \
            .github/live-latency-review/controller4.part00 \
            .github/live-latency-review/controller4.part01 \
            .github/live-latency-review/controller4.part02 \
            .github/live-latency-review/controller4.part03 \
            .github/live-latency-review/controller4.part04 \
            .github/live-latency-review/controller4.part05 \
            .github/live-latency-review/controller4.part06 \
            | base64 --decode > /tmp/live-latency-controller.tar.gz
          tar -xzf /tmp/live-latency-controller.tar.gz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Lint live latency modules
        run: |
          ruff check \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/tts_live_capabilities.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py

      - name: Run live latency unit and bridge tests
        run: |
          python -m pytest \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py \
            -q --tb=short

      - name: Typecheck live latency browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-stt-typecheck.txt
          typecheck_status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(voice-websocket(\\.spec)?|voice-controller|accepted-final|stt-authority-controller|speculation-controller|tts-adaptive-buffer-controller|tts-capability-controller|voice-clause-stabilizer|voice-pcm-worklet|latency-rollout\\.spec)\\.ts|src/main\\.tsx)" live-stt-typecheck.txt; then
            echo "TypeScript errors were reported in the live latency rollout path."
            exit "${typecheck_status:-1}"
          fi
          if [ "$typecheck_status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the live latency files."
          fi

      - name: Test live latency browser controllers
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts

      - name: Commit reviewed controller and websocket fixes
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/assistant-workspace/live-voice-controller.ts \
            apps/web/src/features/assistant-workspace/live-voice-websocket.ts
          if ! git diff --cached --quiet; then
            git commit -m "Fix authoritative live voice ownership and STT readiness"
            git push origin HEAD:${{ github.head_ref }}
          fi
