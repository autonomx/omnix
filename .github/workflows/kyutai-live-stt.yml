name: Kyutai live STT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kyutai-live-stt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Import launcher entry points on Python 3.10
        run: |
          python -c "from app.gateway.live_chat_lmstudio_diagnostics import install_live_chat_lmstudio_diagnostics_hook; from app.gateway.live_chat_prompt_window import install_live_chat_prompt_window_hook; from app.gateway.lmstudio_loaded_model_resolution import install_lmstudio_loaded_model_resolution_hook; from app.gateway.live_chat_speculation import LiveSpeculationRequest; from app.gateway.live_chat_speculation_handshake import register_live_chat_speculation_handshake_routes; from app.providers.kyutai_authority import KyutaiAuthorityMode; from app.launcher.runtime_control_app import app; import kyutai_stt_runtime"

      - name: Validate secure Moshi entrypoint
        run: bash -n scripts/kyutai_moshi_secure_entrypoint.sh

      - name: Lint live latency and launcher modules
        run: |
          ruff check \
            scripts/run_kyutai_moshi.py \
            src/app/launcher/huggingface_token_control.py \
            src/app/launcher/huggingface_token_store.py \
            src/app/launcher/kyutai_services.py \
            src/app/launcher/runtime_control_app.py \
            src/app/providers/lmstudio_provider.py \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/blocking_route_offload.py \
            src/app/gateway/live_chat_lmstudio_diagnostics.py \
            src/app/gateway/live_chat_prompt_cache.py \
            src/app/gateway/live_chat_prompt_window.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/live_chat_speculation_handshake.py \
            src/app/gateway/lmstudio_loaded_model_resolution.py \
            src/app/gateway/tts_live_capabilities.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_chat_response_metrics.py \
            src/tests/app/test_gateway_blocking_route_offload.py \
            src/tests/app/test_launcher_huggingface_token.py \
            src/tests/app/test_launcher_kyutai_readiness.py \
            src/tests/app/test_kyutai_launcher_services.py \
            src/tests/app/test_kyutai_moshi_launcher.py \
            src/tests/app/test_kyutai_stt_runtime.py \
            src/tests/app/test_live_chat_lmstudio_diagnostics.py \
            src/tests/app/test_live_chat_prompt_window.py \
            src/tests/app/test_lmstudio_loaded_model_resolution.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_prompt_cache.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_live_chat_speculation_handshake.py \
            src/tests/app/test_tts_live_capabilities.py
          ruff check --ignore RUF100,TRY004 src/app/launcher/kyutai_readiness_control.py

      - name: Run live latency and launcher tests
        run: |
          python -m pytest \
            src/tests/app/test_chat_response_metrics.py \
            src/tests/app/test_gateway_blocking_route_offload.py \
            src/tests/app/test_launcher_huggingface_token.py \
            src/tests/app/test_launcher_kyutai_readiness.py \
            src/tests/app/test_kyutai_launcher_services.py \
            src/tests/app/test_kyutai_moshi_launcher.py \
            src/tests/app/test_kyutai_stt_runtime.py \
            src/tests/app/test_live_chat_lmstudio_diagnostics.py \
            src/tests/app/test_live_chat_prompt_window.py \
            src/tests/app/test_lmstudio_loaded_model_resolution.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_prompt_cache.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_live_chat_speculation_handshake.py \
            src/tests/app/test_tts_live_capabilities.py \
            -q --tb=short

      - name: Typecheck live latency browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-stt-typecheck.txt
          typecheck_status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(conversation-durable-evaluation-controller(\\.test)?|voice-websocket(\\.spec)?|voice-controller|accepted-final|stt-authority-controller|speculation-controller|speculation-handshake-transport(\\.test)?|tts-adaptive-buffer-controller|tts-capability-controller|voice-clause-stabilizer|voice-pcm-worklet|voice-release-observer|latency-rollout\\.spec)\\.(ts|tsx)|assistant-context-(controller|critical-path\\.test)\\.(ts|tsx)|characterClient(\\.test)?\\.ts|src/main\\.tsx)" live-stt-typecheck.txt; then
            echo "TypeScript errors were reported in the live latency rollout path."
            exit "${typecheck_status:-1}"
          fi
          if [ "$typecheck_status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the live latency files."
          fi

      - name: Test live latency browser controllers
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            src/features/assistant-workspace/live-speculation-handshake-transport.test.ts \
            src/features/assistant-workspace/assistant-context-critical-path.test.ts \
            src/features/assistant-workspace/live-voice-pcm-worklet.test.ts \
            src/features/assistant-workspace/live-voice-release-observer.test.ts \
            src/features/assistant-workspace/live-conversation-durable-evaluation-controller.test.ts \
            src/features/chatbot/characterClient.test.ts
