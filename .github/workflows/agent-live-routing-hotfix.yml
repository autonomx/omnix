name: Agent Live routing hotfix

on:
  push:
    branches:
      - agent/general-full-duplex-live

permissions:
  contents: write

jobs:
  patch-live-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-full-duplex-live
      - name: Apply idempotent runtime initializer guards
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/web/src/features/assistant-workspace/live-voice-controller.ts",
              """export function initializeLiveVoiceController(root: ParentNode = document): void {
            if (initialized || typeof window === 'undefined' || typeof document === 'undefined') return;
            initialized = true;
            (window as LiveVoiceWindow).__omnixLiveVoiceControllerInstalled = true;
          """,
              """export function initializeLiveVoiceController(root: ParentNode = document): void {
            if (initialized || typeof window === 'undefined' || typeof document === 'undefined') return;
            const liveWindow = window as LiveVoiceWindow;
            if (liveWindow.__omnixLiveVoiceControllerInstalled) return;
            initialized = true;
            liveWindow.__omnixLiveVoiceControllerInstalled = true;
          """,
          )

          replace_once(
              "apps/web/src/features/assistant-workspace/live-session-coordinator.ts",
              """export function initializeLiveSessionCoordinator(): void {
            if (initialized || typeof window === 'undefined') return;
            initialized = true;
          """,
              """export function initializeLiveSessionCoordinator(): void {
            if (initialized || typeof window === 'undefined') return;
            const liveWindow = window as Window & typeof globalThis & { __omnixLiveSessionCoordinatorInstalled?: boolean };
            if (liveWindow.__omnixLiveSessionCoordinatorInstalled) return;
            initialized = true;
            liveWindow.__omnixLiveSessionCoordinatorInstalled = true;
          """,
          )

          replace_once(
              "apps/web/src/features/assistant-workspace/live-output-coordinator.ts",
              """export function initializeLiveOutputCoordinator(): void {
            if (initialized || typeof window === 'undefined') return;
            initialized = true;
          """,
              """export function initializeLiveOutputCoordinator(): void {
            if (initialized || typeof window === 'undefined') return;
            const liveWindow = window as Window & typeof globalThis & { __omnixLiveOutputCoordinatorInstalled?: boolean };
            if (liveWindow.__omnixLiveOutputCoordinatorInstalled) return;
            initialized = true;
            liveWindow.__omnixLiveOutputCoordinatorInstalled = true;
          """,
          )

          replace_once(
              "apps/web/src/features/assistant-workspace/live-voice-duplex-gate.ts",
              """export function initializeLiveVoiceDuplexGate(): () => void {
            if (typeof window === 'undefined' || typeof navigator === 'undefined') return () => undefined;
            const mediaDevices = navigator.mediaDevices;
          """,
              """export function initializeLiveVoiceDuplexGate(): () => void {
            if (typeof window === 'undefined' || typeof navigator === 'undefined') return () => undefined;
            const liveWindow = window as Window & typeof globalThis & { __omnixLiveVoiceDuplexGateInstalled?: boolean };
            if (liveWindow.__omnixLiveVoiceDuplexGateInstalled) return () => undefined;
            liveWindow.__omnixLiveVoiceDuplexGateInstalled = true;
            const mediaDevices = navigator.mediaDevices;
          """,
          )

          replace_once(
              "apps/web/src/features/assistant-workspace/live-voice-duplex-gate.ts",
              """    trackedStreams.clear();
            };
          }
          """,
              """    trackedStreams.clear();
              liveWindow.__omnixLiveVoiceDuplexGateInstalled = false;
            };
          }
          """,
          )
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-controller.ts \
                  apps/web/src/features/assistant-workspace/live-session-coordinator.ts \
                  apps/web/src/features/assistant-workspace/live-output-coordinator.ts \
                  apps/web/src/features/assistant-workspace/live-voice-duplex-gate.ts
          git commit -m "Prevent duplicate Live runtime installation after reload"
          git push origin HEAD:agent/general-full-duplex-live
