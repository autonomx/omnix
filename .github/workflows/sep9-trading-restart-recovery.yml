name: Sep 9 trading restart recovery integration

on:
  push:
    branches: ["agent/trading-restart-recovery-sep9"]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[sep9-restart-recovery]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-restart-recovery-sep9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused Trading test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Apply restart recovery hardening
        run: python scripts/sep9_apply_trading_restart_recovery.py
      - name: Verify focused restart and execution regressions
        run: |
          python -m compileall -q src/app/trading
          python -m pytest \
            src/tests/trading/test_trading_strategy_universe_archiver.py \
            src/tests/trading/test_trading_strategy_universe_archive_monitor.py \
            src/tests/trading/test_trading_alpaca_iex_execution.py \
            src/tests/trading/test_strategy_stoch_trend_capture.py \
            src/tests/trading/test_strategy_managed_finviz_shadow.py \
            -q --tb=short
          git diff --check
      - name: Commit clean implementation
        run: |
          rm -f scripts/sep9_apply_trading_restart_recovery.py
          rm -f .github/workflows/sep9-trading-restart-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Trading: recover cleanly after missed premarket startup [sep9-restart-recovery]"
          git push origin HEAD:agent/trading-restart-recovery-sep9
