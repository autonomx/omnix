name: Trading strategy research bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-research-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore immutable trading datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v1-${{ runner.os }}-research-bundle-${{ github.run_id }}
          restore-keys: |
            trading-liquidity-datasets-v1-${{ runner.os }}-

      - name: Verify complete frozen dataset
        shell: bash
        run: |
          count="$(find .cache/trading-liquidity-datasets -type f -name 'session-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Frozen session datasets: ${count}"
          if [[ "${count}" -lt 10 ]]; then
            echo "::error::Expected the 10 fingerprint-verified frozen sessions."
            exit 2
          fi

      - name: Upload exact source and frozen datasets
        uses: actions/upload-artifact@v4
        with:
          name: trading-strategy-research-bundle
          path: |
            src
            scripts
            .cache/trading-liquidity-datasets
            pyproject.toml
            requirements.txt
          if-no-files-found: warn
          retention-days: 30
