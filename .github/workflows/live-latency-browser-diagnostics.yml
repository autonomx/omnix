name: Live latency browser diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply reviewed browser fixes
        run: |
          cat \
            .github/live-latency-review/controller4.part00 \
            .github/live-latency-review/controller4.part01 \
            .github/live-latency-review/controller4.part02 \
            .github/live-latency-review/controller4.part03 \
            .github/live-latency-review/controller4.part04 \
            .github/live-latency-review/controller4.part05 \
            .github/live-latency-review/controller4.part06 \
            | base64 --decode > /tmp/live-latency-controller.tar.gz
          tar -xzf /tmp/live-latency-controller.tar.gz
          cat \
            .github/live-latency-review/remaining4.part00 \
            .github/live-latency-review/remaining4.part01 \
            .github/live-latency-review/remaining4.part02 \
            .github/live-latency-review/remaining4.part03 \
            .github/live-latency-review/remaining4.part04 \
            .github/live-latency-review/remaining4.part05 \
            .github/live-latency-review/remaining4.part06 \
            .github/live-latency-review/remaining4.part07 \
            | base64 --decode > /tmp/live-latency-remaining.tar.gz
          tar -xzf /tmp/live-latency-remaining.tar.gz

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run browser diagnostics
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=live-latency-vitest.xml

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-latency-vitest-diagnostics
          path: apps/web/live-latency-vitest.xml
