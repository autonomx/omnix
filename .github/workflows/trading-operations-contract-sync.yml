name: Trading operations contract sync

on:
  push:
    branches: [agent/trading-auto-strategy-roadmap]
    paths:
      - ".github/workflows/trading-operations-contract-sync.yml"

permissions:
  contents: write

jobs:
  sync-generated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Generate shared gateway API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated contract and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          git rm .github/workflows/trading-operations-contract-sync.yml
          if git diff --cached --quiet; then
            echo "No generated contract changes"
            exit 0
          fi
          git commit -m "chore: sync trading operations api contract"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
