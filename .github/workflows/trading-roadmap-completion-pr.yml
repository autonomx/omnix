name: Trading roadmap completion launcher

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/trading-roadmap-completion-pr.yml"

permissions:
  contents: write

jobs:
  apply-roadmap-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      TARGET_BRANCH: agent/trading-auto-strategy-roadmap
    steps:
      - name: Check out PR branch with full history
        uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 0

      - name: Rebase worktree to latest authoritative branch tip
        shell: bash
        run: |
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

      - name: Extract and run staged completion patch
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          source = Path('.github/workflows/trading-roadmap-completion-sync.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PYCODE'\n"
          end_marker = "          PYCODE\n\n      - uses: actions/setup-python@v5"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_trading_roadmap_completion.py').write_text(program, encoding='utf-8')
          PYCODE
          python /tmp/apply_trading_roadmap_completion.py

      - name: Correct explicit active ATM phrasing
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          old = "entered into|enters? into|commenced|launched|currently available"
          new = "entered into|enters? into|enters? (?:an? )?(?:at[- ]the[- ]market|ATM)|commenced|launched|currently available"
          for name in (
              'src/app/trading/catalyst_evidence.py',
              'src/app/trading/research/facts/supply.py',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'active supply cue patch context missing: {name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PYCODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install

      - name: Run focused correctness tests
        run: |
          python -m py_compile src/app/trading/strategy_monitor.py src/app/trading/strategy_repository.py src/app/trading/catalyst_evidence.py src/app/trading/paper_analytics.py
          python -m pytest -q \
            src/tests/trading/test_trading_roadmap_completion.py \
            src/tests/trading/test_trading_paper_analytics.py \
            src/tests/trading/test_trading_catalyst_discovery.py

      - name: Generate exact shared gateway contract
        run: npm --workspace @omnix/web run api:generate

      - name: Commit final implementation and fast-forward across unrelated branch races
        shell: bash
        run: |
          rm -f .github/workflows/trading-roadmap-completion-sync.yml
          rm -f .github/workflows/trading-roadmap-completion-pr.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(trading): close roadmap correctness gaps"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "::error::Latest branch changed overlapping files; refusing to overwrite."
              exit 2
            fi
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Branch advanced during push attempt ${attempt}; retrying safe rebase."
          done
          echo "::error::Branch kept advancing; no force push attempted."
          exit 3
