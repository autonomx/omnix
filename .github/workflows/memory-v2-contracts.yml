name: Memory v2 contract gates

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/MEMORY_V2_ARCHITECTURE.md"
      - "src/app/assistant_memory_v2/**"
      - "src/tests/unit/assistant_memory_v2/**"
      - ".github/workflows/memory-v2-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Memory v2 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install contract test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic ruff

      - name: Lint Memory v2 contracts
        run: |
          ruff check src/app/assistant_memory_v2 src/tests/unit/assistant_memory_v2

      - name: Run Memory v2 contract invariants
        run: |
          python -m pytest src/tests/unit/assistant_memory_v2/test_contracts.py -q --tb=short
