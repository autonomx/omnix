name: PostgreSQL persistence gates

on:
  pull_request:
    branches: [main, "agent/generalized-agent-runtime"]
    paths:
      - "src/app/persistence/**"
      - "src/app/apps/audiobook/**"
      - "src/tests/persistence/**"
      - "src/tests/app/test_chat_*.py"
      - "src/tests/chat/test_live_chat_postgres_fast_path.py"
      - "src/tests/live_voice/test_live_voice_runtime_offload.py"
      - "src/tests/unit/audiobook/**"
      - "src/tests/api/gateway/**"
      - "src/tests/api/test_legacy_ui_retirement.py"
      - "src/tests/unit/test_shared_state_safety.py"
      - "web/src/features/audiobook/**"
      - ".github/workflows/postgresql-persistence.yml"
  push:
    branches: [main]
    paths:
      - "src/app/persistence/**"
      - "src/app/apps/audiobook/**"
      - "src/tests/persistence/**"
      - "src/tests/app/test_chat_*.py"
      - "src/tests/chat/test_live_chat_postgres_fast_path.py"
      - "src/tests/live_voice/test_live_voice_runtime_offload.py"
      - "src/tests/unit/audiobook/**"
      - "src/tests/api/gateway/**"
      - "src/tests/api/test_legacy_ui_retirement.py"
      - "src/tests/unit/test_shared_state_safety.py"
      - "web/src/features/audiobook/**"
      - ".github/workflows/postgresql-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      # Disposable S3-compatible server for the BlobStore contract (WP-5.8).
      OMNIX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      OMNIX_TEST_S3_ACCESS_KEY_ID: omnixtest
      OMNIX_TEST_S3_SECRET_ACCESS_KEY: omnixtestsecret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install persistence test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Apply PostgreSQL migrations
        run: python -m app.persistence migrate
      - name: Initialize empty PostgreSQL authority and local identity
        run: python -c "from app.persistence.startup import bootstrap_postgresql_runtime; bootstrap_postgresql_runtime()"
      - name: Start disposable S3-compatible server (SeaweedFS)
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          printf '%s' '{"identities":[{"name":"omnix","credentials":[{"accessKey":"omnixtest","secretKey":"omnixtestsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3/s3.json"
          docker run -d --name omnix-s3 -p 127.0.0.1:8333:8333 -v "$RUNNER_TEMP/s3:/config:ro"             chrislusf/seaweedfs:latest server -s3 -s3.config=/config/s3.json -dir=/data
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)
            [ "$code" = "403" ] && exit 0
            sleep 1
          done
          docker logs omnix-s3
          exit 1
      - name: Compile hardening modules
        run: |
          python -m py_compile \
            src/main.py src/app/composition/production.py \
            src/app/apps/audiobook/document_structure.py \
            src/app/apps/audiobook/document_structure_classifier.py \
            src/app/apps/audiobook/document_structure_repository.py

      - name: Run PostgreSQL persistence tests
        run: |
          set -o pipefail
          python -m pytest \
            src/tests/persistence \
            src/tests/chat/test_chat_execution_capacity.py \
            src/tests/app/test_chat_generation.py \
            src/tests/app/test_gateway_scaling_lifecycle.py \
            src/tests/chat/test_live_chat_postgres_fast_path.py \
            src/tests/live_voice/test_live_voice_runtime_offload.py \
            src/tests/api/gateway/test_gateway_runtime_baseline.py \
            src/tests/api/gateway/test_gateway_foundation.py \
            src/tests/api/test_legacy_ui_retirement.py \
            src/tests/unit/test_shared_state_safety.py \
            src/tests/unit/audiobook/test_annotation.py \
            src/tests/unit/audiobook/test_classifier.py \
            src/tests/unit/audiobook/test_dialogue_coverage.py \
            src/tests/unit/audiobook/test_style_discovery.py \
            src/tests/unit/audiobook/test_assembly.py \
            src/tests/unit/audiobook/test_render_identity_and_speech.py \
            src/tests/unit/audiobook/test_export.py \
            src/tests/unit/audiobook/test_document_structure.py \
            src/tests/unit/audiobook/test_document_structure_classifier.py \
            src/tests/unit/audiobook/test_render_planner.py \
            src/tests/unit/audiobook/test_source_integrity.py \
            src/tests/unit/audiobook/test_routes.py \
            -q --tb=short 2>&1 | tee postgresql-pytest-output.txt
      - name: Upload PostgreSQL pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-pytest-output
          path: postgresql-pytest-output.txt
      - name: Verify migrations and health through CLI
        run: |
          python -m app.persistence migrate
          python -m app.persistence verify
