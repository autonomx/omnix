name: Trading V3 recovery precision search repaired

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v3-recovery-precision-search-repair.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact 103-session causal cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-extended-32621017259-1
          fail-on-cache-miss: true

      - name: Recover exact fingerprinted one-shot script
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          import re
          from pathlib import Path

          expected = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          workflow = Path(".github/workflows/trading-v3-recovery-precision-search.yml").read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', workflow)
          if match is None:
              raise SystemExit("embedded research payload not found")
          payload = match.group(1)

          candidates = [(None, payload)]
          candidates.extend((index, payload[:index] + payload[index + 1:]) for index in range(len(payload)))
          recovered = None
          for removed_index, candidate in candidates:
              try:
                  source = gzip.decompress(base64.b64decode(candidate, validate=True))
              except Exception:
                  continue
              if hashlib.sha256(source).hexdigest() == expected:
                  recovered = (removed_index, source)
                  break
          if recovered is None:
              raise SystemExit("could not recover the exact fingerprinted research script")
          removed_index, source = recovered
          Path("/tmp/run_recovery_precision_search.py").write_bytes(source)
          print(f"Recovered exact research source sha256={expected}; removed_index={removed_index}")
          PYCODE
          python -m py_compile /tmp/run_recovery_precision_search.py

      - name: Run causal recovery precision search
        run: |
          python /tmp/run_recovery_precision_search.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2025-10-01 \
            --derivation-end 2025-12-31 \
            --oos-start 2026-01-02 \
            --oos-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --output-dir artifacts/v3-recovery-precision-search

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/v3-recovery-precision-search/summary.md ]]; then
            cat artifacts/v3-recovery-precision-search/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-recovery-precision-search-repaired
          path: artifacts/v3-recovery-precision-search
          if-no-files-found: warn
          retention-days: 30
