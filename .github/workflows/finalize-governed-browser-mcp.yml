name: Finalize governed browser MCP providers

on:
  push:
    branches: ["agent/governed-browser-mcp"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-browser-mcp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply asserted final hardening
        run: python scripts/finalize_governed_browser_mcp.py
      - name: Compile governed provider modules
        run: |
          python -m compileall -q src/app/agent_runtime src/app/assistant_tools
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright \
            "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Run focused governed-provider tests
        run: python -m pytest src/tests/agent_runtime/test_governed_browser_mcp.py -q --tb=short
      - name: Run complete Agent Runtime suite
        run: python -m pytest src/tests/agent_runtime -q --tb=short
      - name: Regenerate web API contracts
        run: npm --workspace @omnix/web run api:generate
      - name: Typecheck web integration
        run: npm --workspace @omnix/web run typecheck
      - name: Verify generated API contract
        run: npm --workspace @omnix/web run api:check
      - name: Commit hardened providers and remove carrier
        shell: bash
        run: |
          git rm scripts/finalize_governed_browser_mcp.py .github/workflows/finalize-governed-browser-mcp.yml
          git add \
            src/app/agent_runtime \
            src/app/assistant_tools \
            src/tests/agent_runtime/test_governed_browser_mcp.py \
            docs/agent-runtime-browser-mcp.md \
            src/apps/web/src/api/generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): finalize governed browser and MCP providers"
          git push origin HEAD:agent/governed-browser-mcp
