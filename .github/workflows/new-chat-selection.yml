name: New chat selection

on:
  pull_request:
    paths:
      - "src/apps/web/src/features/chatbot/newChatCoordinator.ts"
      - "src/apps/web/src/features/chatbot/newChatCoordinator.test.ts"
      - "src/apps/web/src/features/chatbot/chat-sidebar-manager.ts"
      - "src/apps/web/src/features/chatbot/chat-sidebar-manager.test.ts"
      - "src/apps/web/src/features/chatbot/chat-sidebar-manager.css"
      - "src/apps/web/src/features/chatbot/sessionTools.ts"
      - "src/apps/web/src/features/chatbot/sessionTools.test.ts"
      - "src/apps/web/src/features/chatbot/live-chat-fullscreen-controller.ts"
      - "src/apps/web/src/features/chatbot/live-chat-fullscreen-controller.test.ts"
      - ".github/workflows/new-chat-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-new-chat-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install web dependencies
        run: npm ci
      - name: Typecheck chat sidebar changes
        run: npm --workspace @omnix/web run typecheck
      - name: Verify new chat creation and selection
        run: >-
          npm --workspace @omnix/web run test --
          src/features/chatbot/newChatCoordinator.test.ts
          src/features/chatbot/chat-sidebar-manager.test.ts
          src/features/chatbot/sessionTools.test.ts
          src/features/chatbot/live-chat-fullscreen-controller.test.ts
