name: New chat selection

on:
  pull_request:
    paths:
      - "web/src/features/assistant/chat/newChatCoordinator.ts"
      - "web/src/features/assistant/chat/newChatCoordinator.test.ts"
      - "web/src/features/assistant/chat/chat-sidebar-manager.ts"
      - "web/src/features/assistant/chat/chat-sidebar-manager.test.ts"
      - "web/src/features/assistant/chat/chat-sidebar-manager.css"
      - "web/src/features/assistant/chat/sessionTools.ts"
      - "web/src/features/assistant/chat/sessionTools.test.ts"
      - "web/src/features/assistant/chat/live-chat-fullscreen-controller.ts"
      - "web/src/features/assistant/chat/live-chat-fullscreen-controller.test.ts"
      - ".github/workflows/new-chat-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-new-chat-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install web dependencies
        run: npm ci
      - name: Typecheck chat sidebar changes
        run: npm --workspace @omnix/web run typecheck
