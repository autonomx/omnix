name: Trading V2 shadow raw archive patch

on:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - scripts/patch_trading_v2_shadow_raw_archive.py
      - .github/workflows/trading-v2-shadow-raw-archive.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Apply guarded raw-archive integration
        run: python scripts/patch_trading_v2_shadow_raw_archive.py

      - name: Run V2 shadow and archive regressions
        run: |
          python -m pytest \
            src/tests/trading/test_trading_strategy_shadow_universe.py \
            src/tests/trading/test_trading_strategy_shadow_execution.py \
            src/tests/trading/test_trading_strategy_universe_archiver.py \
            src/tests/trading/test_trading_gap_pullback_v2.py \
            -q --tb=short
          git diff --check

      - name: Commit qualified patch
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/trading/strategy_monitor.py src/tests/trading/test_trading_strategy_shadow_universe.py
          git commit -m "trading: evaluate V2 shadow on raw daily archive"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Report success
        if: success()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "V2 prospective SHADOW raw-archive integration passed shadow/archive/V2 regressions and pushed \`${{ steps.commit.outputs.sha }}\`. With no active universe, 2.0 SHADOW reads today's strategy-owned immutable auto-archive without mutating active_universe_id; shadow execution events record universe_source for qualification filtering."

      - name: Report failure
        if: failure()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "V2 prospective SHADOW raw-archive integration failed on source head \`${GITHUB_SHA}\`. No monitor patch from this run should be trusted; inspect the workflow before continuing."
