name: Regenerate Agent API once

on:
  push:
    branches:
      - agent/coding-quality-phases-20-31
    paths:
      - .github/workflows/regenerate-agent-api-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coding-quality-phases-20-31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright \
            "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Regenerate checked-in API artifacts
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated artifacts and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          git rm .github/workflows/regenerate-agent-api-once.yml
          if git diff --cached --quiet; then
            echo "No generated API changes were required."
            exit 0
          fi
          git commit -m "chore: regenerate agent API contract"
          git push origin HEAD:agent/coding-quality-phases-20-31
