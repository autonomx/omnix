name: Trading V2 cached geometry diagnostic

on:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - scripts/run_trading_strategy_v2_geometry_diagnostic.py
      - .github/workflows/trading-v2-cached-geometry-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cache-only backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets pytest playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore immutable causal datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-${{ runner.os }}-diagnostic-${{ github.run_id }}
          restore-keys: |
            trading-liquidity-datasets-v2-causal-${{ runner.os }}-
          fail-on-cache-miss: true

      - name: Run development-only V2 rejection funnel
        run: |
          python scripts/run_trading_strategy_v2_geometry_diagnostic.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2026-01-02 \
            --development-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --minimum-coverage-ratio 0.80 \
            --minimum-covered-sessions 20 \
            --output-dir artifacts/v2-geometry-diagnostic

      - name: Publish diagnostic summary
        if: always()
        run: |
          if [[ -f artifacts/v2-geometry-diagnostic/summary.md ]]; then
            cat artifacts/v2-geometry-diagnostic/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v2-cached-geometry-diagnostic
          path: artifacts/v2-geometry-diagnostic
          if-no-files-found: error
          retention-days: 30
