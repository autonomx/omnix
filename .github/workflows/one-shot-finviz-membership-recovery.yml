name: One-shot Finviz membership recovery

on:
  push:
    branches: ["agent/taskgraph-phases-15-19"]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taskgraph-phases-15-19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Implement Finviz membership-only premarket authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # Version the semantic break so old qualification evidence cannot silently carry over.
          path = "src/app/trading/market_evidence.py"
          text = read(path)
          text = text.replace(
              'MARKET_EVIDENCE_POLICY_VERSION = "market-evidence-v2"',
              'MARKET_EVIDENCE_POLICY_VERSION = "market-evidence-v3-finviz-membership"',
          )
          write(path, text)

          path = "src/app/trading/strategy_v2_qualification.py"
          text = read(path)
          text = text.replace(
              'V2_QUALIFICATION_VERSION = "v2-prospective-qualification-2"',
              'V2_QUALIFICATION_VERSION = "v2-prospective-qualification-3"',
          )
          text = text.replace(
              'V2_REPLAY_VERSION = "v2-shadow-replay-2"',
              'V2_REPLAY_VERSION = "v2-shadow-replay-3"',
          )
          write(path, text)

          # Managed Finviz V2: frozen Top-N membership is premarket authority.
          path = "src/app/trading/strategy_evaluability.py"
          text = read(path)
          marker = '_MAX_LATEST_BAR_LATENCY_SECONDS = Decimal("90")\n'
          helper = '''_MAX_LATEST_BAR_LATENCY_SECONDS = Decimal("90")\n\n\ndef finviz_membership_only_mode(config) -> bool:\n    """True when Finviz rank membership, not enrichment, owns premarket authority."""\n\n    return (\n        getattr(config, "strategy_version", None) == "2.0.0"\n        and getattr(config, "universe_discovery_source", None) == "finviz"\n    )\n'''
          if 'def finviz_membership_only_mode' not in text:
              if marker not in text:
                  raise SystemExit("strategy_evaluability helper anchor missing")
              text = text.replace(marker, helper, 1)

          start = text.index('def candidate_morning_evidence_eligible(')
          end = text.index('\ndef assess_session_evaluability(', start)
          new_candidate = '''def candidate_morning_evidence_eligible(candidate: GapperCandidate, config) -> tuple[bool, tuple[str, ...]]:\n    """Return premarket authority eligibility for the active strategy contract.\n\n    Managed Finviz V2 intentionally treats the frozen ranked cohort as the only\n    premarket authority. Liquidity, TOD-RVOL, gap/price enrichment and frozen\n    spread remain research features. Optional catalyst/supply constraints are\n    preserved when a profile explicitly enables them.\n    """\n\n    reasons: list[str] = []\n    membership_only = finviz_membership_only_mode(config)\n\n    if not membership_only:\n        liquidity = getattr(candidate, "premarket_liquidity", None)\n        policy_version = getattr(candidate, "market_evidence_policy_version", None)\n        if config.strategy_version == "2.0.0":\n            if policy_version != MARKET_EVIDENCE_POLICY_VERSION:\n                reasons.append("MARKET_EVIDENCE_POLICY_MISMATCH")\n            if liquidity is None:\n                reasons.append("PREMARKET_LIQUIDITY_EVIDENCE_MISSING")\n            else:\n                if liquidity.policy_version != MARKET_EVIDENCE_POLICY_VERSION:\n                    reasons.append("PREMARKET_LIQUIDITY_POLICY_MISMATCH")\n                if not liquidity.ready:\n                    reasons.extend(liquidity.reason_codes)\n                if (\n                    liquidity.baseline_session_count\n                    < DEFAULT_MARKET_EVIDENCE_POLICY.minimum_tod_rvol_baseline_sessions\n                ):\n                    reasons.append("TOD_RVOL_BASELINE_INSUFFICIENT")\n\n        if candidate.gap_pct < config.minimum_gap_pct:\n            reasons.append("GAP_BELOW_MINIMUM")\n        if not config.minimum_price <= candidate.premarket_price <= config.maximum_price:\n            reasons.append("PRICE_OUT_OF_RANGE")\n        if candidate.premarket_dollar_volume < config.minimum_premarket_dollar_volume:\n            reasons.append("PREMARKET_DOLLAR_VOLUME_LOW")\n        if candidate.tod_rvol is None:\n            reasons.append("TOD_RVOL_MISSING")\n        elif candidate.tod_rvol < config.minimum_tod_rvol:\n            reasons.append("TOD_RVOL_LOW")\n\n    # Frozen spread is never entry authority. The live execution observation owns\n    # the spread gate at the actual trade attempt.\n    severe = tuple(\n        flag for flag in candidate.dilution_flags if flag in set(config.reject_dilution_flags)\n    )\n    if config.require_catalyst_evidence and not candidate.catalyst_evidence_ids:\n        reasons.append("CATALYST_EVIDENCE_REQUIRED")\n    if severe:\n        reasons.append("DILUTION_SUPPLY_RISK")\n    if config.float_preference_mode == "require":\n        if (\n            candidate.float_shares is None\n            or not config.preferred_float_min_shares\n            <= candidate.float_shares\n            <= config.preferred_float_max_shares\n        ):\n            reasons.append("FLOAT_OUTSIDE_REQUIRED_RANGE")\n\n    return not reasons, tuple(dict.fromkeys(reasons))\n'''
          text = text[:start] + new_candidate + text[end:]

          # Keep source-accounting failures strict, but premarket research gaps on
          # already-materialized Finviz members no longer make the trading session partial.
          old = '''    qualification_eligible = status in {"complete", "completed_no_trigger"}\n    return SessionEvaluabilityAssessment(\n'''
          new = '''    qualification_eligible = status in {"complete", "completed_no_trigger"}\n    if finviz_membership_only_mode(config):\n        # Trading may proceed from a fully-accounted ranked cohort even when\n        # premarket enrichment is incomplete. Promotion evidence remains stricter:\n        # only sessions with every member materialized and clean research evidence count.\n        blocking_source_failure = bool(failures) or "SOURCE_MEMBER_DISPOSITIONS_INCOMPLETE" in reasons\n        if universe.candidates and not blocking_source_failure:\n            status = "complete"\n        qualification_eligible = bool(\n            status in {"complete", "completed_no_trigger"}\n            and not failures\n            and len(universe.candidates) == len(source_members)\n            and all(candidate.market_data_complete for candidate in universe.candidates)\n        )\n    return SessionEvaluabilityAssessment(\n'''
          if old not in text:
              raise SystemExit("session evaluability qualification anchor missing")
          text = text.replace(old, new, 1)
          if '"finviz_membership_only_mode",' not in text:
              text = text.replace(
                  '    "candidate_morning_evidence_eligible",\n',
                  '    "candidate_morning_evidence_eligible",\n    "finviz_membership_only_mode",\n',
                  1,
              )
          write(path, text)

          # The V2 evaluator must not reject managed Finviz members on research-only morning fields.
          path = "src/app/trading/strategies/failed_selloff_v2.py"
          text = read(path)
          old = '''    rejection: str | None = None\n    if not candidate.market_data_complete:\n        rejection = "DATA_INCOMPLETE"\n    elif candidate.gap_pct < config.minimum_gap_pct:\n        rejection = "GAP_BELOW_MINIMUM"\n    elif not config.minimum_price <= candidate.premarket_price <= config.maximum_price:\n        rejection = "PRICE_OUT_OF_RANGE"\n    elif candidate.premarket_dollar_volume < config.minimum_premarket_dollar_volume:\n        rejection = "PREMARKET_DOLLAR_VOLUME_LOW"\n    elif candidate.tod_rvol is None:\n        # Historical V11 reconstruction could not always recover TOD RVOL and\n        # used a documented diagnostic fallback. Prospective V2 deliberately\n        # fails closed because live/shadow inputs must provide the evidence.\n        rejection = "TOD_RVOL_MISSING"\n    elif candidate.tod_rvol < config.minimum_tod_rvol:\n        rejection = "TOD_RVOL_LOW"\n    elif candidate.spread_bps is None:\n        rejection = "SPREAD_MISSING"\n    elif candidate.spread_bps > config.maximum_spread_bps:\n        rejection = "SPREAD_TOO_WIDE"\n    elif config.require_catalyst_evidence and not candidate.catalyst_evidence_ids:\n        rejection = "CATALYST_EVIDENCE_REQUIRED"\n    elif severe:\n        rejection = "DILUTION_SUPPLY_RISK"\n    elif config.float_preference_mode == "require" and not float_ok:\n        rejection = "FLOAT_OUTSIDE_REQUIRED_RANGE"\n'''
          new = '''    membership_only = (\n        config.strategy_version == "2.0.0"\n        and config.universe_discovery_source == "finviz"\n    )\n    rejection: str | None = None\n    if not membership_only:\n        if not candidate.market_data_complete:\n            rejection = "DATA_INCOMPLETE"\n        elif candidate.gap_pct < config.minimum_gap_pct:\n            rejection = "GAP_BELOW_MINIMUM"\n        elif not config.minimum_price <= candidate.premarket_price <= config.maximum_price:\n            rejection = "PRICE_OUT_OF_RANGE"\n        elif candidate.premarket_dollar_volume < config.minimum_premarket_dollar_volume:\n            rejection = "PREMARKET_DOLLAR_VOLUME_LOW"\n        elif candidate.tod_rvol is None:\n            rejection = "TOD_RVOL_MISSING"\n        elif candidate.tod_rvol < config.minimum_tod_rvol:\n            rejection = "TOD_RVOL_LOW"\n        elif candidate.spread_bps is None:\n            rejection = "SPREAD_MISSING"\n        elif candidate.spread_bps > config.maximum_spread_bps:\n            rejection = "SPREAD_TOO_WIDE"\n    if rejection is None and config.require_catalyst_evidence and not candidate.catalyst_evidence_ids:\n        rejection = "CATALYST_EVIDENCE_REQUIRED"\n    elif rejection is None and severe:\n        rejection = "DILUTION_SUPPLY_RISK"\n    elif rejection is None and config.float_preference_mode == "require" and not float_ok:\n        rejection = "FLOAT_OUTSIDE_REQUIRED_RANGE"\n'''
          if old not in text:
              raise SystemExit("failed_selloff_v2 rejection anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '    reference = max(candidate.premarket_price, regular[0].open)\n',
              '    reference = regular[0].open if membership_only else max(candidate.premarket_price, regular[0].open)\n',
              1,
          )
          write(path, text)

          # The live monitor must wait for/recover live bars instead of permanently
          # skipping members whose premarket research fields were incomplete.
          path = "src/app/trading/strategy_monitor.py"
          text = read(path)
          old = '''            legacy_candidate_contract = not hasattr(\n                universe, "evaluation_time"\n            ) and not hasattr(candidate, "market_data_complete")\n            if getattr(candidate, "market_data_complete", True) is False:\n'''
          new = '''            legacy_candidate_contract = not hasattr(\n                universe, "evaluation_time"\n            ) and not hasattr(candidate, "market_data_complete")\n            membership_only = (\n                config.config.strategy_version == "2.0.0"\n                and getattr(universe, "discovery_source", None) == "finviz"\n            )\n            if getattr(candidate, "market_data_complete", True) is False and not membership_only:\n'''
          if old not in text:
              raise SystemExit("strategy_monitor incomplete gate anchor missing")
          text = text.replace(old, new, 1)
          # Keep telemetry truthful when live bars are valid but premarket research data was not.
          text = text.replace(
              '                    "market_data_complete": True,\n                    "current_session_1m_complete": True,\n',
              '                    "market_data_complete": getattr(candidate, "market_data_complete", True),\n                    "premarket_research_only": membership_only,\n                    "current_session_1m_complete": True,\n',
              1,
          )
          write(path, text)

          # Final order authorization should not require a premarket-liquidity
          # policy fingerprint for membership-only Finviz V2 candidates.
          path = "src/app/trading/trading_data_hardening.py"
          text = read(path)
          text = text.replace(
              '    candidate_morning_evidence_eligible,\n',
              '    candidate_morning_evidence_eligible,\n    finviz_membership_only_mode,\n',
              1,
          )
          old = '''        evidence_policy_matches = bool(\n            candidate is not None\n            and getattr(candidate, "market_evidence_policy_version", None)\n            == MARKET_EVIDENCE_POLICY_VERSION\n        )\n'''
          new = '''        membership_only = bool(\n            candidate is not None\n            and universe is not None\n            and universe.discovery_source == "finviz"\n            and finviz_membership_only_mode(self._config.config)\n        )\n        evidence_policy_matches = bool(\n            membership_only\n            or (\n                candidate is not None\n                and getattr(candidate, "market_evidence_policy_version", None)\n                == MARKET_EVIDENCE_POLICY_VERSION\n            )\n        )\n'''
          if old not in text:
              raise SystemExit("authorization evidence-policy anchor missing")
          text = text.replace(old, new, 1)
          write(path, text)

          # Finviz discovery: top-N rank is the membership decision. Enrichment is
          # best-effort research and may fall back to a venue-neutral US instrument.
          path = "src/app/trading/finviz_gapper_discovery.py"
          text = read(path)
          text = text.replace(
              'from .instrument_catalog_service import _dynamic_bindings, _equity_instrument\n',
              'from .instrument_catalog_service import _dynamic_bindings, _equity_instrument\nfrom .models import AssetClass, CanonicalInstrument, InstrumentType\n',
              1,
          )
          helper_anchor = 'def _spread_bps(bid: Decimal | None, ask: Decimal | None) -> Decimal | None:\n'
          if 'def _provisional_us_equity' not in text:
              idx = text.index(helper_anchor)
              provisional = '''def _provisional_us_equity(symbol: str) -> CanonicalInstrument:\n    """Venue-neutral US equity identity used only when enrichment is unavailable.\n\n    Provider bindings still address the immutable Finviz symbol directly. The\n    venue is deliberately recorded as US rather than guessing NASDAQ/NYSE.\n    """\n\n    clean = symbol.strip().upper()\n    return CanonicalInstrument(\n        instrument_id=f"equity:US:{clean}",\n        asset_class=AssetClass.EQUITY,\n        instrument_type=InstrumentType.EQUITY,\n        venue="US",\n        venue_symbol=clean,\n        display_symbol=clean,\n        base_currency=None,\n        quote_currency="USD",\n        exchange_timezone="America/New_York",\n        session_calendar="XNAS",\n        price_scale=100,\n        minimum_tick=Decimal("0.01"),\n        status="active",\n    )\n\n\n'''
              text = text[:idx] + provisional + text[idx:]

          text = text.replace(
              '    premarket_liquidity_provider: Callable[[str, datetime], PremarketLiquidityEvidence] | None = None,\n) -> GapperUniverseSnapshot:\n',
              '    premarket_liquidity_provider: Callable[[str, datetime], PremarketLiquidityEvidence] | None = None,\n    membership_only: bool = False,\n) -> GapperUniverseSnapshot:\n',
              1,
          )

          old_block = '''    for raw_rank, symbol in enumerate(symbols, start=1):\n        try:\n            price, previous_close, chart_meta, yahoo_liquidity = _yahoo_chart_snapshot(\n                yahoo,\n                symbol,\n                evaluation,\n            )\n        except Exception as exc:\n            dispositions.append(\n                SourceMemberDisposition(\n                    symbol=symbol,\n                    source_rank=raw_rank,\n                    status="enrichment_failed",\n                    reason_codes=(f"YAHOO_CHART_{type(exc).__name__.upper()}",),\n                )\n            )\n            continue\n\n        gap_pct = (price / previous_close - Decimal("1")) * Decimal("100")\n        if gap_pct < minimum_gap_pct:\n            dispositions.append(\n                SourceMemberDisposition(\n                    symbol=symbol,\n                    source_rank=raw_rank,\n                    status="filtered_gap",\n                    reason_codes=("GAP_BELOW_MINIMUM",),\n                )\n            )\n            continue\n        if not minimum_price <= price <= maximum_price:\n            dispositions.append(\n                SourceMemberDisposition(\n                    symbol=symbol,\n                    source_rank=raw_rank,\n                    status="filtered_price",\n                    reason_codes=("PRICE_OUT_OF_RANGE",),\n                )\n            )\n            continue\n\n        search_quote = _yahoo_exact_quote(yahoo, symbol)\n        enrichment_at = datetime.now(timezone.utc)\n        quote_for_instrument = search_quote or {\n            "symbol": symbol,\n            "quoteType": "EQUITY",\n            "exchange": chart_meta.get("exchangeName") or chart_meta.get("exchange") or "YAHOO",\n        }\n        instrument = _equity_instrument(quote_for_instrument)\n'''
          new_block = '''    for raw_rank, symbol in enumerate(symbols, start=1):\n        search_quote = None\n        chart_error_code: str | None = None\n        provisional_identity = False\n        try:\n            price, previous_close, chart_meta, yahoo_liquidity = _yahoo_chart_snapshot(\n                yahoo,\n                symbol,\n                evaluation,\n            )\n        except Exception as exc:\n            chart_error_code = f"YAHOO_CHART_{type(exc).__name__.upper()}"\n            if not membership_only:\n                dispositions.append(\n                    SourceMemberDisposition(\n                        symbol=symbol,\n                        source_rank=raw_rank,\n                        status="enrichment_failed",\n                        reason_codes=(chart_error_code,),\n                    )\n                )\n                continue\n            search_quote = _yahoo_exact_quote(yahoo, symbol)\n            fallback_previous = (\n                _decimal((search_quote or {}).get("regularMarketPreviousClose"))\n                or _decimal((search_quote or {}).get("regularMarketPrice"))\n                or Decimal("1")\n            )\n            fallback_price = (\n                _decimal((search_quote or {}).get("preMarketPrice"))\n                or _decimal((search_quote or {}).get("regularMarketPrice"))\n                or fallback_previous\n            )\n            price = fallback_price\n            previous_close = fallback_previous\n            chart_meta = search_quote or {}\n            fallback_at = datetime.now(timezone.utc)\n            yahoo_liquidity = PremarketLiquidityEvidence(\n                policy_version=YAHOO_FALLBACK_EVIDENCE_POLICY_VERSION,\n                provider="yahoo_search" if search_quote else "finviz_membership",\n                feed="quote" if search_quote else "membership_only",\n                observed_at=fallback_at,\n                current_premarket_volume=Decimal("0"),\n                current_premarket_dollar_volume=Decimal("0"),\n                tod_rvol=None,\n                tod_rvol_numerator=Decimal("0"),\n                tod_rvol_denominator_mean=None,\n                baseline_session_count=0,\n                premarket_bar_count=0,\n                nonzero_volume_bar_count=0,\n                coverage_ratio=None,\n                ready=False,\n                reason_codes=(chart_error_code,),\n            )\n\n        gap_pct = (price / previous_close - Decimal("1")) * Decimal("100")\n        if not membership_only and gap_pct < minimum_gap_pct:\n            dispositions.append(\n                SourceMemberDisposition(\n                    symbol=symbol,\n                    source_rank=raw_rank,\n                    status="filtered_gap",\n                    reason_codes=("GAP_BELOW_MINIMUM",),\n                )\n            )\n            continue\n        if not membership_only and not minimum_price <= price <= maximum_price:\n            dispositions.append(\n                SourceMemberDisposition(\n                    symbol=symbol,\n                    source_rank=raw_rank,\n                    status="filtered_price",\n                    reason_codes=("PRICE_OUT_OF_RANGE",),\n                )\n            )\n            continue\n\n        if search_quote is None:\n            search_quote = _yahoo_exact_quote(yahoo, symbol)\n        enrichment_at = datetime.now(timezone.utc)\n        quote_for_instrument = search_quote or {\n            "symbol": symbol,\n            "quoteType": "EQUITY",\n            "exchange": chart_meta.get("exchangeName") or chart_meta.get("exchange") or "YAHOO",\n        }\n        instrument = _equity_instrument(quote_for_instrument)\n        if instrument is None and membership_only:\n            instrument = _provisional_us_equity(symbol)\n            provisional_identity = True\n'''
          if old_block not in text:
              raise SystemExit("Finviz discovery loop anchor missing")
          text = text.replace(old_block, new_block, 1)

          text = text.replace(
              '        research_quality_flags: list[str] = []\n',
              '        research_quality_flags: list[str] = []\n        if chart_error_code is not None:\n            research_quality_flags.append(chart_error_code)\n        if provisional_identity:\n            research_quality_flags.append("PROVISIONAL_US_INSTRUMENT_IDENTITY")\n',
              1,
          )
          text = text.replace(
              '        evidence_times = {\n            "finviz_top_gainers": received_at,\n            "yahoo_chart_enrichment": enrichment_at,\n            f"premarket_liquidity:{liquidity.provider}:{liquidity.feed}": liquidity.observed_at,\n        }\n',
              '        evidence_times = {\n            "finviz_top_gainers": received_at,\n            ("yahoo_chart_enrichment" if chart_error_code is None else "membership_enrichment_fallback"): enrichment_at,\n            f"premarket_liquidity:{liquidity.provider}:{liquidity.feed}": liquidity.observed_at,\n        }\n',
              1,
          )
          text = text.replace(
              '        data_quality_flags = list(liquidity.reason_codes)\n',
              '        data_quality_flags = list(liquidity.reason_codes)\n        if chart_error_code is not None:\n            data_quality_flags.append(chart_error_code)\n        if provisional_identity:\n            data_quality_flags.append("PROVISIONAL_US_INSTRUMENT_IDENTITY")\n',
              1,
          )
          write(path, text)

          # Managed archiver explicitly requests membership-only behavior.
          path = "src/app/trading/strategy_universe_archiver.py"
          text = read(path)
          old = '''        snapshot = discover(\n            universe_id=universe_id,\n            evaluation_time=observed.astimezone(timezone.utc),\n            count=config.config.universe_discovery_count,\n            minimum_gap_pct=config.config.minimum_gap_pct,\n            minimum_price=config.config.minimum_price,\n            maximum_price=config.config.maximum_price,\n        )\n'''
          new = '''        discovery_kwargs = {\n            "universe_id": universe_id,\n            "evaluation_time": observed.astimezone(timezone.utc),\n            "count": config.config.universe_discovery_count,\n            "minimum_gap_pct": config.config.minimum_gap_pct,\n            "minimum_price": config.config.minimum_price,\n            "maximum_price": config.config.maximum_price,\n        }\n        if discovery_source == "finviz" and config.config.strategy_version == "2.0.0":\n            discovery_kwargs["membership_only"] = True\n        snapshot = discover(**discovery_kwargs)\n'''
          if old not in text:
              raise SystemExit("archiver discovery call anchor missing")
          text = text.replace(old, new, 1)
          write(path, text)

          # Focused regression coverage for the new contract.
          path = "src/tests/trading/test_trading_market_evidence_v2.py"
          text = read(path)
          text = text.replace(
              '    build_trade_authorization,\n',
              '    build_trade_authorization,\n    candidate_morning_evidence_eligible,\n',
              1,
          )
          if 'from app.trading.strategies.failed_selloff_v2 import evaluate_gap_pullback_v2' not in text:
              text = text.replace(
                  'from app.trading.strategies.models import StrategyRiskProfile\n',
                  'from app.trading.strategies.failed_selloff_v2 import evaluate_gap_pullback_v2\nfrom app.trading.strategies.models import StrategyRiskProfile\n',
                  1,
              )
          if 'test_managed_finviz_membership_is_ready_despite_premarket_research_gaps' not in text:
              text += '''\n\ndef test_managed_finviz_membership_is_ready_despite_premarket_research_gaps() -> None:\n    observed = datetime(2026, 9, 8, 13, 15, tzinfo=timezone.utc)\n    candidate = GapperCandidate(\n        instrument_id="equity:US:RECOVER",\n        binding_id="yahoo:historical_polling:equity:US:RECOVER",\n        observed_at=observed,\n        evidence_observed_at={"finviz_top_gainers": observed},\n        previous_close=Decimal("1"),\n        premarket_price=Decimal("1"),\n        gap_pct=Decimal("0"),\n        premarket_volume=Decimal("0"),\n        premarket_dollar_volume=Decimal("0"),\n        tod_rvol=None,\n        market_data_complete=False,\n        data_quality_flags=("YAHOO_CHART_PROVIDERDATAUNAVAILABLEERROR",),\n        discovery_rank=1,\n    )\n    config = managed_finviz_v2_config()\n    eligible, reasons = candidate_morning_evidence_eligible(candidate, config)\n    assert eligible is True\n    assert reasons == ()\n    result = evaluate_gap_pullback_v2(candidate, (), config)\n    assert result.state == "qualified_gap"\n    assert result.reason_code == "WAITING_FOR_REGULAR_SESSION"\n\n'''
          write(path, text)

          path = "src/tests/trading/test_trading_finviz_gapper_discovery.py"
          text = read(path)
          if 'test_membership_only_materializes_finviz_symbol_when_yahoo_enrichment_is_down' not in text:
              text += '''\n\ndef test_membership_only_materializes_finviz_symbol_when_yahoo_enrichment_is_down(monkeypatch):\n    now = datetime(2026, 9, 8, 13, 15, tzinfo=timezone.utc)\n    monkeypatch.setattr(\n        "app.trading.finviz_gapper_discovery._ALLOWED_DISCOVERY_SKEW_SECONDS",\n        10**9,\n    )\n    finviz = Runtime([Response(text='<a href="quote.ashx?t=RECOVER">RECOVER</a>')])\n    yahoo = Runtime([])\n\n    snapshot = discover_finviz_gappers(\n        universe_id="finviz-membership-recovery",\n        evaluation_time=now,\n        count=1,\n        minimum_gap_pct=Decimal("99"),\n        minimum_price=Decimal("100"),\n        maximum_price=Decimal("200"),\n        finviz_runtime=finviz,\n        yahoo_runtime=yahoo,\n        membership_only=True,\n    )\n\n    assert snapshot.source_candidate_symbols == ("RECOVER",)\n    assert len(snapshot.candidates) == 1\n    candidate = snapshot.candidates[0]\n    assert candidate.instrument_id == "equity:US:RECOVER"\n    assert candidate.discovery_rank == 1\n    assert candidate.market_data_complete is False\n    assert snapshot.source_member_dispositions[0].status == "materialized"\n    assert "PROVISIONAL_US_INSTRUMENT_IDENTITY" in candidate.data_quality_flags\n\n'''
          write(path, text)

          # Archiver test doubles need to accept the new explicit membership flag.
          path = "src/tests/trading/test_trading_strategy_universe_archiver.py"
          text = read(path)
          text = re.sub(
              r'def finviz\(([^)]*)\):',
              lambda m: 'def finviz(' + m.group(1).rstrip() + (', ' if m.group(1).strip() else '') + '**kwargs):',
              text,
          )
          write(path, text)
          PY
