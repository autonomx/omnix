name: RPG deterministic PR gates

on:
  pull_request:
    branches:
      - rpg
    paths:
      - "src/app/rpg/**"
      - "src/tests/rpg/**"
      - "scripts/check_rpg_file_lines.py"
      - "ruff.toml"
      - ".github/workflows/rpg-pr-deterministic.yml"
  push:
    branches:
      - rpg
    paths:
      - "src/app/rpg/**"
      - "src/tests/rpg/**"
      - "scripts/check_rpg_file_lines.py"
      - "ruff.toml"
      - ".github/workflows/rpg-pr-deterministic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rpg-gates:
    name: Deterministic RPG gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      RPG_DISABLE_LIVE_LLM: "1"
      RPG_TEST_MODE: deterministic
      OMNIX_DISABLE_LIVE_LLM: "1"
      OMNIX_PROVIDER: deterministic
      LLM_PROVIDER: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx pydantic requests python-multipart

      - name: Check RPG file line limits
        run: python scripts/check_rpg_file_lines.py

      - name: Ruff generated runtime bridge checks
        run: ruff check src/app/rpg/session/runtime_part16.py src/app/rpg/session/runtime_part17.py src/app/rpg/session/runtime_part18.py src/app/rpg/session/runtime_part19.py

      - name: RPG narration queue deterministic tests
        run: python -m pytest src/app/rpg/tests/test_narration_queue.py -q

      - name: RPG scenario progression smoke tests
        run: |
          python -m pytest \
            src/tests/rpg/test_scenario_progression_runtime.py::test_progression_graph_produces_initial_concrete_action \
            src/tests/rpg/test_scenario_progression_runtime.py::test_progression_applies_effects_and_unlocks_next_action \
            src/tests/rpg/test_scenario_progression_runtime.py::test_progression_registry_returns_seed_specific_actions_for_caravan_scenario \
            src/tests/rpg/test_scenario_progression_runtime.py::test_completed_node_is_not_returned_again_after_effects_apply \
            src/tests/rpg/test_scenario_progression_runtime.py::test_progression_nodes_advance_in_order_without_repeating_first_node \
            -q --tb=short

      - name: RPG campaign report deterministic tests
        run: python -m pytest src/tests/rpg/autoplay/test_campaign_report.py -q --tb=short
