name: RPG deterministic PR gates

on:
  pull_request:
    branches:
      - rpg
    paths:
      - "src/app/rpg/**"
      - "src/tests/rpg/**"
      - "docs/plans/rpg_production_readiness_plan.md"
      - "scripts/check_rpg_file_lines.py"
      - "ruff.toml"
      - ".github/workflows/rpg-pr-deterministic.yml"
  push:
    branches:
      - rpg
    paths:
      - "src/app/rpg/**"
      - "src/tests/rpg/**"
      - "docs/plans/rpg_production_readiness_plan.md"
      - "scripts/check_rpg_file_lines.py"
      - "ruff.toml"
      - ".github/workflows/rpg-pr-deterministic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rpg-gates:
    name: Deterministic RPG gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx pydantic requests python-multipart playwright

      - name: Check RPG file line limits
        run: python scripts/check_rpg_file_lines.py

      - name: Ruff generated runtime bridge checks
        run: ruff check src/app/rpg/session/runtime_part16.py src/app/rpg/session/runtime_part17.py src/app/rpg/session/runtime_part18.py src/app/rpg/session/runtime_part19.py

      - name: RPG narration queue deterministic tests
        run: python -m pytest src/app/rpg/tests/test_narration_queue.py -q

      - name: RPG CI registry gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_progression_registry_exposes_tavern_graphs -q --tb=short

      - name: RPG CI progression action gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_progression_actions_are_available_for_tavern_seed -q --tb=short

      - name: RPG CI campaign report gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_campaign_report_renderer_is_importable -q --tb=short

      - name: RPG CI combat reward gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_combat_defeat_loot_awards_player_xp_once -q --tb=short

      - name: RPG CI combat attack reward surface gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_combat_attack_result_exposes_nested_reward_xp -q --tb=short

      - name: RPG CI combat XP turn payload bridge gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_combat_xp_bridge_surfaces_reward_to_turn_payloads -q --tb=short

      - name: RPG CI session attack XP consistency gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_session_attack_defeat_bridge_awards_and_surfaces_xp_once -q --tb=short

      - name: RPG CI combat XP report visibility gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_campaign_report_displays_combat_xp_rewards -q --tb=short

      - name: RPG CI combat reward narrative contract gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_combat_reward_narrative_contract_limits_reward_claims -q --tb=short

      - name: RPG CI combat quest sync gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_combat_end_state_syncs_matching_quest_objective -q --tb=short

      - name: RPG CI combat quest sync report visibility gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_campaign_report_displays_combat_quest_sync -q --tb=short

      - name: RPG CI combat quest narrative contract gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_combat_quest_narrative_contract_limits_quest_claims -q --tb=short

      - name: RPG CI quest contract report visibility gate
        run: python -m pytest src/tests/rpg/test_ci_deterministic_rpg_gates.py::test_ci_campaign_report_displays_quest_narrative_contract -q --tb=short

      - name: RPG CI Phase 2 economy inventory gate
        run: |
          set -o pipefail
          python -m pytest src/tests/rpg/test_ci_phase2_economy_inventory.py -q --tb=short 2>&1 | tee phase2-economy-output.txt

      - name: Upload Phase 2 economy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-economy-output
          path: phase2-economy-output.txt

      - name: RPG CI Phase 3 quest schema giver gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_quest_schema_givers.py -q --tb=short

      - name: RPG CI Phase 3 objective lifecycle gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_objective_lifecycle.py -q --tb=short

      - name: RPG CI Phase 3 journal report gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_journal_report.py -q --tb=short

      - name: RPG CI Phase 3 rumor quest gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_rumor_quest.py -q --tb=short

      - name: RPG CI Phase 3 work objective gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_work_objectives.py -q --tb=short

      - name: RPG CI Phase 3 quest reward gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_quest_rewards.py -q --tb=short

      - name: RPG CI Phase 3 quest persistence gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_quest_persistence.py -q --tb=short

      - name: RPG CI Phase 3 quest report matrix gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_quest_report_matrix.py -q --tb=short

      - name: RPG CI Phase 3 quest return flow gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_quest_return_flow.py -q --tb=short

      - name: RPG CI Phase 3 completion audit gate
        run: python -m pytest src/tests/rpg/test_ci_phase3_completion_audit.py -q --tb=short

      - name: RPG CI Phase 4 location graph gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_location_graph.py -q --tb=short

      - name: RPG CI Phase 4 travel costs gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_travel_costs.py -q --tb=short

      - name: RPG CI Phase 4 discovery route blocking gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_discovery_route_blocking.py -q --tb=short

      - name: RPG CI Phase 4 seeded encounters gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_seeded_encounters.py -q --tb=short

      - name: RPG CI Phase 4 world events location history gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_world_events_location_history.py -q --tb=short

      - name: RPG CI Phase 4 runtime travel access gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_runtime_travel_access.py -q --tb=short

      - name: RPG CI Phase 4 time day hooks gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_time_day_hooks.py -q --tb=short

      - name: RPG CI Phase 4 map location report gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_map_location_report.py -q --tb=short

      - name: RPG CI Phase 4 travel resource consumption gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_travel_resource_consumption.py -q --tb=short

      - name: RPG CI Phase 4 encounter combat events gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_encounter_combat_events.py -q --tb=short

      - name: RPG CI Phase 4 runtime travel encounter routing gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_runtime_travel_encounter_routing.py -q --tb=short

      - name: RPG CI Phase 4 command routing facade session gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_command_routing_facade_session.py -q --tb=short

      - name: RPG CI Phase 4 runtime session travel command gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_runtime_session_travel_command.py -q --tb=short

      - name: RPG CI Phase 4 campaign report map location gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_campaign_report_map_location.py -q --tb=short

      - name: RPG CI Phase 4 frontend map location UI panel gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_frontend_map_location_ui_panel.py -q --tb=short

      - name: RPG CI Phase 4 season weather expansion gate
        run: python -m pytest src/tests/rpg/test_ci_phase4_season_weather_expansion.py -q --tb=short

      - name: RPG CI Phase 7 replay checkpoint foundation gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_replay_checkpoint_foundation.py -q --tb=short

      - name: RPG CI Phase 7 replay turn sequence gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_replay_turn_sequence_validation.py -q --tb=short

      - name: RPG CI Phase 7 save load replay roundtrip gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_save_load_replay_roundtrip.py -q --tb=short

      - name: RPG CI Phase 7 100-turn readiness gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_100_turn_readiness_gate.py -q --tb=short

      - name: RPG CI Phase 7 100-turn readiness report gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_100_turn_readiness_report.py -q --tb=short

      - name: RPG CI Phase 7 full 100-turn certification gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_full_100_turn_certification.py -q --tb=short

      - name: RPG CI Phase 7 real autoplay certification artifact gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_real_autoplay_certification_artifact.py -q --tb=short

      - name: RPG CI Phase 7 saved certification artifact writer gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_saved_certification_artifact_writer.py -q --tb=short

      - name: RPG CI Phase 7 saved autoplay digest source gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_saved_autoplay_digest_source_integration.py -q --tb=short

      - name: RPG CI Phase 7 real saved state certification gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_real_saved_state_certification_integration.py -q --tb=short

      - name: RPG CI Phase 7 real autoplay progress metrics gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_real_autoplay_progress_metrics_integration.py -q --tb=short

      - name: RPG CI Phase 7 saved certification report diagnostics gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_saved_certification_report_diagnostics.py -q --tb=short

      - name: RPG CI Phase 7 live manual saved artifact emission hooks gate
        run: python -m pytest src/tests/rpg/test_ci_phase7_live_manual_saved_artifact_emission_hooks.py -q --tb=short

      - name: RPG CI runtime facade manifest gate
        run: python -m pytest src/tests/rpg/test_ci_runtime_wrapper_manifest.py -q --tb=short
