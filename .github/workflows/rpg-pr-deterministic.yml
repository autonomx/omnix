name: RPG deterministic PR gates

on:
  pull_request:
    branches: [rpg]
    paths:
      - "src/app/rpg/**"
      - "src/tests/rpg/**"
      - "scripts/check_rpg_file_lines.py"
      - "ruff.toml"
      - ".github/workflows/rpg-pr-deterministic.yml"
  push:
    branches: [rpg]
    paths:
      - "src/app/rpg/**"
      - "src/tests/rpg/**"
      - "scripts/check_rpg_file_lines.py"
      - "ruff.toml"
      - ".github/workflows/rpg-pr-deterministic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rpg-gates:
    name: Deterministic RPG gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx pydantic requests python-multipart

      - name: Check RPG file line limits
        run: python scripts/check_rpg_file_lines.py

      - name: Ruff runtime bridge checks
        run: ruff check src/app/rpg/session/runtime_part16.py src/app/rpg/session/runtime_part17.py src/app/rpg/session/runtime_part18.py src/app/rpg/session/runtime_part19.py

      - name: RPG representative deterministic suite
        run: |
          python -m pytest src/app/rpg/tests/test_narration_queue.py -q
          python -m pytest src/tests/rpg/test_ci_runtime_wrapper_manifest.py -q --tb=short
          python -m pytest src/app/rpg/tests/test_narration_queue.py -q
          python -m pytest src/tests/rpg/test_ci_runtime_wrapper_manifest.py -q --tb=short
