name: RPG deterministic PR gates

on:
  pull_request:
    branches: [main, rpg]
  push:
    branches: [main, rpg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rpg-fast:
    name: Deterministic RPG fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_MIGRATION_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Apply PostgreSQL migrations and initialize authority
        run: |
          python -m app.persistence migrate
          python -c "from app.persistence.startup import bootstrap_postgresql_runtime; bootstrap_postgresql_runtime()"

      - name: RPG seeded 50-turn replay regression
        run: |
          set -o pipefail
          python -m pytest src/tests/unit/rpg/test_enterprise_determinism.py -q --tb=short 2>&1 | tee rpg-determinism-pytest-output.txt

      - name: Upload RPG determinism diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-determinism-pytest-output
          path: rpg-determinism-pytest-output.txt

      - name: RPG turn characterization regression
        run: |
          set -o pipefail
          python -m pytest src/tests/characterization/test_rpg_turn.py -q --tb=short 2>&1 | tee rpg-turn-characterization-output.txt

      - name: Upload RPG turn characterization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-turn-characterization-output
          path: rpg-turn-characterization-output.txt

      - name: Install web dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee web-npm-ci-output.txt

      - name: Upload web install diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-npm-install-output
          path: web-npm-ci-output.txt

      - name: Check RPG file line limits
        run: |
          set -o pipefail
          python scripts/check_rpg_file_lines.py 2>&1 | tee rpg-file-line-limits-output.txt

      - name: Upload file line diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-file-line-limits-output
          path: rpg-file-line-limits-output.txt

      - name: Ruff RPG runtime facade checks
        run: |
          set -o pipefail
          ruff check src/app/rpg/session/runtime.py 2>&1 | tee rpg-ruff-runtime-facade-output.txt

      - name: Upload ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-ruff-runtime-facade-output
          path: rpg-ruff-runtime-facade-output.txt

      - name: Gateway event stream regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_gateway_events.py -q --tb=short 2>&1 | tee gateway-events-pytest-output.txt

      - name: Upload gateway event diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-events-pytest-output
          path: gateway-events-pytest-output.txt

      - name: Gateway OpenAPI drift guard
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_gateway_openapi_schema.py -q --tb=short 2>&1 | tee gateway-openapi-pytest-output.txt

      - name: Upload gateway OpenAPI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-openapi-pytest-output
          path: gateway-openapi-pytest-output.txt

      - name: Shared asset read-through regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_shared_assets_readthrough.py -q --tb=short 2>&1 | tee shared-assets-readthrough-pytest-output.txt

      - name: Upload shared asset read-through diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-assets-readthrough-pytest-output
          path: shared-assets-readthrough-pytest-output.txt

      - name: Story asset save regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_gateway_text_asset_save.py -q --tb=short 2>&1 | tee story-asset-save-pytest-output.txt

      - name: Upload story asset save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: story-asset-save-pytest-output
          path: story-asset-save-pytest-output.txt

      - name: Settings preservation regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_settings_preservation.py -q --tb=short 2>&1 | tee settings-preservation-pytest-output.txt

      - name: Upload settings preservation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: settings-preservation-pytest-output
          path: settings-preservation-pytest-output.txt

      - name: Chat generation regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_chat_generation.py src/tests/app/test_assistant_context.py -q --tb=short 2>&1 | tee chat-generation-pytest-output.txt

      - name: Upload chat generation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-generation-pytest-output
          path: chat-generation-pytest-output.txt

      - name: Kasa Live Agent regression
        run: |
          set -o pipefail
          python -m pytest src/tests/assistant_tools/test_kasa_runtime_adapter.py src/tests/unit/chat/test_kasa_live_agent_flow.py src/tests/unit/chat/test_live_agent_store.py src/tests/unit/assist_core/test_live_agent_router.py src/tests/unit/assist_core/test_live_agent_planner.py -q --tb=short 2>&1 | tee kasa-live-agent-pytest-output.txt

      - name: Upload Kasa Live Agent diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kasa-live-agent-pytest-output
          path: kasa-live-agent-pytest-output.txt

      - name: Character persistence regression
        run: |
          set -o pipefail
          env -u OMNIX_TEST_DATABASE_URL -u OMNIX_DATABASE_URL -u OMNIX_MIGRATION_DATABASE_URL \
            OMNIX_PERSISTENCE_MODE=legacy_test OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE=1 OMNIX_CHAT_SQLITE_STORE_ENABLED=1 \
            python -m pytest src/tests/unit/characters src/tests/unit/assistant_memory/test_hermes_adapter.py src/tests/app/test_character_api.py src/tests/app/test_character_live_call_api.py src/tests/app/test_voice_governance_api.py src/tests/app/test_character_hermes_api.py -q --tb=short 2>&1 | tee character-persistence-pytest-output.txt

      - name: Upload character persistence diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: character-persistence-pytest-output
          path: character-persistence-pytest-output.txt

      - name: Web typecheck
        run: |
          set -o pipefail
          npm --workspace @omnix/web run typecheck 2>&1 | tee web-typecheck-output.txt

      - name: Upload web typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-output
          path: web-typecheck-output.txt

      - name: Web unit tests
        run: |
          set -o pipefail
          npm --workspace @omnix/web run test -- --run 2>&1 | tee web-vitest-output.txt

      - name: Upload web test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitest-output
          path: web-vitest-output.txt

      - name: RPG response generation roadmap regression
        run: |
          set -o pipefail
          # New-world generation, trusted authorship, durable publication, and PostgreSQL
          # integration are owned by their dedicated required workflows. Exclude the
          # superseded deterministic campaign/world fixtures and pre-signature review
          # assumptions from this response-engine aggregate while retaining its active
          # 700+ provider-free response and runtime regressions.
          env -u OMNIX_TEST_DATABASE_URL -u OMNIX_DATABASE_URL -u OMNIX_MIGRATION_DATABASE_URL \
            OMNIX_PERSISTENCE_MODE=legacy_test OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE=1 \
            python -m pytest src/tests/rpg/response_generation \
            --ignore=src/tests/rpg/response_generation/test_rne_phase21_world_forge_generation.py \
            --ignore=src/tests/rpg/response_generation/test_rne_phase22_genesis_materialization.py \
            --ignore=src/tests/rpg/response_generation/test_rne_phase23_campaign_bible_research.py \
            --ignore=src/tests/rpg/response_generation/test_rne_phase31_postgres_repository.py \
            --ignore=src/tests/rpg/response_generation/test_rne_phase34_runtime_repository_authority.py \
            --ignore=src/tests/rpg/response_generation/test_rne_phase37_world_forge_commit_gate.py \
            --ignore=src/tests/rpg/response_generation/test_rne_phase38_world_forge_dossier_quality.py \
            --ignore=src/tests/rpg/response_generation/test_rpg_world_generation_diagnostics_retry.py \
            --ignore=src/tests/rpg/response_generation/test_rpg_world_structured_domains.py \
            --ignore=src/tests/rpg/response_generation/test_world_forge_provider_presentation.py \
            --ignore=src/tests/rpg/response_generation/test_world_forge_review_acceptance.py \
            --ignore=src/tests/rpg/response_generation/test_world_forge_review_completeness.py \
            -q --tb=short 2>&1 | tee rpg-response-generation-pytest-output.txt

      - name: Upload RPG response generation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-response-generation-pytest-output
          path: rpg-response-generation-pytest-output.txt

      - name: RPG representative deterministic smoke
        run: |
          set -o pipefail
          python -m pytest src/app/rpg/tests/test_narration_queue.py -q --tb=short 2>&1 | tee rpg-narration-queue-pytest-output.txt

      - name: Upload RPG smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-narration-queue-pytest-output
          path: rpg-narration-queue-pytest-output.txt

  # Live-LLM autoplay is intentionally excluded from GitHub Actions. Hosted
  # runners do not have access to the local LM Studio/live provider required
  # by the manual campaign harness. Run autoplay in a provider-backed local
  # environment instead.
  runtime-endurance:
    name: Public apply-turn endurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix_test
          POSTGRES_PASSWORD: architecture-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix_test -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
      OMNIX_DATABASE_URL: postgresql://omnix_test:architecture-test-only@127.0.0.1:5432/omnix_test
      OMNIX_MIGRATION_DATABASE_URL: postgresql://omnix_test:architecture-test-only@127.0.0.1:5432/omnix_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install endurance dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Apply PostgreSQL migrations
        run: python -m app.persistence migrate

      - name: Run continuous 1000-turn runtime endurance
        run: |
          set -o pipefail
          python scripts/run_rpg_response_runtime_endurance.py \
            --turns 1000 \
            --output rpg-response-runtime-endurance-1000.json \
            2>&1 | tee rpg-response-runtime-endurance-1000-output.txt

      - name: Upload runtime endurance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-response-runtime-endurance-1000
          path: |
            rpg-response-runtime-endurance-1000-output.txt
            rpg-response-runtime-endurance-1000.json
          if-no-files-found: warn

  deterministic-rpg-gates:
    name: Deterministic RPG gates
    if: always()
    needs:
      - deterministic-rpg-fast
      - runtime-endurance
    runs-on: ubuntu-latest
    steps:
      - name: Require deterministic provider-free evidence jobs
        env:
          FAST_RESULT: ${{ needs.deterministic-rpg-fast.result }}
          ENDURANCE_RESULT: ${{ needs.runtime-endurance.result }}
        run: |
          printf 'fast=%s\nendurance=%s\n' \
            "$FAST_RESULT" "$ENDURANCE_RESULT"
          test "$FAST_RESULT" = "success"
          test "$ENDURANCE_RESULT" = "success"
