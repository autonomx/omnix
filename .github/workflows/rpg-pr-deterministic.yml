name: RPG deterministic PR gates

on:
  pull_request:
    branches: [main, rpg]
  push:
    branches: [main, rpg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rpg-gates:
    name: Deterministic RPG gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx pydantic requests python-multipart playwright

      - name: Install web dependencies
        run: |
          set -o pipefail
          npm install 2>&1 | tee web-npm-install-output.txt

      - name: Upload web install diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-npm-install-output
          path: web-npm-install-output.txt

      - name: Check RPG file line limits
        run: |
          set -o pipefail
          python scripts/check_rpg_file_lines.py 2>&1 | tee rpg-file-line-limits-output.txt

      - name: Upload file line diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-file-line-limits-output
          path: rpg-file-line-limits-output.txt

      - name: Ruff runtime bridge checks
        run: |
          set -o pipefail
          ruff check src/app/rpg/session/runtime_part16.py src/app/rpg/session/runtime_part17.py src/app/rpg/session/runtime_part18.py src/app/rpg/session/runtime_part19.py 2>&1 | tee rpg-ruff-runtime-bridge-output.txt

      - name: Upload ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-ruff-runtime-bridge-output
          path: rpg-ruff-runtime-bridge-output.txt

      - name: Gateway event stream regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_gateway_events.py -q --tb=short 2>&1 | tee gateway-events-pytest-output.txt

      - name: Upload gateway event diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-events-pytest-output
          path: gateway-events-pytest-output.txt

      - name: Gateway OpenAPI drift guard
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_gateway_openapi_schema.py -q --tb=short 2>&1 | tee gateway-openapi-pytest-output.txt

      - name: Upload gateway OpenAPI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-openapi-pytest-output
          path: gateway-openapi-pytest-output.txt

      - name: Shared asset read-through regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_shared_assets_readthrough.py -q --tb=short 2>&1 | tee shared-assets-readthrough-pytest-output.txt

      - name: Upload shared asset read-through diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-assets-readthrough-pytest-output
          path: shared-assets-readthrough-pytest-output.txt

      - name: Story asset save regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_gateway_text_asset_save.py -q --tb=short 2>&1 | tee story-asset-save-pytest-output.txt

      - name: Upload story asset save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: story-asset-save-pytest-output
          path: story-asset-save-pytest-output.txt

      - name: Settings preservation regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_settings_preservation.py -q --tb=short 2>&1 | tee settings-preservation-pytest-output.txt

      - name: Upload settings preservation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: settings-preservation-pytest-output
          path: settings-preservation-pytest-output.txt

      - name: Chat generation regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_chat_generation.py src/tests/app/test_assistant_context.py -q --tb=short 2>&1 | tee chat-generation-pytest-output.txt

      - name: Upload chat generation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-generation-pytest-output
          path: chat-generation-pytest-output.txt

      - name: Kasa Live Agent regression
        run: |
          set -o pipefail
          python -m pytest src/tests/assistant_tools/test_kasa_runtime_adapter.py src/tests/unit/chat/test_kasa_live_agent_flow.py src/tests/unit/chat/test_live_agent_store.py src/tests/unit/assist_core/test_live_agent_router.py src/tests/unit/assist_core/test_live_agent_planner.py -q --tb=short 2>&1 | tee kasa-live-agent-pytest-output.txt

      - name: Upload Kasa Live Agent diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kasa-live-agent-pytest-output
          path: kasa-live-agent-pytest-output.txt

      - name: Character persistence regression
        run: |
          set -o pipefail
          python -m pytest src/tests/unit/characters src/tests/unit/assistant_memory/test_hermes_adapter.py src/tests/app/test_character_api.py src/tests/app/test_character_live_call_api.py src/tests/app/test_voice_governance_api.py src/tests/app/test_character_hermes_api.py -q --tb=short 2>&1 | tee character-persistence-pytest-output.txt

      - name: Upload character persistence diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: character-persistence-pytest-output
          path: character-persistence-pytest-output.txt

      - name: Web typecheck
        run: |
          set -o pipefail
          npm --workspace @omnix/web run typecheck 2>&1 | tee web-typecheck-output.txt

      - name: Upload web typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-output
          path: web-typecheck-output.txt

      - name: Web unit tests
        run: |
          set -o pipefail
          npm --workspace @omnix/web run test -- --run 2>&1 | tee web-vitest-output.txt

      - name: Upload web test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitest-output
          path: web-vitest-output.txt

      - name: RPG representative deterministic smoke
        run: |
          set -o pipefail
          python -m pytest src/app/rpg/tests/test_narration_queue.py -q --tb=short 2>&1 | tee rpg-narration-queue-pytest-output.txt

      - name: Upload RPG smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-narration-queue-pytest-output
          path: rpg-narration-queue-pytest-output.txt
