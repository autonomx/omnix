name: Final live latency review validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Lint focused Python
        run: |
          ruff check \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/tts_live_capabilities.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py

      - name: Run focused Python tests
        run: |
          python -m pytest \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py \
            -q --tb=short --junitxml=/tmp/live-latency-pytest.xml

      - name: Typecheck focused browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee /tmp/final-live-review-typecheck.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(voice-websocket(\\.spec)?|voice-controller|accepted-final|stt-authority-controller|speculation-controller|tts-adaptive-buffer-controller|tts-capability-controller|voice-clause-stabilizer|voice-pcm-worklet|latency-rollout\\.spec)\\.ts|src/main\\.tsx)" /tmp/final-live-review-typecheck.txt; then
            exit "${status:-1}"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside focused files."
          fi

      - name: Run focused browser tests
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=/tmp/live-latency-vitest.xml

      - name: Publish validation result to PR
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          def count_tests(path: str) -> int:
              root = ET.parse(path).getroot()
              return sum(1 for _ in root.iter("testcase"))

          python_tests = count_tests("/tmp/live-latency-pytest.xml")
          browser_tests = count_tests("/tmp/live-latency-vitest.xml")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          body = f'''## Final correctness review validation

The remaining correctness and completeness findings have been implemented and validated directly from the clean PR branch at `{sha}`.

- focused Ruff validation passed
- **{python_tests} focused Python unit/bridge tests passed**
- scoped TypeScript validation passed for the complete live-latency browser path
- **{browser_tests} focused browser tests passed**

Implemented review remediation includes controller-owned authoritative endpoint commitment, negotiated STT readiness, ordered timeout recovery, request-compatible side-effect-free speculation, normal voice-turn identity preservation, active adaptive-TTS worklet updates, and measured fail-closed production promotion gates.

The PR should remain draft only for the real RTX 4090 Kyutai + LLM + Qwen TTS contention/latency/quality evidence; no additional code-completeness blocker was found in the reviewed path.
'''
          Path("/tmp/final-review-comment.md").write_text(body)
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/final-review-comment.md

      - name: Remove temporary review workflows
        run: |
          rm -f \
            .github/clean-live-latency-browser-failure.txt \
            .github/workflows/clean-live-latency-browser-diagnostics.yml \
            .github/workflows/clean-live-latency-browser-diagnostics-publish.yml \
            .github/workflows/restore-reviewed-live-stt-authority.yml \
            .github/workflows/finalize-live-latency-review.yml \
            .github/workflows/complete-live-latency-review.yml \
            .github/workflows/final-live-latency-review-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary live latency review validators"
            git push origin HEAD:${{ github.head_ref }}
          fi
