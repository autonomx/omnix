name: Temporary generated API contract sync

on:
  push:
    branches:
      - agent/prospective-gap-end-to-end-runtime
    paths:
      - .github/workflows/temp-sync-prospective-api-contract.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prospective-gap-end-to-end-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install generator dependencies
        run: |
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Generate exact shared gateway contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated contract to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          if git diff --cached --quiet; then
            echo "Generated contract already current."
            exit 0
          fi
          git commit -m "chore: update generated gateway API contract"
          git push origin HEAD:agent/prospective-gap-end-to-end-runtime
