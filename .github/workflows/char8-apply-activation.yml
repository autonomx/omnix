name: CHAR-8 apply immediate live-call activation

on:
  push:
    branches: [tmp-char8-live-call]

permissions:
  contents: write

jobs:
  apply-activation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-char8-live-call
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_char8_immediate_activation.py
      - name: Commit activation integration
        run: |
          if git diff --quiet -- apps/web/src/features/chatbot/ChatbotWorkspace.tsx; then
            echo 'Activation patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/chatbot/ChatbotWorkspace.tsx
          git commit -m 'CHAR-8 activate live call before runtime preload'
          git push origin HEAD:tmp-char8-live-call
