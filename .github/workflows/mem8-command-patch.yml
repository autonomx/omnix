name: MEM-8 one-time command patch

on:
  push:
    branches:
      - tmp-mem8-commands

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mem8-commands
          fetch-depth: 0
      - run: python scripts/mem8_command_patch.py
      - run: rm scripts/mem8_command_patch.py .github/workflows/mem8-command-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEM-8 fix exact memory ID parsing"
          git push origin HEAD:tmp-mem8-commands
