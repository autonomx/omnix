name: Temporary OpenAPI refresh

on:
  push:
    branches:
      - tmp-chat-message-stream-audio

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[openapi refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-chat-message-stream-audio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema dependencies
        run: python -m pip install fastapi pydantic requests python-multipart
      - name: Generate schema
        run: python scripts/export_gateway_openapi.py apps/web/src/api/generated/openapi.json
      - name: Commit generated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/generated/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated gateway OpenAPI [openapi refreshed]"
            git push origin HEAD:tmp-chat-message-stream-audio
          fi
