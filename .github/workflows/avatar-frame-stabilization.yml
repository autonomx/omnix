name: Avatar frame stabilization

on:
  pull_request:
    paths:
      - "src/app/platform/characters/avatar_frame_stabilization.py"
      - "src/app/platform/characters/avatar_viseme_generation.py"
      - "src/app/platform/characters/live2d_avatar.py"
      - "src/app/platform/chat/assistant_context/__init__.py"
      - "src/app/platform/image/jobs.py"
      - "src/tests/unit/characters/test_avatar_frame_stabilization.py"
      - "src/tests/unit/characters/test_avatar_viseme_generation.py"
      - "src/tests/unit/characters/test_live2d_avatar_api.py"
      - "web/src/features/assistant/chat/CharacterAvatarPanel.tsx"
      - "web/src/features/assistant/chat/CharacterAvatarPanel.css"
      - "web/src/features/assistant/chat/characterAvatarClient.ts"
      - "web/src/features/assistant/chat/characterClient.ts"
      - "web/src/features/assistant/chat/liveCharacterAvatarBridge.css"
      - "web/src/features/assistant/chat/liveCharacterAvatarBridge.ts"
      - "web/src/features/assistant/chat/liveCharacterAvatarBridge.test.ts"
      - "web/src/features/assistant/chat/liveCharacterVisemeBridge.ts"
      - "web/src/features/assistant/chat/liveCharacterVisemeBridge.test.ts"
      - "web/src/features/assistant/chat/live2dCharacterRenderer.ts"
      - "web/src/features/assistant/chat/live2dCharacterRenderer.test.ts"
      - ".github/workflows/avatar-frame-stabilization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-avatar-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install focused Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Install web dependencies
        run: npm ci
      - name: Lint avatar code
        run: |
          ruff check \
            src/app/platform/characters/avatar_frame_stabilization.py \
            src/app/platform/characters/avatar_viseme_generation.py \
            src/app/platform/characters/live2d_avatar.py \
            src/tests/unit/characters/test_avatar_frame_stabilization.py \
            src/tests/unit/characters/test_avatar_viseme_generation.py \
            src/tests/unit/characters/test_live2d_avatar_api.py
      - name: Compile image-job integration
        run: python -m py_compile src/app/platform/image/jobs.py
      - name: Verify avatar backend behavior
        run: >-
          pytest -q
          --confcutdir=src/tests/unit/characters
          src/tests/unit/characters/test_avatar_frame_stabilization.py
          src/tests/unit/characters/test_avatar_viseme_generation.py
          src/tests/unit/characters/test_live2d_avatar_api.py
      - name: Typecheck character avatar production modules
        run: |
          cat > web/tsconfig.avatar.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "types": ["vite/client"]
            },
            "include": [
              "src/*.d.ts",
              "src/features/assistant/chat/CharacterAvatarPanel.tsx",
              "src/features/assistant/chat/characterAvatarClient.ts",
              "src/features/assistant/chat/characterClient.ts",
              "src/features/assistant/chat/liveCharacterAvatarBridge.ts",
              "src/features/assistant/chat/liveCharacterVisemeBridge.ts",
              "src/features/assistant/chat/live2dCharacterRenderer.ts"
            ],
            "exclude": ["src/**/*.test.ts", "src/**/*.test.tsx"]
          }
          JSON
          cd web
          npx tsc -p tsconfig.avatar.json
