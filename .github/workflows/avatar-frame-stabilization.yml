name: Avatar frame stabilization

on:
  pull_request:
    paths:
      - "src/app/characters/avatar_frame_stabilization.py"
      - "src/app/characters/avatar_viseme_generation.py"
      - "src/app/characters/live2d_avatar.py"
      - "src/app/assistant_context/__init__.py"
      - "src/app/jobs/image_inline.py"
      - "src/tests/unit/characters/test_avatar_frame_stabilization.py"
      - "src/tests/unit/characters/test_avatar_viseme_generation.py"
      - "src/tests/unit/characters/test_live2d_avatar_api.py"
      - "apps/web/src/features/chatbot/CharacterAvatarPanel.tsx"
      - "apps/web/src/features/chatbot/CharacterAvatarPanel.css"
      - "apps/web/src/features/chatbot/characterAvatarClient.ts"
      - "apps/web/src/features/chatbot/characterClient.ts"
      - "apps/web/src/features/chatbot/liveCharacterAvatarBridge.css"
      - "apps/web/src/features/chatbot/liveCharacterAvatarBridge.ts"
      - "apps/web/src/features/chatbot/liveCharacterAvatarBridge.test.ts"
      - "apps/web/src/features/chatbot/liveCharacterVisemeBridge.ts"
      - "apps/web/src/features/chatbot/liveCharacterVisemeBridge.test.ts"
      - "apps/web/src/features/chatbot/live2dCharacterRenderer.ts"
      - "apps/web/src/features/chatbot/live2dCharacterRenderer.test.ts"
      - "docs/character-mode/live-avatar-phases.md"
      - ".github/workflows/avatar-frame-stabilization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-avatar-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install focused Python dependencies
        run: >-
          python -m pip install
          ruff pytest pillow pydantic fastapi httpx requests python-multipart
      - name: Install web dependencies
        run: npm install
      - name: Lint avatar code
        run: |
          ruff check \
            src/app/characters/avatar_frame_stabilization.py \
            src/app/characters/avatar_viseme_generation.py \
            src/app/characters/live2d_avatar.py \
            src/tests/unit/characters/test_avatar_frame_stabilization.py \
            src/tests/unit/characters/test_avatar_viseme_generation.py \
            src/tests/unit/characters/test_live2d_avatar_api.py
      - name: Compile image-job integration
        run: python -m py_compile src/app/jobs/image_inline.py
      - name: Verify avatar backend behavior
        run: >-
          pytest -q
          --confcutdir=src/tests/unit/characters
          src/tests/unit/characters/test_avatar_frame_stabilization.py
          src/tests/unit/characters/test_avatar_viseme_generation.py
          src/tests/unit/characters/test_live2d_avatar_api.py
      - name: Typecheck character web UI
        run: npm --workspace @omnix/web run typecheck
      - name: Verify browser avatar playback
        run: >-
          npm --workspace @omnix/web run test --
          src/features/chatbot/liveCharacterAvatarBridge.test.ts
          src/features/chatbot/liveCharacterVisemeBridge.test.ts
          src/features/chatbot/live2dCharacterRenderer.test.ts
