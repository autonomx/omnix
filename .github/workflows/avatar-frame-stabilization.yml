name: Avatar frame stabilization

on:
  pull_request:
    paths:
      - "src/app/characters/avatar_frame_stabilization.py"
      - "src/app/jobs/image_inline.py"
      - "src/tests/unit/characters/test_avatar_frame_stabilization.py"
      - "apps/web/src/features/chatbot/liveCharacterAvatarBridge.css"
      - ".github/workflows/avatar-frame-stabilization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-avatar-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install ruff pytest pillow pydantic
      - name: Lint stabilization code
        run: |
          ruff check \
            src/app/characters/avatar_frame_stabilization.py \
            src/tests/unit/characters/test_avatar_frame_stabilization.py
      - name: Compile image-job integration
        run: python -m py_compile src/app/jobs/image_inline.py
      - name: Verify pixel-stable avatar frames
        run: >-
          pytest -q
          --confcutdir=src/tests/unit/characters
          src/tests/unit/characters/test_avatar_frame_stabilization.py
