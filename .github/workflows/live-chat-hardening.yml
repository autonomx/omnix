name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-deferred-output-typing:
    name: Fix deferred output typing
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch test typing
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "Fix deferred output test typing" ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "new Promise<void>((resolve) => {\n      resolveOutput = resolve;"
          new = "new Promise<undefined>((resolve) => {\n      resolveOutput = () => resolve(undefined);"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected two deferred output promises, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts
          git commit -m 'Fix deferred output test typing'
          git push origin HEAD:${{ github.head_ref }}
