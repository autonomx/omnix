name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-physical-acceptance-fixes:
    name: Apply physical Live fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply, restore workflow, and commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "Fix physical Live acceptance ownership" ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-live-physical-acceptance-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(dedent(workflow[start:end]), 'live-physical-patch', 'exec'))
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/live-chat-hardening.yml
          rm -f \
            .github/workflows/apply-live-physical-acceptance-fixes.yml \
            .github/workflows/apply-live-physical-patch-only.yml \
            .github/live-physical-fix-trigger \
            .github/live-physical-patch-trigger-2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix physical Live acceptance ownership'
          git push origin HEAD:${{ github.head_ref }}
