name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-chat-hardening:
    name: Live Chat hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx numpy pydantic requests python-multipart playwright

      - name: Install web dependencies
        run: npm install

      - name: Ruff Live Chat hardening modules
        run: |
          ruff check \
            src/app/gateway/event_loop_lag_monitor.py \
            src/app/gateway/live_voice_release_gate.py \
            src/app/gateway/live_chat_release_gate.py \
            src/app/gateway/live_chat_release_aggregation.py \
            src/app/gateway/live_chat_evaluation_store.py \
            src/app/gateway/live_chat_evaluation_routes.py \
            src/app/gateway/live_voice_diagnostics_routes.py \
            src/app/gateway/tts_live_call_websocket.py \
            src/app/gateway/tts_stream_contract.py \
            src/app/gateway/tts_stream_diagnostics.py \
            src/tests/app/test_gateway_event_loop_lag_monitor.py \
            src/tests/app/test_live_voice_release_gate.py \
            src/tests/app/test_live_chat_release_gate.py \
            src/tests/app/test_live_chat_release_completion.py \
            src/tests/app/test_live_chat_evaluation_store.py \
            src/tests/app/test_live_chat_authoritative_state_source.py \
            src/tests/app/test_gateway_tts_live_call_latency.py \
            src/tests/app/test_tts_stream_contract_performance.py

      - name: Existing live voice release-gate regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_live_voice_release_gate.py -q --tb=short \
            2>&1 | tee live-voice-release-gate-output.txt

      - name: Live TTS response-onset regression
        run: |
          set -o pipefail
          python -m pytest \
            src/tests/app/test_gateway_event_loop_lag_monitor.py \
            src/tests/app/test_gateway_tts_live_call_websocket.py \
            src/tests/app/test_gateway_tts_live_call_latency.py \
            src/tests/app/test_tts_stream_contract_performance.py \
            -q --tb=short 2>&1 | tee live-tts-response-onset-output.txt

      - name: Live Chat release-gate and completion regression
        run: |
          set -o pipefail
          python -m pytest \
            src/tests/app/test_live_chat_release_gate.py \
            src/tests/app/test_live_chat_release_completion.py \
            -q --tb=short 2>&1 | tee live-chat-release-gate-output.txt

      - name: Phase 11 authoritative-state source guard
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_live_chat_authoritative_state_source.py -q --tb=short \
            2>&1 | tee live-chat-authoritative-state-output.txt

      - name: Phase 12 durable evaluation and policy regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_live_chat_evaluation_store.py -q --tb=short \
            2>&1 | tee live-chat-durable-evaluation-output.txt

      - name: Upload hardening diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-chat-hardening-output
          path: |
            live-voice-release-gate-output.txt
            live-tts-response-onset-output.txt
            live-chat-release-gate-output.txt
            live-chat-authoritative-state-output.txt
            live-chat-durable-evaluation-output.txt

      - name: Web typecheck
        run: npm --workspace @omnix/web run typecheck

      - name: Web unit tests
        run: npm --workspace @omnix/web run test -- --run
