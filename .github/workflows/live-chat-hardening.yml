name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-shared-audio-tests:
    name: Align shared audio lifecycle tests
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "Align shared audio lifecycle tests" ]; then
            exit 0
          fi
          node .github/scripts/patch-shared-audio-tests.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts
          git commit -m 'Align shared audio lifecycle tests'
          git push origin HEAD:${{ github.head_ref }}
