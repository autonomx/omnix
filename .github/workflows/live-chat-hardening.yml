name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-shared-audio-tests:
    name: Align shared audio lifecycle tests
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "Align shared audio lifecycle tests" ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'missing lifecycle test pattern: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace(
              "  mocks.session.enqueueCue.mockReset().mockResolvedValue(undefined);\n  mocks.session.setStartPolicy.mockReset();",
              "  mocks.session.enqueueCue.mockReset().mockResolvedValue(undefined);\n  mocks.session.cancelOutputItem.mockReset().mockResolvedValue(undefined);\n  mocks.session.waitForOutputItem.mockReset().mockResolvedValue(undefined);\n  mocks.session.setStartPolicy.mockReset();",
          )
          replace(
              "afterEach(() => {\n  cleanup?.();\n  cleanup = null;\n  document.body.innerHTML = '';\n  vi.restoreAllMocks();\n  vi.unstubAllGlobals();\n});",
              "afterEach(async () => {\n  const hadSharedSession = mocks.createSession.mock.calls.length > 0;\n  cleanup?.();\n  cleanup = null;\n  if (hadSharedSession) {\n    await waitFor(() => expect(mocks.session.stop).toHaveBeenCalled());\n  }\n  document.body.innerHTML = '';\n  vi.restoreAllMocks();\n  vi.unstubAllGlobals();\n});",
          )
          replace(
              "    await waitFor(() => expect(mocks.session.enqueueOutputPhrase).toHaveBeenCalledWith(\n      'Hey there! How is your day going?',\n      0,\n      {},\n    ));",
              "    await waitFor(() => expect(mocks.session.enqueueOutputPhrase).toHaveBeenCalledWith(\n      'Hey there! How is your day going?',\n      0,\n      expect.objectContaining({ generationEpoch: expect.any(Number), outputOrder: 0 }),\n      {},\n    ));",
          )
          replace(
              "  it('aborts greeting generation and playback when the user begins speaking', async () => {\n    window.dispatchEvent(new CustomEvent('omnix:assistant-live-voice-call-start'));",
              "  it('aborts greeting generation and playback when the user begins speaking', async () => {\n    let resolveOutput: () => void = () => undefined;\n    mocks.session.waitForOutputItem.mockImplementationOnce(() => new Promise<void>((resolve) => {\n      resolveOutput = resolve;\n    }));\n    window.dispatchEvent(new CustomEvent('omnix:assistant-live-voice-call-start'));",
          )
          replace(
              "    expect(document.querySelector<HTMLElement>('.assistant-live-card')?.dataset.liveVoiceOutputKind).toBeUndefined();\n    expect(document.querySelector<HTMLElement>('.assistant-voice-orb')?.dataset.voiceMode).toBe('listening');\n  });",
              "    expect(document.querySelector<HTMLElement>('.assistant-live-card')?.dataset.liveVoiceOutputKind).toBeUndefined();\n    expect(document.querySelector<HTMLElement>('.assistant-voice-orb')?.dataset.voiceMode).toBe('listening');\n    resolveOutput();\n  });",
          )
          replace(
              "    expect(mocks.createTraceId).not.toHaveBeenCalled();",
              "    expect(mocks.createTraceId).toHaveBeenCalledWith('s1:audio-session');",
          )
          replace(
              "  it('aborts the active request and stops the persistent session on interruption', async () => {\n    const response = await window.fetch('/api/chat/sessions/s1/messages/stream', { method: 'POST' });",
              "  it('aborts the active request and cancels owned output on interruption', async () => {\n    let resolveOutput: () => void = () => undefined;\n    mocks.session.waitForOutputItem.mockImplementationOnce(() => new Promise<void>((resolve) => {\n      resolveOutput = resolve;\n    }));\n    const response = await window.fetch('/api/chat/sessions/s1/messages/stream', { method: 'POST' });",
          )
          replace(
              "    expect(document.querySelector<HTMLElement>('.assistant-voice-orb')?.dataset.voiceMode).toBe('listening');\n  });\n});",
              "    expect(document.querySelector<HTMLElement>('.assistant-voice-orb')?.dataset.voiceMode).toBe('listening');\n    resolveOutput();\n  });\n});",
          )
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts
          git commit -m 'Align shared audio lifecycle tests'
          git push origin HEAD:${{ github.head_ref }}
