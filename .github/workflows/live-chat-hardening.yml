name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-shared-audio-tests:
    name: Align shared audio lifecycle tests
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch lifecycle tests
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          node .github/scripts/patch-shared-audio-tests.mjs >shared-audio-patch.log 2>&1
          git diff -- apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts >shared-audio-test.patch
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-audio-patch-diagnostics
          path: |
            shared-audio-patch.log
            shared-audio-test.patch
      - name: Commit lifecycle tests
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts
          git commit -m 'Align shared audio lifecycle tests'
          git push origin HEAD:${{ github.head_ref }}
