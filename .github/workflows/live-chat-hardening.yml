name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-physical-acceptance-fixes:
    name: Apply physical Live fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply, capture failure, and restore workflow
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY' 2>&1 | tee /tmp/live-physical-patch.log
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-live-physical-acceptance-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(dedent(workflow[start:end]), 'live-physical-patch', 'exec'))
          PY
          status=${PIPESTATUS[0]}
          git fetch origin main
          git checkout origin/main -- .github/workflows/live-chat-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            cp /tmp/live-physical-patch.log .github/live-physical-patch-error.txt
            git add .github/workflows/live-chat-hardening.yml .github/live-physical-patch-error.txt
            git commit -m 'Capture physical Live patch failure'
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi
          rm -f \
            .github/workflows/apply-live-physical-acceptance-fixes.yml \
            .github/workflows/apply-live-physical-patch-only.yml \
            .github/live-physical-fix-trigger \
            .github/live-physical-patch-trigger-2 \
            .github/live-physical-patch-error.txt
          git add -A
          git commit -m 'Fix physical Live acceptance ownership'
          git push origin HEAD:${{ github.head_ref }}
