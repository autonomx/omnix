name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-physical-acceptance-fixes:
    name: Apply physical Live fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply or persist transformation mismatch
        shell: bash
        run: |
          set +e
          python - <<'PY' >/tmp/live-physical-patch.log 2>&1
          from pathlib import Path

          workflow = Path('.github/workflows/apply-live-physical-acceptance-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          raw = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          exec(compile(script, 'live-physical-patch', 'exec'))
          PY
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            log_contents="$(cat /tmp/live-physical-patch.log)"
            git reset --hard HEAD
            git checkout 4936c00b083e74609d1f7ae6a9802bb5a89ee2da -- .github/workflows/live-chat-hardening.yml
            printf '%s\n' "$log_contents" > .github/live-physical-patch-error.txt
            git add .github/workflows/live-chat-hardening.yml .github/live-physical-patch-error.txt
            git commit -m 'Capture physical Live source mismatch'
            git push origin HEAD:agent/general-full-duplex-live
            exit 0
          fi
          git checkout 4936c00b083e74609d1f7ae6a9802bb5a89ee2da -- .github/workflows/live-chat-hardening.yml
          rm -f \
            .github/workflows/apply-live-physical-acceptance-fixes.yml \
            .github/workflows/apply-live-physical-patch-only.yml \
            .github/live-physical-fix-trigger \
            .github/live-physical-patch-trigger-2 \
            .github/live-physical-patch-error.txt
          git add -A
          git commit -m 'Fix physical Live acceptance ownership'
          git push origin HEAD:agent/general-full-duplex-live
