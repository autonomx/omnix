name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-chat-hardening:
    name: Live Chat hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx pydantic requests python-multipart

      - name: Install web dependencies
        run: npm install

      - name: Ruff Live Chat hardening modules
        run: |
          ruff check \
            src/app/gateway/live_voice_release_gate.py \
            src/app/gateway/live_chat_release_gate.py \
            src/app/gateway/live_voice_diagnostics_routes.py \
            src/tests/app/test_live_voice_release_gate.py \
            src/tests/app/test_live_chat_release_gate.py

      - name: Existing live voice release-gate regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_live_voice_release_gate.py -q --tb=short \
            2>&1 | tee live-voice-release-gate-output.txt

      - name: Phase 9 Live Chat release-gate regression
        run: |
          set -o pipefail
          python -m pytest src/tests/app/test_live_chat_release_gate.py -q --tb=short \
            2>&1 | tee live-chat-release-gate-output.txt

      - name: Upload release-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-chat-release-gate-output
          path: |
            live-voice-release-gate-output.txt
            live-chat-release-gate-output.txt

      - name: Web typecheck
        run: npm --workspace @omnix/web run typecheck

      - name: Web unit tests
        run: npm --workspace @omnix/web run test -- --run
