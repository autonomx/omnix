name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-shared-audio-tests:
    name: Align shared audio lifecycle tests
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch lifecycle tests or capture exception
        shell: bash
        run: |
          set +e
          node .github/scripts/patch-shared-audio-tests.mjs >/tmp/shared-audio-patch.log 2>&1
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            cp /tmp/shared-audio-patch.log .github/shared-audio-script-error.txt
            git add .github/shared-audio-script-error.txt
            git commit -m 'Capture shared audio script exception'
            git push origin HEAD:${{ github.head_ref }}
            exit 0
          fi
          rm -f .github/shared-audio-script-error.txt
          git add apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts
          git commit -m 'Align shared audio lifecycle tests'
          git push origin HEAD:${{ github.head_ref }}
