name: Live Chat hardening gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-physical-acceptance-fixes:
    name: Apply physical Live fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/general-full-duplex-live'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch or persist exact mismatch
        shell: bash
        run: |
          set +e
          python - <<'PY' >/tmp/live-physical-patch.log 2>&1
          from pathlib import Path

          workflow = Path('.github/workflows/apply-live-physical-acceptance-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          raw = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          brittle = (
              "if old not in text:\n"
              "    raise SystemExit('missing unified completion block')\n"
              "text = text.replace(old, new, 1)"
          )
          bounded = (
              "if old not in text:\n"
              "    block_start = text.index('  let audioIssue: string | null = null;')\n"
              "    block_end = text.index('\\n  if (turn.generation !== playbackGeneration)', block_start)\n"
              "    text = text[:block_start] + new + text[block_end:]\n"
              "else:\n"
              "    text = text.replace(old, new, 1)"
          )
          if brittle not in script:
              raise SystemExit('canonical completion transform not found')
          script = script.replace(brittle, bounded, 1)
          exec(compile(script, 'live-physical-patch', 'exec'))
          PY
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            log_contents="$(cat /tmp/live-physical-patch.log)"
            git reset --hard HEAD
            printf '%s\n' "$log_contents" > .github/live-physical-patch-error.txt
            git add .github/live-physical-patch-error.txt
            git commit -m 'Capture physical Live source mismatch'
            git push origin HEAD:agent/general-full-duplex-live
            exit 0
          fi
          rm -f .github/live-physical-patch-error.txt
          git add apps/web/vite.config.ts \
            apps/web/src/features/chatbot/ChatbotWorkspace.tsx \
            apps/web/src/features/assistant-workspace/live-voice-controller.ts \
            apps/web/src/features/assistant-workspace/live-voice-pcm-session.ts \
            apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.ts \
            apps/web/src/features/assistant-workspace/live-voice-unified-audio-controller.test.ts \
            src/tests/app/test_live_chat_authoritative_state_source.py
          git commit -m 'Fix physical Live acceptance ownership'
          git push origin HEAD:agent/general-full-duplex-live
