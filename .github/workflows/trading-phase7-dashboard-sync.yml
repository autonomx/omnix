name: Trading Phase 7 dashboard integration

on:
  push:
    branches: [agent/trading-nextgen-roadmap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-command-center:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-nextgen-roadmap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify branch has not moved
        run: |
          git fetch origin agent/trading-nextgen-roadmap
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/trading-nextgen-roadmap)"
      - name: Integrate Command Center into existing dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/apps/web/src/features/trading/TradingPaperDashboard.tsx")
          text = path.read_text()

          type_import = "import type { TradingStrategyConfig } from './tradingStrategyTypes';"
          command_import = "import { TradingCommandCenter } from './TradingCommandCenter';"
          if command_import not in text:
              if type_import not in text:
                  raise SystemExit("dashboard type-import anchor missing")
              text = text.replace(type_import, type_import + "\n" + command_import, 1)

          old_header = "<strong>Paper Trading Analytics</strong><small>Account performance, trade outcomes, strategy evidence and execution quality</small>"
          new_header = "<strong>Trading Command Center</strong><small>Daily operations, account performance, strategy evidence and execution quality</small>"
          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          elif new_header not in text:
              raise SystemExit("dashboard header anchor missing")

          error_anchor = "      {error ? <div className=\"paper-dashboard-error\" role=\"status\">{error}</div> : null}"
          command = "      {accountId ? <TradingCommandCenter accountId={accountId} strategyId={strategyId || null} currency={currency} /> : null}"
          if command not in text:
              if error_anchor not in text:
                  raise SystemExit("dashboard error anchor missing")
              text = text.replace(error_anchor, error_anchor + "\n\n" + command, 1)

          path.write_text(text)
      - name: Install web dependencies
        run: npm install
      - name: Trading frontend tests
        run: npm --workspace @omnix/web run test:trading
      - name: Trading TypeScript typecheck
        run: npm --workspace @omnix/web run typecheck:trading
      - name: Commit integration
        run: |
          if git diff --quiet -- src/apps/web/src/features/trading/TradingPaperDashboard.tsx; then
            echo "Dashboard integration already current."
            exit 0
          fi
          git fetch origin agent/trading-nextgen-roadmap
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/trading-nextgen-roadmap)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/src/features/trading/TradingPaperDashboard.tsx
          git commit -m "feat(trading): integrate daily command center"
          git push origin HEAD:agent/trading-nextgen-roadmap
