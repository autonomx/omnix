name: Trading V2 force-flat compatibility fix

on:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - ".github/workflows/trading-v2-production-parity.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: trading-v2-production-parity-${{ github.repository }}
  cancel-in-progress: true

jobs:
  apply-compatibility-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore legacy force-flat precedence
        run: python scripts/fix_trading_v2_force_flat_precedence.py

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4" pytest playwright

      - name: Run V1/V2 automation regressions before push
        run: |
          python -m pytest \
            src/tests/trading/test_trading_gap_pullback_v11.py \
            src/tests/trading/test_trading_gap_pullback_v2.py \
            src/tests/trading/test_trading_gap_pullback_v2_management.py \
            src/tests/trading/test_trading_gap_pullback_automation.py \
            -q

      - name: Verify version-specific trigger ordering in source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/app/trading/strategy_monitor.py').read_text(encoding='utf-8')
          assert 'if config.config.strategy_version != "2.0.0" and force_flat:' in text
          assert 'trigger = "max_hold"' in text
          print('Legacy force-flat and V2 max-hold branches are both present.')
          PY

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "omnix-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/trading/strategy_monitor.py
          if git diff --cached --quiet; then
            echo "::error::Compatibility transform produced no strategy monitor change."
            exit 2
          fi
          git commit -m "trading: preserve V1 force-flat precedence"
          git push origin HEAD:agent/trading-auto-strategy-roadmap

      - name: Report fix on PR 1494
        if: success()
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "V2 parity audit compatibility fix passed V1/V2 targeted regressions and pushed \`${sha}\`: 1.x force-flat precedence is restored; 2.0 keeps stop/target → max-hold → EOD ordering."

      - name: Report failure on PR 1494
        if: failure()
        shell: bash
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "V2 force-flat compatibility workflow ${GITHUB_RUN_ID} failed on source head ${GITHUB_SHA}; do not treat production parity as qualified yet."