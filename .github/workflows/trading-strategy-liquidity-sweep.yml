name: Trading strategy liquidity sweep

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD); blank uses lookback"
        required: false
        default: ""
        type: string
      end_date:
        description: "End date (YYYY-MM-DD); blank uses yesterday ET"
        required: false
        default: ""
        type: string
      lookback_days:
        description: "Calendar-day lookback when start date is blank"
        required: false
        default: "14"
        type: string
      initial_cash:
        description: "Initial paper cash"
        required: false
        default: "100000"
        type: string
      assumed_spread_bps:
        description: "Historical assumed spread in basis points"
        required: false
        default: "40"
        type: string
      max_hold_minutes:
        description: "Maximum hold time in minutes"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  liquidity-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
      START_DATE: ${{ github.event.inputs.start_date || '' }}
      END_DATE: ${{ github.event.inputs.end_date || '' }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      INITIAL_CASH: ${{ github.event.inputs.initial_cash || '100000' }}
      ASSUMED_SPREAD_BPS: ${{ github.event.inputs.assumed_spread_bps || '40' }}
      MAX_HOLD_MINUTES: ${{ github.event.inputs.max_hold_minutes || '90' }}
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Alpaca historical-data credentials
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Repository Actions secrets OMNIX_ALPACA_API_KEY_ID and OMNIX_ALPACA_API_SECRET_KEY are required."
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Run strict v1.1 liquidity sweep
        shell: bash
        run: |
          args=(
            --lookback-days "${LOOKBACK_DAYS}"
            --initial-cash "${INITIAL_CASH}"
            --assumed-spread-bps "${ASSUMED_SPREAD_BPS}"
            --max-hold-minutes "${MAX_HOLD_MINUTES}"
            --reconstruction-max-age-days 30
            --max-sessions 60
            --thresholds "250000,500000,1000000,2000000,5000000,10000000"
            --output-dir artifacts/liquidity-sweep
            --require-covered-session
          )
          if [[ -n "${START_DATE}" ]]; then
            args+=(--start-date "${START_DATE}")
          fi
          if [[ -n "${END_DATE}" ]]; then
            args+=(--end-date "${END_DATE}")
          fi
          python scripts/run_trading_strategy_liquidity_sweep.py "${args[@]}"

      - name: Publish sweep summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/liquidity-sweep/summary.md ]]; then
            cat artifacts/liquidity-sweep/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "# Premarket liquidity sensitivity sweep" >> "${GITHUB_STEP_SUMMARY}"
            echo "Sweep result files were not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-sweep-comparison
          path: artifacts/liquidity-sweep
          if-no-files-found: warn
          retention-days: 30
