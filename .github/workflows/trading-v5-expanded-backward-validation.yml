name: Trading V5 expanded backward validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v5-expanded-backward-validation.yml

permissions:
  contents: read

concurrency:
  group: trading-v5-expanded-backward-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
    steps:
      - name: Check out exact validation head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Verify Alpaca historical credentials
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Alpaca credentials are required to freeze the untouched Jan-Jul 2025 block."
            exit 2
          fi

      - name: Restore frozen Aug-Sep independent cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-v5-independent-32684772697-1
          fail-on-cache-miss: true

      - name: Recover exact frozen V3 selector source
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, re, subprocess
          from pathlib import Path
          source_commit = "5529cb1bc223aa6f018630792aa5ce5e16c5071f"
          expected = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          historical = subprocess.check_output([
              "git", "show", f"{source_commit}:.github/workflows/trading-v3-recovery-precision-search.yml"
          ], text=True)
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', historical)
          if match is None:
              raise SystemExit("historical embedded selector payload not found")
          payload = match.group(1)
          for removed_index in range(len(payload)):
              candidate = payload[:removed_index] + payload[removed_index + 1:]
              try:
                  source = gzip.decompress(base64.b64decode(candidate, validate=True))
              except Exception:
                  continue
              if hashlib.sha256(source).hexdigest() == expected:
                  if removed_index != 3382:
                      raise SystemExit(f"unexpected corruption index: {removed_index}")
                  Path("/tmp/recovery_selector.py").write_bytes(source)
                  print(f"Recovered exact selector source sha256={expected}; removed_index={removed_index}")
                  break
          else:
              raise SystemExit("exact selector source fingerprint not recoverable")
          PYCODE
          python -m py_compile /tmp/recovery_selector.py scripts/run_trading_strategy_v5_recovery_headroom.py

      - name: Freeze untouched Jan-Jul 2025 block
        shell: bash
        run: |
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2025-01-02 \
            --end-date 2025-07-31 \
            --thresholds 100000 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v5-expanded-backward-capture \
            --reconstruction-max-age-days 700 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --max-hold-minutes 60 \
            --max-sessions 160 \
            --require-covered-session

      - name: Evaluate frozen 0.75R rule on Jan-Jul and aggregate Jan-Sep
        id: backward
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, math
          from datetime import date
          from decimal import Decimal
          from pathlib import Path

          import scripts.run_trading_strategy_v5_recovery_headroom as v5
          from app.trading.strategy_v2_qualification import frozen_v2_config
          from scripts.run_trading_strategy_backtest import strict_v11_strategy
          from scripts.run_trading_strategy_liquidity_sweep import _cache_namespace
          from scripts.run_trading_strategy_v2_extended_exploration import _load_block

          spread = Decimal("150")
          threshold = Decimal("0.75")
          namespace, cache_basis = _cache_namespace(
              strict_v11_strategy(minimum_premarket_dollar_volume=Decimal("100000")), spread
          )
          cache = Path(".cache/trading-liquidity-datasets") / namespace
          module = v5._load_selector("/tmp/recovery_selector.py")
          config = frozen_v2_config().model_copy(update={"reward_multiple": Decimal("1.0")})

          fresh_start, fresh_end = date(2025,1,2), date(2025,7,31)
          fresh_sets, fresh_cov = _load_block(cache, fresh_start, fresh_end)
          fresh_requested = int(fresh_cov["requested_sessions"])
          fresh_covered = int(fresh_cov["covered_sessions"])
          fresh_required = max(125, math.ceil(fresh_requested * 0.90))
          if fresh_covered < fresh_required:
              raise SystemExit(f"fresh backward coverage {fresh_covered}/{fresh_requested} below frozen requirement {fresh_required}")
          fresh = {
              "variant_id": "recovery_headroom_0.75R",
              "minimum_headroom_r": "0.75",
              **v5._metrics(module, fresh_sets, threshold, config, Decimal("100000"), spread),
          }
          fresh_verdict = v5._holdout_verdict(fresh)

          aggregate_start, aggregate_end = date(2025,1,2), date(2025,9,30)
          aggregate_sets, aggregate_cov = _load_block(cache, aggregate_start, aggregate_end)
          aggregate = {
              "variant_id": "recovery_headroom_0.75R",
              "minimum_headroom_r": "0.75",
              **v5._metrics(module, aggregate_sets, threshold, config, Decimal("100000"), spread),
          }
          aggregate_gate = (
              int(aggregate.get("trade_count") or 0) >= 7
              and float(aggregate.get("win_rate") or 0) >= 0.60
              and float(aggregate.get("expectancy_r") or -999) > 0
              and float(aggregate.get("max_drawdown_r") or 999) <= 5
          )
          unlock = fresh_verdict in {"GOLD", "ROBUST"} and aggregate_gate

          payload = {
              "purpose": "expanded untouched backward validation of frozen V5 0.75R headroom rule",
              "research_only": True,
              "production_strategy_changed": False,
              "execution_authority": False,
              "no_parameter_search": True,
              "selected_rule": "minimum 30pct-threshold headroom >=0.75R",
              "fresh_block": {
                  "period": [fresh_start.isoformat(), fresh_end.isoformat()],
                  "coverage": fresh_cov,
                  "coverage_policy": {"minimum_ratio": 0.90, "minimum_sessions": 125, "required_sessions": fresh_required},
                  "result": fresh,
                  "verdict": fresh_verdict,
              },
              "aggregate_external_block": {
                  "period": [aggregate_start.isoformat(), aggregate_end.isoformat()],
                  "coverage": aggregate_cov,
                  "minimum_trades": 7,
                  "minimum_win_rate": 0.60,
                  "minimum_expectancy_r_exclusive": 0,
                  "maximum_drawdown_r": 5,
                  "result": aggregate,
                  "gate_pass": aggregate_gate,
              },
              "forward_unlock": unlock,
              "forward_unlock_rule": "fresh Jan-Jul must be GOLD/ROBUST AND aggregate Jan-Sep must have >=7 trades, >=60% wins, positive expectancy, <=5R drawdown",
              "cache_namespace": namespace,
              "cache_basis": cache_basis,
          }
          out = Path("artifacts/v5-expanded-backward-validation")
          out.mkdir(parents=True, exist_ok=True)
          (out / "results.json").write_text(json.dumps(payload, indent=2, default=str) + "\n", encoding="utf-8")
          fresh_prec = fresh["recovery_precision"].get("future_30pct_recovery_precision")
          aggregate_prec = aggregate["recovery_precision"].get("future_30pct_recovery_precision")
          lines = [
              "# V5 expanded backward validation",
              "",
              f"- Fresh period: **{fresh_start} through {fresh_end}**",
              f"- Fresh coverage: **{fresh_covered}/{fresh_requested}** (required >= {fresh_required})",
              "- Rule: **frozen 0.75R recovery headroom; no threshold search**",
              f"- Fresh trades: **{fresh['trade_count']}** ({fresh['win_count']}W/{fresh['loss_count']}L)",
              f"- Fresh win rate: **{fresh['win_rate']}**",
              f"- Fresh expectancy: **{fresh['expectancy_r']}R**",
              f"- Fresh 90% LCB: **{fresh['one_sided_90_lcb_r']}R**",
              f"- Fresh max drawdown: **{fresh['max_drawdown_r']}R**",
              f"- Fresh >=30% recovery precision: **{fresh_prec}**",
              f"- Fresh verdict: **{fresh_verdict}**",
              "",
              f"- Aggregate Jan-Sep trades: **{aggregate['trade_count']}** ({aggregate['win_count']}W/{aggregate['loss_count']}L)",
              f"- Aggregate win rate: **{aggregate['win_rate']}**",
              f"- Aggregate expectancy: **{aggregate['expectancy_r']}R**",
              f"- Aggregate 90% LCB: **{aggregate['one_sided_90_lcb_r']}R**",
              f"- Aggregate max drawdown: **{aggregate['max_drawdown_r']}R**",
              f"- Aggregate >=30% recovery precision: **{aggregate_prec}**",
              f"- Aggregate external gate: **{'PASS' if aggregate_gate else 'FAIL'}**",
              f"- Forward unlock: **{'YES' if unlock else 'NO'}**",
              "",
          ]
          (out / "summary.md").write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PYCODE
          unlock="$(python - <<'PYCODE'
          import json
          print('true' if json.load(open('artifacts/v5-expanded-backward-validation/results.json', encoding='utf-8'))['forward_unlock'] else 'false')
          PYCODE
          )"
          echo "open_forward=${unlock}" >> "${GITHUB_OUTPUT}"

      - name: Freeze Mar31-Apr28 2026 forward block only after expanded backward pass
        if: steps.backward.outputs.open_forward == 'true'
        shell: bash
        run: |
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2026-03-31 \
            --end-date 2026-04-28 \
            --thresholds 100000 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v5-expanded-forward-capture \
            --reconstruction-max-age-days 180 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --max-hold-minutes 60 \
            --max-sessions 25 \
            --require-covered-session

      - name: Evaluate one-shot Mar31-Apr28 forward block
        if: steps.backward.outputs.open_forward == 'true'
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, math
          from datetime import date
          from decimal import Decimal
          from pathlib import Path
          import scripts.run_trading_strategy_v5_recovery_headroom as v5
          from app.trading.strategy_v2_qualification import frozen_v2_config
          from scripts.run_trading_strategy_backtest import strict_v11_strategy
          from scripts.run_trading_strategy_liquidity_sweep import _cache_namespace
          from scripts.run_trading_strategy_v2_extended_exploration import _load_block

          start, end = date(2026,3,31), date(2026,4,28)
          spread = Decimal("150")
          namespace, cache_basis = _cache_namespace(strict_v11_strategy(minimum_premarket_dollar_volume=Decimal("100000")), spread)
          datasets, coverage = _load_block(Path(".cache/trading-liquidity-datasets") / namespace, start, end)
          requested, covered = int(coverage["requested_sessions"]), int(coverage["covered_sessions"])
          required = max(18, math.ceil(requested * 0.90))
          if covered < required:
              raise SystemExit(f"forward coverage {covered}/{requested} below frozen requirement {required}")
          module = v5._load_selector("/tmp/recovery_selector.py")
          config = frozen_v2_config().model_copy(update={"reward_multiple": Decimal("1.0")})
          row = {"variant_id":"recovery_headroom_0.75R","minimum_headroom_r":"0.75",**v5._metrics(module,datasets,Decimal("0.75"),config,Decimal("100000"),spread)}
          verdict = v5._holdout_verdict(row)
          payload = {"purpose":"one-shot forward validation after expanded independent backward pass","research_only":True,"production_strategy_changed":False,"execution_authority":False,"no_parameter_search":True,"period":[start.isoformat(),end.isoformat()],"coverage":coverage,"coverage_policy":{"minimum_ratio":0.90,"minimum_sessions":18,"required_sessions":required},"selected_rule":"minimum 30pct-threshold headroom >=0.75R","result":row,"holdout_verdict":verdict,"cache_namespace":namespace,"cache_basis":cache_basis}
          out=Path("artifacts/v5-expanded-forward-validation"); out.mkdir(parents=True,exist_ok=True); (out/"results.json").write_text(json.dumps(payload,indent=2,default=str)+"\n",encoding="utf-8")
          precision=row["recovery_precision"].get("future_30pct_recovery_precision")
          summary="\n".join(["# V5 one-shot forward validation","",f"- Period: **{start} through {end}**",f"- Coverage: **{covered}/{requested}** (required >= {required})",f"- Trades: **{row['trade_count']}** ({row['win_count']}W/{row['loss_count']}L)",f"- Win rate: **{row['win_rate']}**",f"- Expectancy: **{row['expectancy_r']}R**",f"- 90% LCB: **{row['one_sided_90_lcb_r']}R**",f"- Max drawdown: **{row['max_drawdown_r']}R**",f"- >=30% recovery precision: **{precision}**",f"- Verdict: **{verdict}**",""])
          (out/"summary.md").write_text(summary,encoding="utf-8"); print(summary)
          PYCODE

      - name: Save expanded validation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-${{ runner.os }}-v5-expanded-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish summaries
        if: always()
        shell: bash
        run: |
          for summary in artifacts/v5-expanded-backward-validation/summary.md artifacts/v5-expanded-forward-validation/summary.md; do
            if [[ -f "${summary}" ]]; then cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"; printf '\n' >> "${GITHUB_STEP_SUMMARY}"; fi
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v5-expanded-backward-validation
          path: |
            artifacts/v5-expanded-backward-capture
            artifacts/v5-expanded-backward-validation
            artifacts/v5-expanded-forward-capture
            artifacts/v5-expanded-forward-validation
          if-no-files-found: warn
          retention-days: 30
