name: Omnix Agent Runtime gates

on:
  pull_request:
    branches: [main, "codingagent", "agent/generalized-agent-runtime", "agent/coding-quality-phases-20-31"]
    paths:
      - "src/app/platform/agent_runtime/**"
      - "src/tests/agent_runtime/**"
      - "src/tests/e2e/test_default_llm_agent_ui_flow.py"
      - "src/tests/persistence/test_agent_*"
      - "src/tests/persistence/test_workflow_*"
      - "src/tests/persistence/test_task_graph_*"
      - "src/app/platform/agent_runtime/routes.py"
      - "src/app/composition/gateway/__init__.py"
      - "src/app/platform/chat/assist/hermes.py"
      - "src/app/platform/assistant_tools/registry.py"
      - "src/app/platform/assistant_tools/hermes_bridge.py"
      - "src/app/platform/assistant_tools/home_adapter.py"
      - "src/app/platform/assistant_tools/trading_adapter.py"
      - "src/app/platform/assistant_tools/config_store.py"
      - "src/app/platform/assistant_tools/repo_adapter.py"
      - "src/app/persistence/migrations/*agent*.sql"
      - "src/app/persistence/migrations/*workflow*.sql"
      - "web/src/features/assistant/chat/ChatbotWorkspace.tsx"
      - "web/src/features/assistant/chat/ChatIdentityModeControl.*"
      - "web/src/features/assistant/chat/sessionTools.ts"
      - "web/src/features/assistant/chat/OmnixRunCard.*"
      - "web/src/features/assistant/chat/HtmlArtifactPreview.*"
      - "web/src/features/assistant/workspace/assistant-context-controller.ts"
      - "web/src/features/assistant/workspace/assistant-context-controller.css"
      - "web/src/features/assistant/workspace/assistant-context-controller.test.ts"
      - "src/app/platform/chat/assistant_context/models.py"
      - "src/app/platform/chat/assistant_context/routes.py"
      - "src/app/platform/chat/models.py"
      - "src/app/platform/chat/store.py"
      - "src/app/platform/chat/prompt_store.py"
      - "src/app/platform/chat/prompt_assembly.py"
      - "src/app/platform/chat/prompt_rendering.py"
      - "src/app/platform/chat/routing_context.py"
      - "src/app/platform/chat/history_search.py"
      - "src/app/platform/chat/compaction.py"
      - "src/app/platform/chat/memory_prompt.py"
      - "src/app/platform/chat/live_agent_store.py"
      - "src/app/platform/chat/sqlite_store.py"
      - "src/tests/unit/chat/test_routing_context.py"
      - "src/tests/unit/chat/test_memory_injection.py"
      - "src/tests/unit/assistant_context/test_local_workspace_context.py"
      - "web/src/api/client.ts"
      - "web/src/api/generated/**"
      - "web/package.json"
      - "package-lock.json"
      - ".github/workflows/agent-runtime.yml"
  workflow_dispatch:

concurrency:
  group: omnix-agent-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
    steps:
      - name: Check out immutable workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Expected head: ${expected}"
          echo "Checked out:   ${actual}"
          test "${actual}" = "${expected}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Agent Runtime test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
          npm ci
      - name: Apply PostgreSQL migrations
        run: python -m app.persistence migrate
      - name: Initialize empty PostgreSQL authority and local identity
        run: python -c "from app.persistence.startup import bootstrap_postgresql_runtime; bootstrap_postgresql_runtime()"
      - name: Compile Agent Runtime and Chat context modules
        run: |
          python -m compileall -q src/app/platform/agent_runtime
          python -m compileall -q src/app/platform/chat
      - name: Run Agent Runtime unit and authority tests
        run: |
          python -m pytest src/tests/agent_runtime -q --tb=short
          python -m pytest src/tests/unit/assistant_context/test_local_workspace_context.py -q --tb=short
          python -m pytest \
            src/tests/unit/chat/test_routing_context.py \
            src/tests/unit/chat/test_memory_injection.py \
            -q --tb=short
      - name: Run Agent Runtime PostgreSQL contracts
        run: |
          python -m pytest \
            src/tests/persistence/test_agent_budget_integration.py \
            src/tests/persistence/test_agent_runtime_repository_integration.py \
            src/tests/persistence/test_agent_evidence_integration.py \
            src/tests/persistence/test_agent_evidence_budget_integration.py \
            src/tests/persistence/test_agent_coding_quality_integration.py \
            src/tests/persistence/test_workflow_runtime_integration.py \
            src/tests/persistence/test_task_graph_repository_integration.py \
            -q --tb=short
      - name: Run Agent evidence classification and steering contracts
        run: |
          python -m pytest \
            src/tests/agent_runtime/test_evidence_policy.py \
            src/tests/agent_runtime/test_classification_matrix.py \
            -q --tb=short
      - name: Verify default-LLM UI fixture contract
        run: python -m pytest src/tests/e2e/test_default_llm_agent_ui_flow.py -q --tb=short -k fixture_contract
      - name: Typecheck web integration
        run: npm --workspace @omnix/web run typecheck
      - name: Verify generated gateway API contract
        run: npm --workspace @omnix/web run api:check
