name: Omnix Agent Runtime gates

on:
  pull_request:
    branches: [main, "agent/generalized-agent-runtime"]
    paths:
      - ".github/workflows/agent-runtime.yml"
      - "scripts/_quality_hardening_core_once.py"
      - "scripts/_quality_hardening_eval_once.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-quality-hardening:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Correct audited patch assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_quality_hardening_core_once.py')
          text = path.read_text(encoding='utf-8')
          changes = [
              (
                  '''    "reasoning_effort=_agent_reasoning_effort(),",\n    "reasoning_effort=_agent_reasoning_effort(resolved_provider),",\n    2,\n)''',
                  '''    "reasoning_effort=_agent_reasoning_effort(),",\n    "reasoning_effort=_agent_reasoning_effort(resolved_provider),",\n    3,\n)''',
              ),
              (
                  '''rep("src/app/agent_runtime/service.py", '\"stage\": \"implementing\",', '\"stage\": \"inspect\",', 2)''',
                  '''rep("src/app/agent_runtime/service.py", '\"stage\": \"implementing\",', '\"stage\": \"inspect\",', 3)''',
              ),
          ]
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit(f'assertion block changed: {old[:80]}')
              text = text.replace(old, new)
          obsolete = '''rep("src/app/agent_runtime/service.py", "            quality = PostgresCodingQualityRepository(repository.connection, self.context)\\n            quality.add_workspace_state(state)\\n", "            quality.add_workspace_state(state)\\n")\n'''
          if text.count(obsolete) != 1:
              raise SystemExit('obsolete quality cleanup assertion changed')
          text = text.replace(obsolete, '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply asserted hardening patches
        run: |
          python scripts/_quality_hardening_core_once.py
          python scripts/_quality_hardening_eval_once.py
          python -m py_compile \
            src/app/agent_runtime/contracts.py \
            src/app/agent_runtime/model_fidelity.py \
            src/app/agent_runtime/coding_quality.py \
            src/app/agent_runtime/coding_quality_repository.py \
            src/app/agent_runtime/service.py \
            src/app/agent_runtime/budget.py \
            src/app/agent_runtime/subagents.py \
            src/app/agent_runtime/quality_evaluation.py \
            src/tests/agent_runtime/test_coding_quality_final_hardening.py \
            src/tests/agent_runtime/test_live_coding_quality_matrix.py
          git diff --check
      - name: Remove one-shot machinery and restore normal workflow
        run: |
          rm scripts/_quality_hardening_core_once.py
          rm scripts/_quality_hardening_eval_once.py
          rm .github/workflows/zz-quality-hardening-once.yml
          git checkout HEAD^ -- .github/workflows/agent-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete coding quality roadmap hardening"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
