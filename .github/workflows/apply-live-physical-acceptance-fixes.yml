name: Apply Live physical acceptance fixes
on:
  push:
    branches: [agent/general-full-duplex-live]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix physical Live acceptance ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-full-duplex-live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply ownership and provenance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing pattern in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Do not preempt assistant audio merely because STT produced a final.
          replace(
              'apps/web/src/features/chatbot/ChatbotWorkspace.tsx',
              "      stopAssistantResponseAudio(undefined);\n      voiceTurnPerformanceRef.current = {",
              "      voiceTurnPerformanceRef.current = {",
          )

          # Make local Vite runtime provenance concrete without requiring shell setup.
          p = Path('apps/web/vite.config.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "import { defineConfig, type PluginOption } from 'vite';",
              "import { execFileSync } from 'node:child_process';\n\nimport { defineConfig, type PluginOption } from 'vite';",
              1,
          )
          text = text.replace(
              "export default defineConfig(({ command, mode }) => ({",
              """function resolveGitSha(): string {
  const configured = process.env.VITE_GIT_SHA?.trim();
  if (configured) return configured;
  try {
    return execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
  } catch {
    return 'unknown';
  }
}

