  process.env.VITE_GIT_SHA ??= gitSha;
  process.env.VITE_BUILD_ID ??= `${command}-${mode}-${gitSha.slice(0, 12)}`;
  return ({""",
              1,
          )
          if not text.rstrip().endswith('}));'):
              raise SystemExit('unexpected vite config ending')
