name: Cleanup live latency review workflows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Remove temporary review workflows
        run: |
          rm -f \
            .github/clean-live-latency-browser-failure.txt \
            .github/workflows/clean-live-latency-browser-diagnostics.yml \
            .github/workflows/clean-live-latency-browser-diagnostics-publish.yml \
            .github/workflows/restore-reviewed-live-stt-authority.yml \
            .github/workflows/finalize-live-latency-review.yml \
            .github/workflows/complete-live-latency-review.yml \
            .github/workflows/final-live-latency-review-validation.yml \
            .github/workflows/definitive-live-latency-review.yml \
            .github/workflows/cleanup-live-latency-review-workflows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary live latency review workflows"
            git push origin HEAD:${{ github.head_ref }}
          fi
