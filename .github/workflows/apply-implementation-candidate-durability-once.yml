name: Apply implementation candidate durability once

on:
  push:
    branches:
      - agent/self-review-protocol-durability
    paths:
      - .github/workflows/apply-implementation-candidate-durability-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/self-review-protocol-durability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply durability patch
        run: |
          python -m py_compile scripts/apply_implementation_candidate_durability_once.py
          python scripts/apply_implementation_candidate_durability_once.py
          python -m compileall -q src/app/agent_runtime src/app/assistant_tools
          python -m py_compile \
            src/tests/agent_runtime/test_self_review_protocol_durability.py \
            src/tests/agent_runtime/test_governed_browser_mcp.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Run focused agent-runtime regression suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            src/tests/agent_runtime/test_self_review_protocol_durability.py \
            src/tests/agent_runtime/test_governed_browser_mcp.py \
            src/tests/agent_runtime/test_coding_quality_phases_20_31.py \
            src/tests/agent_runtime/test_pi_runtime.py \
            src/tests/agent_runtime/test_service_failure_visibility.py \
            -q --tb=short

      - name: Commit durable fix and remove one-shot machinery
        shell: bash
        run: |
          git rm -f \
            scripts/apply_implementation_candidate_durability_once.py \
            .github/workflows/apply-implementation-candidate-durability-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agent): require implementation proof before review"
          git push origin HEAD:agent/self-review-protocol-durability
