name: Debug world lore web typecheck

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-typecheck-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Capture full TypeScript output
        id: typecheck
        shell: bash
        run: |
          set +e
          npm --workspace @omnix/web run typecheck > world-lore-web-typecheck.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-lore-web-typecheck
          path: world-lore-web-typecheck.txt
      - name: Preserve typecheck result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
