name: Trading V4 confirmed recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v4-confirmed-recovery.yml
      - scripts/run_trading_strategy_v4_confirmed_recovery.py

permissions:
  contents: read

concurrency:
  group: trading-historical-alpaca-${{ github.repository }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
    steps:
      - name: Check out exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact Oct-March causal development cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-march-holdout-32681695579-1
          fail-on-cache-miss: true

      - name: Recover exact frozen V3 watch-selector source
        shell: bash
        run: |
          python scripts/recover_trading_v3_selector.py --output /tmp/recovery_selector.py
          python -m py_compile /tmp/recovery_selector.py scripts/run_trading_strategy_v4_confirmed_recovery.py

      - name: Run Oct-March V4 development study
        id: development
        shell: bash
        run: |
          rm -f /tmp/v4-selected.json
          python scripts/run_trading_strategy_v4_confirmed_recovery.py \
            --mode development \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --start-date 2025-10-01 \
            --end-date 2026-03-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --selector-source /tmp/recovery_selector.py \
            --selection-file /tmp/v4-selected.json \
            --output-dir artifacts/v4-confirmed-recovery-development
          if [[ -f /tmp/v4-selected.json ]]; then
            echo "selected=true" >> "${GITHUB_OUTPUT}"
            echo "Frozen development selection:"
            cat /tmp/v4-selected.json
          else
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            echo "No V4 variant cleared the predeclared development gate. Later holdout remains unopened."
          fi

      - name: Verify Alpaca credentials only if a V4 candidate passed development
        if: steps.development.outputs.selected == 'true'
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Alpaca credentials are required only because a frozen V4 candidate earned a new holdout."
            exit 2
          fi

      - name: Freeze new March-April temporal holdout only after development selection
        if: steps.development.outputs.selected == 'true'
        shell: bash
        run: |
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2026-03-31 \
            --end-date 2026-04-28 \
            --thresholds 100000 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v4-confirmed-recovery-holdout-capture \
            --reconstruction-max-age-days 180 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --max-hold-minutes 60 \
            --max-sessions 25 \
            --require-covered-session

      - name: Save frozen V4 temporal holdout cache
        if: steps.development.outputs.selected == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-${{ runner.os }}-v4-holdout-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run exactly one selected V4 holdout
        if: steps.development.outputs.selected == 'true'
        shell: bash
        run: |
          retention="$(python - <<'PYCODE'
          import json
          print(json.load(open('/tmp/v4-selected.json', encoding='utf-8'))['retention'])
          PYCODE
          )"
          echo "Testing frozen retention=${retention}; no holdout search or fallback is permitted."
          python scripts/run_trading_strategy_v4_confirmed_recovery.py \
            --mode holdout \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --start-date 2026-03-31 \
            --end-date 2026-04-28 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --selector-source /tmp/recovery_selector.py \
            --retention "${retention}" \
            --output-dir artifacts/v4-confirmed-recovery-holdout

      - name: Publish V4 summaries
        if: always()
        shell: bash
        run: |
          for summary in \
            artifacts/v4-confirmed-recovery-development/summary.md \
            artifacts/v4-confirmed-recovery-holdout/summary.md; do
            if [[ -f "${summary}" ]]; then
              cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
              printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            fi
          done

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v4-confirmed-recovery
          path: |
            artifacts/v4-confirmed-recovery-development
            artifacts/v4-confirmed-recovery-holdout-capture
            artifacts/v4-confirmed-recovery-holdout
          if-no-files-found: warn
          retention-days: 30
