name: PR integration tree metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tree-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Record integration tree metadata
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "head_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "base_sha=$(git rev-parse 'origin/${{ github.base_ref }}')"
            echo "base_tree=$(git rev-parse 'origin/${{ github.base_ref }}^{tree}')"
          } | tee pr-integration-tree-metadata.txt

      - name: Upload integration tree metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-integration-tree-metadata
          path: pr-integration-tree-metadata.txt
