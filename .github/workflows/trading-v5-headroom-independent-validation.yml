name: Trading V5 headroom independent validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v5-headroom-independent-validation.yml

permissions:
  contents: read

concurrency:
  group: trading-v5-headroom-independent-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
    steps:
      - name: Check out exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Verify Alpaca historical credentials
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Alpaca credentials are required to freeze the independent historical blocks."
            exit 2
          fi

      - name: Restore immutable causal cache basis
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-march-holdout-32681695579-1
          fail-on-cache-miss: true

      - name: Recover exact frozen V3 selector source
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, re
          from pathlib import Path
          expected = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          text = Path(".github/workflows/trading-v3-recovery-precision-search.yml").read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', text)
          if match is None:
              raise SystemExit("embedded selector payload not found")
          payload = match.group(1)
          for index in range(-1, len(payload)):
              candidate = payload if index < 0 else payload[:index] + payload[index + 1:]
              try:
                  source = gzip.decompress(base64.b64decode(candidate, validate=True))
              except Exception:
                  continue
              if hashlib.sha256(source).hexdigest() == expected:
                  Path("/tmp/recovery_selector.py").write_bytes(source)
                  print(f"Recovered exact selector source sha256={expected}")
                  break
          else:
              raise SystemExit("exact selector source fingerprint not recoverable")
          PYCODE
          python -m py_compile /tmp/recovery_selector.py scripts/run_trading_strategy_v5_recovery_headroom.py

      - name: Freeze untouched backward temporal block
        shell: bash
        run: |
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2025-08-01 \
            --end-date 2025-09-30 \
            --thresholds 100000 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v5-headroom-backward-capture \
            --reconstruction-max-age-days 450 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --max-hold-minutes 60 \
            --max-sessions 50 \
            --require-covered-session

      - name: Validate exact 0.75R headroom rule backward
        id: backward
        shell: bash
        run: |
          python scripts/run_trading_strategy_v5_recovery_headroom.py \
            --mode holdout \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --start-date 2025-08-01 \
            --end-date 2025-09-30 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --selector-source /tmp/recovery_selector.py \
            --minimum-headroom-r 0.75 \
            --output-dir artifacts/v5-headroom-backward-validation
          verdict="$(python - <<'PYCODE'
          import json
          print(json.load(open('artifacts/v5-headroom-backward-validation/results.json', encoding='utf-8'))['holdout_verdict'])
          PYCODE
          )"
          echo "verdict=${verdict}" >> "${GITHUB_OUTPUT}"
          if [[ "${verdict}" == "GOLD" || "${verdict}" == "ROBUST" ]]; then
            echo "open_forward=true" >> "${GITHUB_OUTPUT}"
            echo "Independent backward block passed; exact frozen rule may proceed to the later temporal holdout."
          else
            echo "open_forward=false" >> "${GITHUB_OUTPUT}"
            echo "Independent backward block did not pass; later temporal holdout remains unopened."
          fi

      - name: Freeze later temporal holdout only after independent backward pass
        if: steps.backward.outputs.open_forward == 'true'
        shell: bash
        run: |
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2026-03-31 \
            --end-date 2026-04-28 \
            --thresholds 100000 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v5-headroom-forward-capture \
            --reconstruction-max-age-days 180 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --max-hold-minutes 60 \
            --max-sessions 25 \
            --require-covered-session

      - name: Run one-shot later temporal validation
        if: steps.backward.outputs.open_forward == 'true'
        shell: bash
        run: |
          python scripts/run_trading_strategy_v5_recovery_headroom.py \
            --mode holdout \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --start-date 2026-03-31 \
            --end-date 2026-04-28 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --selector-source /tmp/recovery_selector.py \
            --minimum-headroom-r 0.75 \
            --output-dir artifacts/v5-headroom-forward-validation

      - name: Save independent validation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-${{ runner.os }}-v5-independent-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish validation summaries
        if: always()
        shell: bash
        run: |
          for summary in \
            artifacts/v5-headroom-backward-validation/summary.md \
            artifacts/v5-headroom-forward-validation/summary.md; do
            if [[ -f "${summary}" ]]; then
              cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
              printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            fi
          done

      - name: Upload independent validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v5-headroom-independent-validation
          path: |
            artifacts/v5-headroom-backward-capture
            artifacts/v5-headroom-backward-validation
            artifacts/v5-headroom-forward-capture
            artifacts/v5-headroom-forward-validation
          if-no-files-found: warn
          retention-days: 30
