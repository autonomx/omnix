name: Apply self-review protocol durability once

on:
  push:
    branches: ["agent/self-review-protocol-durability"]
    paths:
      - ".github/workflows/apply-self-review-protocol-durability-once.yml"
      - "scripts/apply_self_review_protocol_durability_once.py"
      - "scripts/prepare_self_review_protocol_durability_once.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-self-review-protocol-durability-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/self-review-protocol-durability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare asserted carrier
        run: |
          python -m py_compile scripts/apply_self_review_protocol_durability_once.py scripts/prepare_self_review_protocol_durability_once.py
          python scripts/prepare_self_review_protocol_durability_once.py prepare
          python -m py_compile scripts/apply_self_review_protocol_durability_once.py
      - name: Apply production patch
        run: python scripts/apply_self_review_protocol_durability_once.py
      - name: Align existing quality regression expectation
        run: python scripts/prepare_self_review_protocol_durability_once.py post
      - name: Compile affected Python
        run: |
          python -m compileall -q src/app/agent_runtime
          python -m py_compile src/tests/agent_runtime/test_self_review_protocol_durability.py src/tests/agent_runtime/test_coding_quality_phases_20_31.py
      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Run focused self-review and runtime regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            src/tests/agent_runtime/test_self_review_protocol_durability.py \
            src/tests/agent_runtime/test_coding_quality_phases_20_31.py \
            src/tests/agent_runtime/test_pi_runtime.py \
            src/tests/agent_runtime/test_service_failure_visibility.py \
            -q --tb=short
      - name: Commit production result and self-remove carrier
        shell: bash
        run: |
          git rm scripts/apply_self_review_protocol_durability_once.py scripts/prepare_self_review_protocol_durability_once.py .github/workflows/apply-self-review-protocol-durability-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agent): make self-review protocol recovery durable"
          git push origin HEAD:agent/self-review-protocol-durability
