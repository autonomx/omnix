name: One-shot execution price fallback

on:
  push:
    branches: ["agent/taskgraph-phases-15-19"]
    paths:
      - ".github/workflows/one-shot-execution-price-fallback.yml"
      - ".github/execution-price-fallback.trigger"

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taskgraph-phases-15-19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply reviewed execution fallback patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1. Alpaca: a valid latest trade remains usable research price evidence
          # even when the quote book is absent. Execution eligibility still fails
          # closed because bid/ask remain None.
          replace_once(
              "src/app/trading/providers/alpaca_iex.py",
              '''        latest_quote = payload.get("latestQuote")\n        latest_trade = payload.get("latestTrade")\n        if not isinstance(latest_quote, dict):\n            raise ProviderDataUnavailableError("Alpaca IEX snapshot has no latest quote")\n        if not isinstance(latest_trade, dict):\n            raise ProviderDataUnavailableError("Alpaca IEX snapshot has no latest trade")\n\n        quote_time = _parse_timestamp(latest_quote.get("t"), field="quote")\n        trade_time = _parse_timestamp(latest_trade.get("t"), field="trade")\n        source_time = min(quote_time, trade_time)\n''',
              '''        latest_quote = payload.get("latestQuote")\n        latest_trade = payload.get("latestTrade")\n        if not isinstance(latest_trade, dict):\n            raise ProviderDataUnavailableError("Alpaca IEX snapshot has no latest trade")\n\n        quote_available = isinstance(latest_quote, dict)\n        quote_time = (\n            _parse_timestamp(latest_quote.get("t"), field="quote")\n            if quote_available\n            else None\n        )\n        trade_time = _parse_timestamp(latest_trade.get("t"), field="trade")\n        source_time = min(quote_time, trade_time) if quote_time is not None else trade_time\n''',
          )
          replace_once(
              "src/app/trading/providers/alpaca_iex.py",
              '''            "bid": latest_quote.get("bp"),\n            "ask": latest_quote.get("ap"),\n            "bid_size": _round_lot_shares(latest_quote.get("bs")),\n            "ask_size": _round_lot_shares(latest_quote.get("as")),\n''',
              '''            "bid": latest_quote.get("bp") if quote_available else None,\n            "ask": latest_quote.get("ap") if quote_available else None,\n            "bid_size": _round_lot_shares(latest_quote.get("bs")) if quote_available else None,\n            "ask_size": _round_lot_shares(latest_quote.get("as")) if quote_available else None,\n''',
          )

          # 2. AI SHADOW: track degraded fills explicitly and simulate price-only
          # research fills with deterministic adverse friction. These never become
          # execution eligible or qualification evidence.
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''    execution_drag_dollars: Decimal = Decimal("0")\n    fill_count: int = 0\n''',
              '''    execution_drag_dollars: Decimal = Decimal("0")\n    fill_count: int = 0\n    degraded_fill_count: int = Field(default=0, ge=0)\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''    fill_reason: str\n    execution_eligible: bool = False\n    halted: bool = False\n    execution_authority: Literal[False] = False\n''',
              '''    fill_reason: str\n    execution_eligible: bool = False\n    halted: bool = False\n    observation_quality: Literal["book", "price_only", "bar_close_fallback"] = "book"\n    hypothetical: bool = False\n    assumed_friction_bps: Decimal | None = Field(default=None, ge=0)\n    execution_authority: Literal[False] = False\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''    policy: PaperExecutionPolicy | None = None,\n    max_capture_lag_seconds: Decimal = Decimal("60"),\n) -> AIShadowFillSimulation:\n''',
              '''    policy: PaperExecutionPolicy | None = None,\n    max_capture_lag_seconds: Decimal = Decimal("60"),\n    allow_degraded_price_only: bool = False,\n    degraded_spread_bps: Decimal = Decimal("150"),\n) -> AIShadowFillSimulation:\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''    halted = execution.get("halted") is True\n    eligible = execution.get("execution_eligible") is True\n    if (\n''',
              '''    halted = execution.get("halted") is True\n    eligible = execution.get("execution_eligible") is True\n    quality_value = str(execution.get("observation_quality") or "")\n    if quality_value not in {"book", "price_only", "bar_close_fallback"}:\n        quality_value = "book" if bid is not None and ask is not None else "price_only"\n    degraded_price_only = bool(\n        allow_degraded_price_only\n        and last is not None\n        and (bid is None or ask is None)\n        and not halted\n    )\n    if (\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''            execution_eligible=eligible,\n            halted=halted,\n        )\n\n    observation = PaperMarketObservation(\n''',
              '''            execution_eligible=eligible,\n            halted=halted,\n            observation_quality=quality_value,\n        )\n\n    if degraded_price_only:\n        assert last is not None\n        total_friction_bps = degraded_spread_bps + active.slippage_bps\n        fraction = total_friction_bps / Decimal("10000")\n        fill_price = last * (\n            Decimal("1") + fraction if side == "buy" else Decimal("1") - fraction\n        )\n        return AIShadowFillSimulation(\n            paper_execution_policy_version=active.policy_version,\n            side=side,\n            decision_at=decision_at,\n            source_time=source_time,\n            requested_units=requested_units,\n            filled_units=requested_units,\n            reference_price=reference_price,\n            fill_price=fill_price,\n            bid=bid,\n            ask=ask,\n            spread_bps=spread,\n            slippage_bps=active.slippage_bps,\n            should_fill=True,\n            fill_reason="degraded_price_only_hypothetical",\n            execution_eligible=False,\n            halted=False,\n            observation_quality=quality_value,\n            hypothetical=True,\n            assumed_friction_bps=total_friction_bps,\n        )\n\n    observation = PaperMarketObservation(\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''        execution_eligible=eligible,\n        halted=halted,\n    )\n\n\ndef apply_fill(\n''',
              '''        execution_eligible=eligible,\n        halted=halted,\n        observation_quality=quality_value,\n    )\n\n\ndef apply_fill(\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''                "execution_drag_dollars": state.execution_drag_dollars + drag,\n                "fill_count": state.fill_count + 1,\n''',
              '''                "execution_drag_dollars": state.execution_drag_dollars + drag,\n                "fill_count": state.fill_count + 1,\n                "degraded_fill_count": state.degraded_fill_count + (1 if fill.hypothetical else 0),\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''            "execution_drag_dollars": state.execution_drag_dollars + drag,\n            "fill_count": state.fill_count + 1,\n''',
              '''            "execution_drag_dollars": state.execution_drag_dollars + drag,\n            "fill_count": state.fill_count + 1,\n            "degraded_fill_count": state.degraded_fill_count + (1 if fill.hypothetical else 0),\n''',
          )

          # 3. AI monitor: expose execution quality to the model, fall back to the
          # causal finalized bar close when the execution provider is unavailable,
          # and allow degraded hypothetical fills without confusing them with
          # canonical execution evidence.
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''def _execution_payload(observation: Any) -> dict[str, object]:\n    payload = {field: getattr(observation, field, None) for field in _EXECUTION_FIELDS}\n    spread = getattr(observation, "spread_bps", None)\n    payload["spread_bps"] = spread\n    return payload\n''',
              '''def _execution_payload(observation: Any) -> dict[str, object]:\n    payload = {field: getattr(observation, field, None) for field in _EXECUTION_FIELDS}\n    spread = getattr(observation, "spread_bps", None)\n    payload["spread_bps"] = spread\n    bid = payload.get("bid")\n    ask = payload.get("ask")\n    last = payload.get("last")\n    payload["observation_quality"] = (\n        "book"\n        if bid is not None and ask is not None\n        else "price_only"\n        if last is not None\n        else "unavailable"\n    )\n    return payload\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow.py",
              '''            "rejection_reasons": list(execution.get("rejection_reasons") or ()),\n        },\n''',
              '''            "rejection_reasons": list(execution.get("rejection_reasons") or ()),\n            "observation_quality": execution.get("observation_quality"),\n            "price_only": (\n                execution.get("last") is not None\n                and (execution.get("bid") is None or execution.get("ask") is None)\n            ),\n        },\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''                except Exception:\n                    execution = {\n                        "bid": None,\n                        "ask": None,\n                        "last": str(learning.current_price),\n                        "spread_bps": None,\n                        "execution_eligible": False,\n                        "halted": None,\n                        "freshness_mode": "unknown",\n                        "rejection_reasons": ("EXECUTION_OBSERVATION_UNAVAILABLE",),\n                    }\n''',
              '''                except Exception as execution_exc:\n                    latest_bar = bars[-1]\n                    execution = {\n                        "provider": latest_bar.provider or "configured_history",\n                        "bid": None,\n                        "ask": None,\n                        "last": latest_bar.close,\n                        "spread_bps": None,\n                        "execution_eligible": False,\n                        "halted": None,\n                        "source_time": latest_bar.end_time,\n                        "freshness_mode": "fallback",\n                        "observation_quality": "bar_close_fallback",\n                        "rejection_reasons": (\n                            "EXECUTION_OBSERVATION_UNAVAILABLE",\n                            "RESEARCH_BAR_CLOSE_FALLBACK",\n                        ),\n                        "execution_fallback_detail": (\n                            f"{type(execution_exc).__name__}: {execution_exc}"\n                        ),\n                    }\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''        except Exception as exc:\n            await self._append(\n                repository,\n                config,\n                instrument_id=candidate.instrument_id,\n                event_type="ai_shadow_fill",\n                state="unfilled",\n                reason_code="AI_SHADOW_EXECUTION_EVIDENCE_ERROR",\n                observed_at=observed_at,\n                payload={\n                    "policy": policy,\n                    "decision_at": observed_at,\n                    "side": side,\n                    "requested_units": str(units),\n                    "detail": f"{type(exc).__name__}: {exc}",\n                    "position_before": position.model_dump(mode="json"),\n                    "position_after": position.model_dump(mode="json"),\n                    "research_only": True,\n                    "execution_authority": False,\n                },\n                identity=(policy, observed_at.astimezone(timezone.utc).isoformat(), "fill"),\n            )\n            return\n\n        if side == "buy":\n''',
              '''        except Exception as exc:\n            fallback_execution = row.get("execution")\n            if (\n                isinstance(fallback_execution, dict)\n                and fallback_execution.get("last") is not None\n                and isinstance(fallback_execution.get("source_time"), datetime)\n            ):\n                execution = dict(fallback_execution)\n                execution.setdefault("observation_quality", "bar_close_fallback")\n                execution["execution_fallback_detail"] = f"{type(exc).__name__}: {exc}"\n            else:\n                await self._append(\n                    repository,\n                    config,\n                    instrument_id=candidate.instrument_id,\n                    event_type="ai_shadow_fill",\n                    state="unfilled",\n                    reason_code="AI_SHADOW_EXECUTION_EVIDENCE_ERROR",\n                    observed_at=observed_at,\n                    payload={\n                        "policy": policy,\n                        "decision_at": observed_at,\n                        "side": side,\n                        "requested_units": str(units),\n                        "detail": f"{type(exc).__name__}: {exc}",\n                        "position_before": position.model_dump(mode="json"),\n                        "position_after": position.model_dump(mode="json"),\n                        "research_only": True,\n                        "execution_authority": False,\n                    },\n                    identity=(policy, observed_at.astimezone(timezone.utc).isoformat(), "fill"),\n                )\n                return\n\n        if side == "buy":\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''            if not allowed:\n                await self._append(\n''',
              '''            price_only_research = bool(\n                execution.get("last") is not None\n                and (execution.get("bid") is None or execution.get("ask") is None)\n                and execution.get("halted") is not True\n            )\n            if not allowed and not price_only_research:\n                await self._append(\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''            reference_price=result.current_price,\n        )\n''',
              '''            reference_price=result.current_price,\n            allow_degraded_price_only=True,\n            degraded_spread_bps=config.risk.max_spread_bps,\n        )\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''            "closed_position": after.model_dump(mode="json") if closed_trade else None,\n            "research_only": True,\n''',
              '''            "closed_position": after.model_dump(mode="json") if closed_trade else None,\n            "degraded_execution": after.degraded_fill_count > 0,\n            "research_only": True,\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''                "fill_count": after.fill_count,\n                "decision_count": decision_count,\n''',
              '''                "fill_count": after.fill_count,\n                "degraded_fill_count": after.degraded_fill_count,\n                "degraded_execution": after.degraded_fill_count > 0,\n                "decision_count": decision_count,\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''            trades = [event for event in all_trades if event.state == "closed"]\n            incomplete_trades = [\n                event for event in all_trades if event.state == "incomplete"\n            ]\n''',
              '''            closed_trades = [event for event in all_trades if event.state == "closed"]\n            trades = [\n                event for event in closed_trades\n                if event.payload.get("degraded_execution") is not True\n            ]\n            hypothetical_trades = [\n                event for event in closed_trades\n                if event.payload.get("degraded_execution") is True\n            ]\n            incomplete_trades = [\n                event for event in all_trades if event.state == "incomplete"\n            ]\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''                "trade_count": len(trades),\n                "incomplete_trade_count": len(incomplete_trades),\n''',
              '''                "trade_count": len(trades),\n                "hypothetical_trade_count": len(hypothetical_trades),\n                "total_closed_trade_count": len(closed_trades),\n                "incomplete_trade_count": len(incomplete_trades),\n''',
          )
          # The second closed-trade aggregation lives in comparison_summary.ai_arm.
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''            trades = [event for event in all_trades if event.state == "closed"]\n            incomplete_trades = [\n                event for event in all_trades if event.state == "incomplete"\n            ]\n''',
              '''            closed_trades = [event for event in all_trades if event.state == "closed"]\n            trades = [\n                event for event in closed_trades\n                if event.payload.get("degraded_execution") is not True\n            ]\n            hypothetical_trades = [\n                event for event in closed_trades\n                if event.payload.get("degraded_execution") is True\n            ]\n            incomplete_trades = [\n                event for event in all_trades if event.state == "incomplete"\n            ]\n''',
          )
          replace_once(
              "src/app/trading/strategy_ai_shadow_monitor.py",
              '''                "trade_count": len(trades),\n                "incomplete_trade_count": len(incomplete_trades),\n''',
              '''                "trade_count": len(trades),\n                "hypothetical_trade_count": len(hypothetical_trades),\n                "total_closed_trade_count": len(closed_trades),\n                "incomplete_trade_count": len(incomplete_trades),\n''',
          )

          # 4. Hardening wrapper: AI input validity is now "usable causal price",
          # not "must have bid+ask". Missing book remains visible and non-executable.
          replace_once(
              "src/app/trading/trading_data_hardening.py",
              '''            missing_execution = (\n                "EXECUTION_OBSERVATION_UNAVAILABLE" in rejection_reasons\n                or not isinstance(execution, dict)\n                or execution.get("bid") is None\n                or execution.get("ask") is None\n            )\n''',
              '''            missing_execution = (\n                not isinstance(execution, dict)\n                or execution.get("last") is None\n            )\n''',
          )

          # 5. Provider regression tests.
          replace_once(
              "src/tests/trading/test_trading_alpaca_iex_execution.py",
              '''    def __init__(self, *, historical_payload=None):\n        self.calls: list[tuple[str, dict[str, object]]] = []\n        self.historical_payload = historical_payload\n''',
              '''    def __init__(self, *, historical_payload=None, snapshot_payload=None):\n        self.calls: list[tuple[str, dict[str, object]]] = []\n        self.historical_payload = historical_payload\n        self.snapshot_payload = snapshot_payload\n''',
          )
          replace_once(
              "src/tests/trading/test_trading_alpaca_iex_execution.py",
              '''        if url.endswith("/bars") and self.historical_payload is not None:\n            return _FixtureResponse(self.historical_payload)\n        return _FixtureResponse()\n''',
              '''        if url.endswith("/bars") and self.historical_payload is not None:\n            return _FixtureResponse(self.historical_payload)\n        if url.endswith("/snapshot") and self.snapshot_payload is not None:\n            return _FixtureResponse(self.snapshot_payload)\n        return _FixtureResponse()\n''',
          )
          insert_after = '''    assert request["headers"] == {\n        "APCA-API-KEY-ID": "paper-key",\n        "APCA-API-SECRET-KEY": "paper-secret",\n    }\n\n\n'''
          new_test = '''def test_alpaca_iex_latest_trade_without_book_is_price_only_not_exception(monkeypatch) -> None:\n    _credentials(monkeypatch)\n    runtime = _FixtureRuntime(\n        snapshot_payload={\n            "latestTrade": {\n                "t": "2026-08-18T14:00:00.050000Z",\n                "p": 10.00,\n                "s": 100,\n            },\n            "minuteBar": {\n                "t": "2026-08-18T14:00:00Z",\n                "o": 9.98,\n                "h": 10.04,\n                "l": 9.97,\n                "c": 10.00,\n                "v": 2500,\n            },\n            "dailyBar": {"v": 1_250_000},\n        }\n    )\n    value = _provider(runtime).execution_observation(\n        "equity:NASDAQ:AAPL",\n        policy=ExecutionEligibilityPolicy(max_age_seconds="300", max_spread_bps="100"),\n    )\n\n    assert value.last == Decimal("10.0")\n    assert value.bid is None\n    assert value.ask is None\n    assert value.execution_eligible is False\n    assert "BID_ASK_UNAVAILABLE" in value.rejection_reasons\n    assert value.freshness_mode == "live"\n\n\n'''
          p = Path("src/tests/trading/test_trading_alpaca_iex_execution.py")
          text = p.read_text()
          marker = "def test_alpaca_iex_indicator_history_starts_at_0400_et_and_excludes_open_bar"
          if marker not in text or "test_alpaca_iex_latest_trade_without_book_is_price_only_not_exception" in text:
              raise SystemExit("provider test insertion marker mismatch")
          p.write_text(text.replace(marker, new_test + marker, 1))

          # 6. Degraded fill regression.
          p = Path("src/tests/trading/test_strategy_ai_shadow.py")
          text = p.read_text()
          marker = "def test_position_state_tracks_add_reduce_and_realized_pnl() -> None:\n"
          new_test = '''def test_ai_price_only_fallback_is_hypothetical_and_excluded_from_execution_authority() -> None:\n    execution = {\n        "provider": "alpaca_iex",\n        "last": Decimal("10"),\n        "bid": None,\n        "ask": None,\n        "source_time": DECISION_AT + timedelta(seconds=2),\n        "spread_bps": None,\n        "execution_eligible": False,\n        "freshness_mode": "live",\n        "rejection_reasons": ("BID_ASK_UNAVAILABLE",),\n        "halted": False,\n        "observation_quality": "price_only",\n    }\n    fill = simulate_ai_shadow_fill(\n        execution,\n        side="buy",\n        instrument_id=INSTRUMENT,\n        binding_id="alpaca:TEST",\n        decision_at=DECISION_AT,\n        requested_units=Decimal("1"),\n        reference_price=Decimal("10"),\n        allow_degraded_price_only=True,\n        degraded_spread_bps=Decimal("150"),\n    )\n\n    assert fill.should_fill is True\n    assert fill.hypothetical is True\n    assert fill.execution_eligible is False\n    assert fill.observation_quality == "price_only"\n    assert fill.assumed_friction_bps == Decimal("160")\n    assert fill.fill_price == Decimal("10") * Decimal("1.016")\n    state = apply_fill(\n        AIShadowPositionState(policy="minute", instrument_id=INSTRUMENT),\n        fill,\n        trade_id="degraded-trade",\n    )\n    assert state.degraded_fill_count == 1\n\n\n'''
          if marker not in text or "test_ai_price_only_fallback_is_hypothetical" in text:
              raise SystemExit("AI fallback test insertion marker mismatch")
          p.write_text(text.replace(marker, new_test + marker, 1))

          # 7. Document the degraded execution semantics.
          p = Path("docs/trading/MARKET_EVIDENCE_V2.md")
          text = p.read_text()
          anchor = "## AI research behavior\n\n"
          addition = '''## Degraded execution-price research\n\nA missing bid/ask book no longer suppresses deterministic or AI research when a causal market price is still available. The research price tiers are:\n\n- Alpaca IEX latest trade with quote book: normal book observation;\n- Alpaca IEX latest trade without a quote book: `price_only`;\n- when the execution provider is unavailable but causal 1-minute history exists: latest finalized bar close as `bar_close_fallback`.\n\nPrice-only/fallback observations are always `execution_eligible=false`. AI SHADOW may simulate a clearly tagged hypothetical fill using the configured maximum entry spread plus normal paper slippage as deterministic adverse friction. Those trades are reported separately as hypothetical/degraded and are excluded from canonical execution-return statistics. AUTO PAPER BUY authorization still requires a fresh authoritative bid/ask observation and a known spread inside the live limit.\n\n'''
          if anchor not in text or "## Degraded execution-price research" in text:
              raise SystemExit("documentation insertion marker mismatch")
          p.write_text(text.replace(anchor, addition + anchor, 1))
          PY
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Run focused execution fallback tests
        run: |
          python -m pytest \
            src/tests/trading/test_trading_alpaca_iex_execution.py \
            src/tests/trading/test_strategy_ai_shadow.py \
            src/tests/trading/test_strategy_ai_shadow_monitor.py \
            src/tests/trading/test_trading_market_evidence_v2.py \
            -q --tb=short
      - name: Run full Trading backend gate
        run: |
          python -m pytest src/tests/trading src/tests/providers/test_chatgpt_codex_reliability.py -q --tb=short
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/trading/providers/alpaca_iex.py \
                  src/app/trading/strategy_ai_shadow.py \
                  src/app/trading/strategy_ai_shadow_monitor.py \
                  src/app/trading/trading_data_hardening.py \
                  src/tests/trading/test_trading_alpaca_iex_execution.py \
                  src/tests/trading/test_strategy_ai_shadow.py \
                  docs/trading/MARKET_EVIDENCE_V2.md
          git commit -m "Allow price-only execution fallback for trading research"
          git push origin HEAD:agent/taskgraph-phases-15-19
