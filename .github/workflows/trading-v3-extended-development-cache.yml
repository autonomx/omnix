name: Trading V3 extended development cache

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v3-extended-development-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extend-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
    steps:
      - name: Check out exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets pytest playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Verify historical-data credentials
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Alpaca credentials are required only for missing cached sessions."
            exit 2
          fi

      - name: Build append-only extended cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=trading-liquidity-datasets-v2-causal-${RUNNER_OS}-extended-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Restore existing causal datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            trading-liquidity-datasets-v2-causal-${{ runner.os }}-

      - name: Fill only missing October-February sessions
        run: |
          mkdir -p .cache/trading-liquidity-datasets
          python scripts/run_trading_strategy_liquidity_sweep.py \
            --start-date 2025-10-01 \
            --end-date 2026-02-27 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v3-extended-cache-capture \
            --reconstruction-max-age-days 500 \
            --max-sessions 120 \
            --thresholds 100000 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --require-covered-session

      - name: Re-run frozen break-and-hold hypotheses over extended development block
        run: |
          python scripts/run_trading_strategy_v3_breakout_hold_research.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2025-10-01 \
            --development-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --minimum-development-trades 5 \
            --minimum-coverage-ratio 0.80 \
            --minimum-covered-sessions 50 \
            --output-dir artifacts/v3-extended-breakout-hold

      - name: Save extended causal cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: ${{ steps.cache-key.outputs.key }}

      - name: Publish summaries
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/v3-extended-cache-capture/summary.md ]]; then
            cat artifacts/v3-extended-cache-capture/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f artifacts/v3-extended-breakout-hold/summary.md ]]; then
            cat artifacts/v3-extended-breakout-hold/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload extended development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-extended-development-evidence
          path: |
            artifacts/v3-extended-cache-capture
            artifacts/v3-extended-breakout-hold
          if-no-files-found: warn
          retention-days: 30
