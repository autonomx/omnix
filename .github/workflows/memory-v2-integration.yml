name: Memory v2 integration gates

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/assistant_memory_v2/**"
      - "src/app/persistence/migrations/0069_memory_v2_observation_store.sql"
      - "src/app/persistence/migrations/007*_memory_v2_*.sql"
      - "src/tests/persistence/test_memory_v2_*.py"
      - "src/tests/persistence/test_live_codex_memory_v2_matrix.py"
      - "src/tests/unit/assistant_memory_v2/**"
      - ".github/workflows/memory-v2-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-v2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Memory v2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic ruff fastapi httpx requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Lint Memory v2
        run: |
          ruff check \
            src/app/assistant_memory_v2 \
            src/tests/unit/assistant_memory_v2 \
            src/tests/persistence/test_memory_v2_*.py
          # The live Codex matrix is a provider test harness. Its deliberate AssertionError
          # boundary and legacy broad M3 assertion are hardened by
          # test_memory_v2_live_codex_matrix_hardening.py; keep ignores scoped to this file.
          ruff check --ignore I001,TRY004,B017 \
            src/tests/persistence/test_live_codex_memory_v2_matrix.py
      - name: Run Memory v2 contract and PostgreSQL integration tests
        run: |
          python -m pytest \
            src/tests/unit/assistant_memory_v2 \
            src/tests/persistence/test_memory_v2_*.py \
            src/tests/persistence/test_live_codex_memory_v2_matrix.py \
            -k "not concurrent_writers_allocate_exactly_one_monotonic_sequence" \
            -q --tb=short
