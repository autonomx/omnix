name: Trading V3 recovery March holdout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v3-recovery-march-holdout.yml

permissions:
  contents: read

concurrency:
  group: trading-v3-recovery-march-holdout-${{ github.repository }}
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
    steps:
      - name: Check out exact holdout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore immutable causal cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-march-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trading-liquidity-datasets-v2-causal-Linux-march-holdout-
            trading-liquidity-datasets-v2-causal-Linux-extended-

      - name: Verify Alpaca credentials for cache misses
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Alpaca credentials are required only if March cache sessions are missing."
            exit 2
          fi

      - name: Freeze March 2026 sessions, reconstructing only cache misses
        shell: bash
        run: |
          mkdir -p artifacts/v3-recovery-march-capture
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2026-03-02 \
            --end-date 2026-03-27 \
            --thresholds 100000 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v3-recovery-march-capture \
            --reconstruction-max-age-days 365 \
            --max-sessions 30 \
            --initial-cash 100000 \
            --assumed-spread-bps 150

      - name: Save frozen March causal cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-march-holdout-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Recover exact frozen recovery-selector source
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, re
          from pathlib import Path
          expected = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          text = Path(".github/workflows/trading-v3-recovery-precision-search.yml").read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', text)
          if match is None:
              raise SystemExit("embedded selector payload not found")
          payload = match.group(1)
          for index in range(-1, len(payload)):
              candidate = payload if index < 0 else payload[:index] + payload[index + 1:]
              try:
                  source = gzip.decompress(base64.b64decode(candidate, validate=True))
              except Exception:
                  continue
              if hashlib.sha256(source).hexdigest() == expected:
                  Path("/tmp/recovery_selector.py").write_bytes(source)
                  print(f"Recovered exact selector source sha256={expected}")
                  break
          else:
              raise SystemExit("exact selector source fingerprint not recoverable")
          PYCODE
          python -m py_compile /tmp/recovery_selector.py

      - name: Run one-shot March holdout
        shell: bash
        run: |
          python - <<'PYCODE'
          import importlib.util
          import json
          import sys
          from datetime import date
          from decimal import Decimal
          from pathlib import Path

          import app.trading.strategy_backtest as strategy_backtest
          from app.trading.strategy_v2_qualification import frozen_v2_config
          from scripts.run_trading_strategy_backtest import strict_v11_strategy
          from scripts.run_trading_strategy_liquidity_sweep import _cache_namespace
          from scripts.run_trading_strategy_v2_extended_exploration import _load_block, _run_variant

          SOURCE_SHA = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          spec = importlib.util.spec_from_file_location("recovery_selector", "/tmp/recovery_selector.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          # EXACT development-selected selector. No March-dependent changes.
          rule = module.Rule((
              module.Predicate("rebound>=20", "recovery", "recovery_pct", ">=", 20),
              module.Predicate("retrace>=80", "retracement", "retracement_pct", ">=", 80),
              module.Predicate("selloff>=15", "selloff", "selloff_pct", ">=", 15),
              module.Predicate("vol5x>=1.5", "volume_ratio", "volume_ratio5", ">=", 1.5),
          ))
          evaluator = module._evaluator_for(rule)

          spread = Decimal("150")
          initial_cash = Decimal("100000")
          basis = strict_v11_strategy(minimum_premarket_dollar_volume=Decimal("100000"))
          namespace, cache_basis = _cache_namespace(basis, spread)
          datasets, coverage = _load_block(
              Path(".cache/trading-liquidity-datasets") / namespace,
              date(2026, 3, 2),
              date(2026, 3, 27),
          )
          if int(coverage["covered_sessions"]) != int(coverage["requested_sessions"]):
              raise SystemExit(f"March holdout must be complete before reveal: {coverage}")

          # EXACT development-selected trade expression:
          # next eligible bar, evaluator's latest-five finalized 1m lows - 15 bps stop,
          # 1.0R target, +0.75R -> +0.25R protection, 60m max hold, no RSI exit.
          config = frozen_v2_config().model_copy(update={"reward_multiple": Decimal("1.0")})
          original_rsi = strategy_backtest.relative_strength_index
          strategy_backtest.relative_strength_index = lambda values, period: [Decimal("0")] * max(0, len(values) - int(period))
          try:
              with module._research_evaluator(evaluator):
                  run = _run_variant(datasets, config, initial_cash=initial_cash, spread=spread)
          finally:
              strategy_backtest.relative_strength_index = original_rsi

          metrics = module._trade_metrics(run)
          trade_count = int(metrics.get("trade_count") or 0)
          win_rate = float(metrics.get("win_rate") or 0)
          expectancy = float(metrics.get("expectancy_r") or -999)
          drawdown = float(metrics.get("max_drawdown_r") or 999)

          # Predeclared before March metrics are inspected.
          # FULL = enough trades and close to the desired 75%/+0.20R regime.
          # ROBUST = positive OOS economics with tolerable degradation.
          powered = trade_count >= 5
          full_pass = powered and win_rate >= 0.70 and expectancy >= 0.15 and drawdown <= 3
          gold_pass = powered and win_rate >= 0.75 and expectancy >= 0.20 and drawdown <= 3
          robust_pass = powered and win_rate >= 0.60 and expectancy > 0 and drawdown <= 3
          verdict = "GOLD_PASS" if gold_pass else "FULL_PASS" if full_pass else "ROBUST_PASS" if robust_pass else "UNDERPOWERED" if not powered else "FAIL"

          payload = {
              "purpose": "one-shot sealed March holdout for development-selected V3 recovery candidate",
              "research_only": True,
              "production_strategy_changed": False,
              "execution_authority": False,
              "provider_calls_during_evaluation": 0,
              "holdout_window": ["2026-03-02", "2026-03-27"],
              "selector_rule": rule.key,
              "selector_source_sha256": SOURCE_SHA,
              "cache_namespace": namespace,
              "cache_basis": cache_basis,
              "coverage": coverage,
              "assumed_spread_bps": "150",
              "trade_expression": {
                  "entry": "next eligible 1m bar after causal selector signal",
                  "stop": "latest five finalized 1m lows minus 15 bps",
                  "target_r": "1.0",
                  "profit_protection": "+0.75R arm -> +0.25R protected stop",
                  "max_hold_minutes": 60,
                  "rsi_exit": "disabled",
              },
              "predeclared_holdout_gates": {
                  "minimum_trades_for_powered_verdict": 5,
                  "gold": {"minimum_win_rate": 0.75, "minimum_expectancy_r": 0.20, "maximum_drawdown_r": 3},
                  "full": {"minimum_win_rate": 0.70, "minimum_expectancy_r": 0.15, "maximum_drawdown_r": 3},
                  "robust": {"minimum_win_rate": 0.60, "minimum_expectancy_r_exclusive": 0, "maximum_drawdown_r": 3},
              },
              "metrics": metrics,
              "verdict": verdict,
              "trades": run.get("trades"),
              "rule_after_holdout": "No parameter, selector, exit, stop, target, or fallback changes are permitted based on this March reveal. Any successor hypothesis must start a new development/holdout cycle.",
          }

          out = Path("artifacts/v3-recovery-march-holdout")
          out.mkdir(parents=True, exist_ok=True)
          (out / "results.json").write_text(json.dumps(payload, indent=2, default=str) + "\n", encoding="utf-8")
          lines = [
              "# V3 recovery March 2026 sealed holdout",
              "",
              "One frozen candidate; no March search, fallback, or retuning.",
              "",
              f"- Selector: `{rule.key}`",
              f"- Sessions covered: {coverage['covered_sessions']}/{coverage['requested_sessions']}",
              f"- Trades: {metrics.get('trade_count')}",
              f"- Wins / losses: {metrics.get('win_count')} / {metrics.get('loss_count')}",
              f"- Win rate: {metrics.get('win_rate')}",
              f"- Expectancy: {metrics.get('expectancy_r')}R",
              f"- One-sided 90% LCB: {metrics.get('one_sided_90_lcb_r')}R",
              f"- Max drawdown: {metrics.get('max_drawdown_r')}R",
              f"- Verdict: **{verdict}**",
              "",
              "Holdout gates were declared in the workflow before this run revealed March metrics.",
          ]
          (out / "summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PYCODE

      - name: Publish holdout summary
        if: always()
        run: |
          cat artifacts/v3-recovery-march-capture/summary.md >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
          cat artifacts/v3-recovery-march-holdout/summary.md >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true

      - name: Upload March holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-recovery-march-holdout
          path: |
            artifacts/v3-recovery-march-capture
            artifacts/v3-recovery-march-holdout
          if-no-files-found: warn
          retention-days: 30
