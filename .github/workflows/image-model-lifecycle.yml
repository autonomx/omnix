name: Image model lifecycle gates

on:
  pull_request:
    paths:
      - "src/app/platform/image/**"
      - "src/app/platform/image/image_http_client.py"
      - "src/services/image/image_service_app.py"
      - "src/services/image/image_service_runtime.py"
      - "src/app/platform/image/routes/models.py"
      - "src/app/platform/image/routes/assets.py"
      - "src/app/composition/launcher/service_manager.py"
      - "src/app/jobs/models.py"
      - "src/app/settings/effective_defaults.py"
      - "src/app/platform/characters/avatar_generation_api.py"
      - "src/app/platform/characters/avatar_generation_models.py"
      - "web/src/features/assistant/chat/characterAvatarClient.ts"
      - "web/src/features/assistant/chat/characterAvatarClient.test.ts"
      - "src/tests/app/test_effective_settings_defaults.py"
      - "src/tests/app/test_image_asset_file_route.py"
      - "src/tests/unit/characters/test_avatar_generation_logging.py"
      - "src/tests/unit/characters/test_avatar_generation_provider_contract.py"
      - "src/tests/unit/gateway/test_image_model_routes.py"
      - "src/tests/unit/image/**"
      - "src/tests/unit/launcher/test_image_service_manual_start.py"
      - "web/src/features/image-generation/**"
      - "src/services/image/image.in"
      - "src/services/image/image.lock.txt"
      - "scripts/requirements/requirements-rpg-visual-flux.txt"
      - "bootstrap_omnix_flux_env.ps1"
      - ".github/workflows/image-model-lifecycle.yml"
  push:
    paths:
      - "src/app/platform/image/**"
      - "src/app/platform/image/image_http_client.py"
      - "src/services/image/image_service_app.py"
      - "src/services/image/image_service_runtime.py"
      - "src/app/platform/image/routes/models.py"
      - "src/app/platform/image/routes/assets.py"
      - "src/app/composition/launcher/service_manager.py"
      - "src/app/jobs/models.py"
      - "src/app/settings/effective_defaults.py"
      - "src/app/platform/characters/avatar_generation_api.py"
      - "src/app/platform/characters/avatar_generation_models.py"
      - "web/src/features/assistant/chat/characterAvatarClient.ts"
      - "web/src/features/assistant/chat/characterAvatarClient.test.ts"
      - "src/tests/app/test_effective_settings_defaults.py"
      - "src/tests/app/test_image_asset_file_route.py"
      - "src/tests/unit/characters/test_avatar_generation_logging.py"
      - "src/tests/unit/characters/test_avatar_generation_provider_contract.py"
      - "src/tests/unit/gateway/test_image_model_routes.py"
      - "src/tests/unit/image/**"
      - "src/tests/unit/launcher/test_image_service_manual_start.py"
      - "web/src/features/image-generation/**"
      - "src/services/image/image.in"
      - "src/services/image/image.lock.txt"
      - "scripts/requirements/requirements-rpg-visual-flux.txt"
      - "bootstrap_omnix_flux_env.ps1"
      - ".github/workflows/image-model-lifecycle.yml"

jobs:
  backend-image-lifecycle:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Run image lifecycle, avatar routing, and browser-output tests
        run: >-
          python -m pytest
          src/tests/app/test_effective_settings_defaults.py
          src/tests/app/test_image_asset_file_route.py
          src/tests/unit/characters/test_avatar_generation_logging.py
          src/tests/unit/characters/test_avatar_generation_provider_contract.py
          src/tests/unit/gateway/test_image_model_routes.py
          src/tests/unit/image/test_image_reference_transport.py
          src/tests/unit/image/test_image_service_on_demand.py
          src/tests/unit/image/test_image_service_model_download.py
          src/tests/unit/image/test_image_output_normalization.py
          src/tests/unit/image/test_image_service_start.py
          src/tests/unit/launcher/test_image_service_manual_start.py
          -q --tb=short

  web-image-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Typecheck image lifecycle modules
        run: |
          cat > web/tsconfig.image-lifecycle.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "types": ["vite/client"]
            },
            "include": [
              "src/*.d.ts",
              "src/features/assistant/chat/characterAvatarClient.ts",
              "src/features/image-generation/**/*.ts",
              "src/features/image-generation/**/*.tsx"
            ],
            "exclude": [
              "src/**/*.test.ts",
              "src/**/*.test.tsx",
              "src/**/*.spec.ts",
              "src/**/*.spec.tsx"
            ]
          }
          JSON
          cd web
          npx tsc -p tsconfig.image-lifecycle.json
