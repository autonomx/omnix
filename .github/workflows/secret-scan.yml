name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  architecture-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint test dependencies
        run: python -m pip install pytest==9.1.1 playwright==1.61.0
      - name: Verify architecture lint detectors and shrinking baseline
        run: python -m pytest src/tests/scripts/test_architecture_lint.py -q --tb=short
      - name: Check architecture and migration invariants
        env:
          OMNIX_LINT_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: python scripts/architecture_lint.py --check --migration-base "$OMNIX_LINT_MIGRATION_BASE" --output artifacts/architecture-lint.json
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-lint
          path: artifacts/architecture-lint.json
          if-no-files-found: error

  architecture-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix_test
          POSTGRES_PASSWORD: architecture-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix_test -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OMNIX_TEST_DATABASE_URL: postgresql://omnix_test:architecture-test-only@127.0.0.1:5432/omnix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Temporary measurement profile; WP-1.3 replaces this with hashed locks.
      - name: Install provider-free measurement dependencies
        run: >-
          python -m pip install
          pytest==9.1.1 fastapi==0.133.1 uvicorn==0.41.0 httpx==0.28.1
          pydantic==2.13.4 requests==2.33.0 python-multipart==0.0.27
          pillow==12.2.0 playwright==1.61.0 numpy==2.4.6 psutil==7.2.2
          "psycopg[binary]==3.3.4" psycopg-pool==3.3.1 rich==14.3.3 websockets==15.0.1
      - name: Verify all scorecard detectors and disposable probe guards
        run: python -m pytest src/tests/scripts/test_architecture_metrics.py src/tests/scripts/test_architecture_runtime_metrics.py -q --tb=short
      - name: Measure runtime in a disposable source snapshot
        run: python scripts/architecture_runtime_metrics.py --timeout 600 --output artifacts/architecture-runtime.json
      - name: Check the architecture ratchet
        run: python scripts/architecture_metrics.py --check --runtime-report artifacts/architecture-runtime.json --output artifacts/architecture-metrics.json
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-metrics
          path: artifacts/architecture-*.json
          if-no-files-found: error

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current source tree
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.0
        with:
          args: dir /github/workspace --config /github/workspace/.gitleaks.toml --redact --verbose
