name: Trading V2 continuous qualification patch

on:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - scripts/patch_trading_v2_qualification_ui.py
      - .github/workflows/trading-v2-qualification-ui.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply guarded V2 continuous-qualification lifecycle
        run: python scripts/patch_trading_v2_qualification_ui.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4" pytest

      - name: Run V2 lifecycle and authority regressions
        run: |
          pytest -q \
            src/tests/trading/test_trading_strategy_shadow_universe.py \
            src/tests/trading/test_trading_strategy_shadow_execution.py \
            src/tests/trading/test_trading_strategy_v2_qualification_monitor.py \
            src/tests/trading/test_trading_strategy_v2_qualification.py \
            src/tests/trading/test_trading_gap_pullback_v2.py
          git diff --check

      - name: Commit qualified lifecycle and remove staging files
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            scripts/patch_trading_v2_qualification_ui.py \
            .github/workflows/trading-v2-qualification-ui.yml \
            scripts/patch_trading_v2_continuous_qualification.py \
            .github/workflows/trading-v2-continuous-qualification.yml
          git add \
            src/app/trading/strategy_shadow_universe.py \
            src/app/trading/strategy_v2_qualification_monitor.py \
            src/tests/trading/test_trading_strategy_shadow_universe.py \
            src/tests/trading/test_trading_strategy_v2_qualification_monitor.py
          git commit -m "trading: continue V2 qualification after promotion"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Report success
        if: success()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "Continuous V2 qualification passed focused archive/SHADOW/V2 regressions and pushed \`${{ steps.commit.outputs.sha }}\`. Post-session raw-archive replay now continues in AUTO PAPER as read-only evidence, while the execution fallback remains SHADOW-only and cannot authorize orders. All temporary V2 staging workflow/script files were removed in the same commit."

      - name: Report failure
        if: failure()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "Continuous V2 qualification lifecycle failed on source head \`${GITHUB_SHA}\`. No lifecycle patch from this run should be trusted; inspect the workflow before continuing."
