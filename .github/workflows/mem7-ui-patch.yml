name: MEM-7 one-time UI patch

on:
  push:
    branches:
      - tmp-mem7-manage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mem7-manage
          fetch-depth: 0
      - name: Apply deterministic Chat memory UI patch
        run: python scripts/mem7_ui_patch.py
      - name: Remove one-time patch assets
        run: rm scripts/mem7_ui_patch.py .github/workflows/mem7-ui-patch.yml
      - name: Commit patched workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEM-7 integrate functional memory view"
          git push origin HEAD:tmp-mem7-manage
