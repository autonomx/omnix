name: Character live voice resolution

on:
  pull_request:
    paths:
      - "src/app/assets/canonical_voice_clones.py"
      - "src/app/characters/live_call.py"
      - "src/app/characters/service.py"
      - "src/app/tts_http_client.py"
      - "src/app/voice_debug.py"
      - "src/tts_server.py"
      - "src/tests/unit/assets/test_canonical_voice_clone_resolution.py"
      - "src/tests/unit/characters/test_live_call.py"
      - "src/tests/unit/test_voice_resolution_debug_logging.py"
      - "src/apps/web/src/features/assistant-workspace/runtime-config.ts"
      - "src/apps/web/src/features/assistant-workspace/runtime-config.test.ts"
      - "src/apps/web/src/features/assistant-workspace/voice-resolution-diagnostics.ts"
      - "src/apps/web/src/features/assistant-workspace/assistant-pcm-stream-player.test.ts"
      - "src/apps/web/src/features/assistant-workspace/chat-message-audio-controller-v2.ts"
      - "src/apps/web/src/features/assistant-workspace/chat-message-audio-controller-v2.test.ts"
      - "src/apps/web/src/features/assistant-workspace/live-voice-smooth-audio-controller.ts"
      - "src/apps/web/src/features/chatbot/characterClient.ts"
      - "src/apps/web/src/features/chatbot/characterClient.test.ts"
      - "src/apps/web/src/features/chatbot/CharacterModePanel.tsx"
      - "src/apps/web/src/features/chatbot/CharacterModePanel.test.tsx"
      - "src/apps/web/src/features/chatbot/CharacterManagementPanel.tsx"
      - "src/apps/web/src/features/chatbot/CharacterManagementPanel.selection.test.tsx"
      - "src/apps/web/src/features/chatbot/VoiceGovernancePanel.tsx"
      - "src/apps/web/src/features/chatbot/VoiceGovernancePanel.test.tsx"
      - "src/apps/web/src/features/voice/voiceLibraryAssetFallback.ts"
      - "src/apps/web/src/features/voice/voiceLibraryAssetFallback.test.ts"
      - ".github/workflows/character-live-voice-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-character-live-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install focused Python dependencies
        run: >-
          python -m pip install
          ruff pytest pydantic fastapi httpx requests python-multipart pillow
      - name: Install web dependencies
        run: npm install
      - name: Lint voice resolution path
        run: |
          ruff check \
            src/app/assets/canonical_voice_clones.py \
            src/app/characters/live_call.py \
            src/app/characters/service.py \
            src/app/tts_http_client.py \
            src/app/voice_debug.py \
            src/tests/unit/assets/test_canonical_voice_clone_resolution.py \
            src/tests/unit/characters/test_live_call.py \
            src/tests/unit/test_voice_resolution_debug_logging.py
          python -m py_compile src/tts_server.py
      - name: Verify canonical and live-call voice resolution
        run: >-
          pytest -q
          --confcutdir=src/tests/unit
          src/tests/unit/assets/test_canonical_voice_clone_resolution.py
          src/tests/unit/characters/test_live_call.py
          src/tests/unit/test_voice_resolution_debug_logging.py
      - name: Verify browser playback and character reassignment
        run: >-
          npm --workspace @omnix/web run test --
          src/features/assistant-workspace/runtime-config.test.ts
          src/features/assistant-workspace/assistant-pcm-stream-player.test.ts
          src/features/assistant-workspace/chat-message-audio-controller-v2.test.ts
          src/features/chatbot/characterClient.test.ts
          src/features/chatbot/CharacterModePanel.test.tsx
          src/features/chatbot/CharacterManagementPanel.selection.test.tsx
          src/features/chatbot/VoiceGovernancePanel.test.tsx
          src/features/voice/voiceLibraryAssetFallback.test.ts
