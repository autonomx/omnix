name: Trading V2 prospective authority patch

on:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - scripts/patch_trading_v2_prospective_authority.py
      - .github/workflows/trading-v2-prospective-authority.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Apply guarded prospective authority integration
        run: python scripts/patch_trading_v2_prospective_authority.py

      - name: Run targeted V2 authority regressions
        run: |
          python -m pytest \
            src/tests/trading/test_trading_strategy_v2_qualification.py \
            src/tests/trading/test_trading_strategy_v2_qualification_monitor.py \
            src/tests/trading/test_trading_strategy_shadow_execution.py \
            src/tests/trading/test_trading_strategy_shadow_universe.py \
            src/tests/trading/test_trading_gap_pullback_v2.py \
            src/tests/trading/test_trading_gap_pullback_v2_management.py \
            src/tests/trading/test_trading_gap_pullback_v2_backtest_management.py \
            src/tests/trading/test_trading_gap_pullback_automation.py \
            -q --tb=short
          git diff --check

      - name: Commit qualified patch
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/trading/strategy_repository.py \
            src/app/trading/strategy_monitor.py \
            src/app/trading/strategy_api.py \
            src/app/gateway/trading_routes.py
          git commit -m "trading: gate V2 auto paper on prospective evidence"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Report success
        if: success()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "V2 prospective authority integration passed targeted strategy/SHADOW/management regressions and pushed \`${{ steps.commit.outputs.sha }}\`. Server create/update and runtime new-entry paths now fail closed unless the exact frozen 2.0 profile satisfies the predeclared Aug-24 prospective thresholds and has an explicit review bound to the current evidence fingerprint. Protection reconciliation remains ahead of the gate."

      - name: Report failure
        if: failure()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "V2 prospective authority integration failed on source head \`${GITHUB_SHA}\`. No authority patch from this run should be trusted; inspect the workflow before continuing."
