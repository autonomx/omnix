name: Apply Live Phase 4 finish fix

on:
  push:
    branches:
      - agent/general-full-duplex-live

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-full-duplex-live
          fetch-depth: 0

      - name: Restore stable generation-queue settlement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/assistant-workspace/live-voice-pcm-session.ts')
          source = path.read_text(encoding='utf-8')
          old = """  const finish = async (): Promise<void> => {
              if (closed || inputFinished) return;
              inputFinished = true;
              await generationQueue.catch(() => undefined);
              if (closed) return;
              node.port.postMessage({ type: 'end' });
              await waitForDrain();
              reporter.record('turn_playback_drained', {
                total_frames: totalFrames,
                total_received_samples: totalReceivedSamples,
                total_playback_samples: totalPlaybackSamples,
                semantic_speech_samples: totalReceivedSamples * audioContext.sampleRate / REQUESTED_SAMPLE_RATE,
                underruns,
                resumes,
                elapsed_ms: performance.now() - startedAtMs,
              }, 'pcm_session');
              await terminateSession('turn-finished', true);
            };"""
          new = """  const finish = async (): Promise<void> => {
              if (closed || inputFinished) return;
              let observedQueue = generationQueue;
              while (true) {
                await observedQueue.catch(() => undefined);
                await Promise.resolve();
                if (generationQueue === observedQueue) break;
                observedQueue = generationQueue;
              }
              if (closed || inputFinished) return;
              inputFinished = true;
              await generationQueue.catch(() => undefined);
              if (closed) return;
              node.port.postMessage({ type: 'end' });
              await waitForDrain();
              reporter.record('turn_playback_drained', {
                total_frames: totalFrames,
                total_received_samples: totalReceivedSamples,
                total_playback_samples: totalPlaybackSamples,
                semantic_speech_samples: totalReceivedSamples * audioContext.sampleRate / REQUESTED_SAMPLE_RATE,
                underruns,
                resumes,
                elapsed_ms: performance.now() - startedAtMs,
              }, 'pcm_session');
              await terminateSession('turn-finished', true);
            };"""
          if old not in source:
              raise SystemExit('Expected finish implementation was not found.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit branch patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-pcm-session.ts
          git commit -m "Restore Live PCM finish queue settlement"
          git push origin HEAD:agent/general-full-duplex-live
