name: CHAR-9 apply memory content spans

on:
  push:
    branches: [tmp-char9-management]

permissions:
  contents: write

jobs:
  apply-spans:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-char9-management
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_char9_memory_spans.py
      - name: Commit memory spans
        run: |
          if git diff --quiet -- apps/web/src/features/chatbot/CharacterManagementPanel.tsx; then
            echo 'Memory spans already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/chatbot/CharacterManagementPanel.tsx
          git commit -m 'CHAR-9 expose stable memory content nodes'
          git push origin HEAD:tmp-char9-management
