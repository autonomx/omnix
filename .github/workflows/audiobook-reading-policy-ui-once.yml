name: Patch audiobook reading policy UI once

on:
  push:
    branches: ["agent/audiobook-v1"]
    paths:
      - ".github/workflows/audiobook-reading-policy-ui-once.yml"

permissions:
  contents: write

concurrency:
  group: audiobook-reading-policy-ui-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audiobook-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Patch audiobook workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/apps/web/src/features/audiobook/AudiobookWorkspace.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"missing patch marker: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
          """interface Chapter extends ChapterSummary {
            canonical_text: string;
            spans: Span[];
          }
          """,
          """interface DocumentBlockView {
            id: string;
            original_text: string;
            effective_role: string;
            confidence: number;
            render_action: 'READ' | 'SKIP' | 'READ_ONCE';
            speaker_analysis_visibility: 'INCLUDE' | 'CONTEXT_ONLY' | 'EXCLUDE';
            provenance: { source?: string; signal?: string; value?: unknown }[];
          }

          interface Chapter extends ChapterSummary {
            canonical_text: string;
            spans: Span[];
            document_blocks?: DocumentBlockView[];
            audiobook_mode?: 'standard' | 'story_only' | 'verbatim';
          }
          """,
          )

          replace_once(
          """  actual_runtime_seconds?: number;
          }
          """,
          """  actual_runtime_seconds?: number;
            audiobook_mode?: 'standard' | 'story_only' | 'verbatim';
            document_structure_version?: string;
            render_policy_version?: string;
            analysis_policy_version?: string;
          }
          """,
          )

          replace_once(
          """async function reclassifyAudiobook(projectId: string): Promise<void> {
            await omnixApiClient.post<Record<string, never>, { job_id: string }>(
              `${base}/projects/${encodeURIComponent(projectId)}/reclassify`, {},
            );
          }

          function formatDuration(seconds?: number): string {
          """,
          """async function reclassifyAudiobook(projectId: string): Promise<void> {
            await omnixApiClient.post<Record<string, never>, { job_id: string }>(
              `${base}/projects/${encodeURIComponent(projectId)}/reclassify`, {},
            );
          }

          async function setAudiobookReadingMode(
            projectId: string, mode: 'standard' | 'story_only' | 'verbatim',
          ): Promise<void> {
            const response = await fetch(
              `${base}/projects/${encodeURIComponent(projectId)}/reading-policy`,
              {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode }),
              },
            );
            if (!response.ok) throw await responseError(response);
          }

          async function setDocumentBlockAction(
            projectId: string, blockId: string, action: 'DEFAULT' | 'READ' | 'SKIP',
          ): Promise<void> {
            const response = await fetch(
              `${base}/projects/${encodeURIComponent(projectId)}/document-overrides`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  scope: 'BLOCK',
                  scope_key: blockId,
                  action,
                  role_override: null,
                }),
              },
            );
            if (!response.ok) throw await responseError(response);
          }

          function formatDuration(seconds?: number): string {
          """,
          )

          replace_once(
          """              <label>Author<input value={projectAuthor} onChange={(event) => setProjectAuthor(event.target.value)} /></label>
                        <button type="button" disabled={busy || !projectTitle.trim() || (projectTitle === project.title && projectAuthor === project.author)}
          """,
          """              <label>Author<input value={projectAuthor} onChange={(event) => setProjectAuthor(event.target.value)} /></label>
                        <label>Audiobook reading mode
                          <select
                            aria-label="Audiobook reading mode"
                            value={project.audiobook_mode ?? 'standard'}
                            disabled={busy}
                            onChange={(event) => {
                              const mode = event.target.value as 'standard' | 'story_only' | 'verbatim';
                              void action(
                                () => setAudiobookReadingMode(project.id, mode),
                                `Reading mode changed to ${mode.replaceAll('_', ' ')}.`,
                              );
                            }}
                          >
                            <option value="standard">Standard audiobook</option>
                            <option value="story_only">Story only</option>
                            <option value="verbatim">Verbatim source</option>
                          </select>
                          <small>Standard reads story and chapter structure while skipping TOCs, page numbers, running headers, and publishing metadata.</small>
                        </label>
                        <button type="button" disabled={busy || !projectTitle.trim() || (projectTitle === project.title && projectAuthor === project.author)}
          """,
          )

          old = """         {project && librarySection === 'chapters' && <section className="audiobook-chapter-inspector"><div className="audiobook-panel-heading"><p className="eyebrow">Chapter summary</p><h2>{project.chapters.find((chapter) => chapter.id === activeChapterId)?.title ?? 'No chapter selected'}</h2></div><p>{project.chapters.find((chapter) => chapter.id === activeChapterId)?.character_count === undefined ? '—' : project.chapters.find((chapter) => chapter.id === activeChapterId)?.character_count.toLocaleString()} characters</p><p>{project.review_issues.filter((issue) => issue.chapter_id === activeChapterId).length} review issues</p><button type="button" className="audiobook-primary-action" onClick={() => startChapter(project.chapters.find((chapter) => chapter.id === activeChapterId) ?? project.chapters[0])} disabled={!activeChapterId}>▣ Open in editor</button><div className="audiobook-quick-actions"><button type="button" onClick={() => setProjectSettingsOpen(true)}>Replace source</button><button type="button" disabled={busy || !activeChapterId} onClick={() => { const chapter = project.chapters.find((item) => item.id === activeChapterId); if (chapter) void action(() => queueChapterPreview(chapter), 'Chapter preview queued.'); }}>Preview first span</button></div></section>}"""
          new = """         {project && librarySection === 'chapters' && <section className="audiobook-chapter-inspector"><div className="audiobook-panel-heading"><p className="eyebrow">Chapter summary</p><h2>{project.chapters.find((chapter) => chapter.id === activeChapterId)?.title ?? 'No chapter selected'}</h2></div><p>{project.chapters.find((chapter) => chapter.id === activeChapterId)?.character_count === undefined ? '—' : project.chapters.find((chapter) => chapter.id === activeChapterId)?.character_count.toLocaleString()} characters</p><p>{project.review_issues.filter((issue) => issue.chapter_id === activeChapterId).length} review issues</p><button type="button" className="audiobook-primary-action" onClick={() => startChapter(project.chapters.find((chapter) => chapter.id === activeChapterId) ?? project.chapters[0])} disabled={!activeChapterId}>▣ Open in editor</button><div className="audiobook-quick-actions"><button type="button" onClick={() => setProjectSettingsOpen(true)}>Replace source</button><button type="button" disabled={busy || !activeChapterId} onClick={() => { const chapter = project.chapters.find((item) => item.id === activeChapterId); if (chapter) void action(() => queueChapterPreview(chapter), 'Chapter preview queued.'); }}>Preview first span</button></div>{selectedChapter?.document_blocks?.some((block) => block.render_action === 'SKIP') && <div className="audiobook-detail-list" aria-label="Skipped audiobook content"><p><strong>Skipped by reading policy</strong><span>{selectedChapter.document_blocks.filter((block) => block.render_action === 'SKIP').length}</span></p>{selectedChapter.document_blocks.filter((block) => block.render_action === 'SKIP').slice(0, 8).map((block) => <p key={block.id} title={block.provenance.map((item) => `${item.source ?? 'rule'}:${item.signal ?? 'evidence'}`).join(', ')}><strong>{block.original_text || '(blank block)'}</strong><span>{block.effective_role.replaceAll('_', ' ')} · {Math.round(block.confidence * 100)}%</span><button type="button" disabled={busy} aria-label={`Read skipped block ${block.original_text}`} onClick={() => void action(() => setDocumentBlockAction(project.id, block.id, 'READ'), 'Block will be read.')}>Read</button><button type="button" disabled={busy} aria-label={`Use automatic policy for ${block.original_text}`} onClick={() => void action(() => setDocumentBlockAction(project.id, block.id, 'DEFAULT'), 'Block returned to automatic policy.')}>Default</button></p>)}</div>}</section>}"""
          replace_once(old, new)

          path.write_text(text, encoding="utf-8")

          test_path = Path("src/apps/web/src/features/audiobook/AudiobookWorkspace.test.tsx")
          test = test_path.read_text(encoding="utf-8")
          insert = r'''
            it('changes reading mode and can override a skipped structural block', async () => {
              const fetchMock = vi.fn(async (input: RequestInfo | URL, init?: RequestInit) => {
                const url = String(input);
                if (url.endsWith('/projects/book-one/reading-policy') && init?.method === 'PATCH') {
                  return new Response(JSON.stringify({ project_id: 'book-one', audiobook_mode: 'story_only' }),
                    { status: 200, headers: { 'content-type': 'application/json' } });
                }
                if (url.endsWith('/projects/book-one/document-overrides') && init?.method === 'POST') {
                  return new Response(JSON.stringify({ id: 'override-one', scope: 'BLOCK', scope_key: 'block-page', action: 'READ' }),
                    { status: 200, headers: { 'content-type': 'application/json' } });
                }
                let body: unknown;
                if (url.endsWith('/projects')) body = { projects: [project] };
                else if (url.endsWith('/voices')) body = { voices: [] };
                else if (url.endsWith('/models/current')) body = { model_revision: 'sha256:test-model' };
                else if (url.endsWith('/projects/book-one/exports')) body = { exports: [] };
                else if (url.endsWith('/projects/book-one')) body = {
                  ...project, audiobook_mode: 'standard',
                  chapters: [{ id: 'chapter-one', ordinal: 0, title: 'Opening', character_count: 24 }],
                  review_issues: [], speakers: [], render_jobs: [], preview_jobs: [], export_jobs: [],
                  render_progress: { completed: 0, total: 1 },
                };
                else if (url.endsWith('/projects/book-one/chapters/chapter-one')) body = {
                  id: 'chapter-one', ordinal: 0, title: 'Opening', canonical_text: 'Page 1 of 3\nStory.',
                  spans: [{ id: 'span-one', source_text: 'Page 1 of 3\nStory.', structural_kind: 'narration',
                    annotation: null, speech_plan: { tts_input_text: 'Story.', hash: 'plan', transformations: [] } }],
                  document_blocks: [{
                    id: 'block-page', original_text: 'Page 1 of 3', effective_role: 'page_number',
                    confidence: 0.995, render_action: 'SKIP', speaker_analysis_visibility: 'EXCLUDE',
                    provenance: [{ source: 'pattern', signal: 'page_number', value: 'Page 1 of 3' }],
                  }],
                };
                else throw new Error(`unexpected API request ${url}`);
                return new Response(JSON.stringify(body), { status: 200,
                  headers: { 'content-type': 'application/json' } });
              });
              vi.stubGlobal('fetch', fetchMock);
              renderWorkspace();
              fireEvent.click(await screen.findByRole('button', { name: /The Book/i }));
              fireEvent.click(await screen.findByRole('button', { name: 'Edit project' }));
              const mode = await screen.findByLabelText('Audiobook reading mode');
              expect(mode).toHaveValue('standard');
              fireEvent.change(mode, { target: { value: 'story_only' } });
              await waitFor(() => expect(fetchMock).toHaveBeenCalledWith(
                '/api/audiobook/projects/book-one/reading-policy',
                expect.objectContaining({ method: 'PATCH', body: JSON.stringify({ mode: 'story_only' }) }),
              ));

              fireEvent.click(screen.getAllByRole('button', { name: /Chapters/ }).at(-1)!);
              expect(await screen.findByLabelText('Skipped audiobook content')).toBeInTheDocument();
              fireEvent.click(screen.getByRole('button', { name: 'Read skipped block Page 1 of 3' }));
              await waitFor(() => expect(fetchMock).toHaveBeenCalledWith(
                '/api/audiobook/projects/book-one/document-overrides',
                expect.objectContaining({
                  method: 'POST',
                  body: JSON.stringify({
                    scope: 'BLOCK', scope_key: 'block-page', action: 'READ', role_override: null,
                  }),
                }),
              ));
            });

          '''
          marker = "  it('shows detected speaker candidates and lets the operator confirm one', async () => {"
          if marker not in test:
              raise SystemExit("missing audiobook test insertion marker")
          test = test.replace(marker, insert + marker, 1)
          test_path.write_text(test, encoding="utf-8")
          PY
      - name: Install web dependencies
        run: npm ci
      - name: Test audiobook workspace
        run: npm run web:test -- src/features/audiobook/AudiobookWorkspace.test.tsx
      - name: Typecheck web workspace
        run: npm --workspace @omnix/web run typecheck
      - name: Commit patch and self-remove
        shell: bash
        run: |
          git rm .github/workflows/audiobook-reading-policy-ui-once.yml
          git add src/apps/web/src/features/audiobook/AudiobookWorkspace.tsx src/apps/web/src/features/audiobook/AudiobookWorkspace.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audiobook: expose reading policy controls"
          git fetch origin agent/audiobook-v1
          git rebase origin/agent/audiobook-v1
          git push origin HEAD:agent/audiobook-v1
