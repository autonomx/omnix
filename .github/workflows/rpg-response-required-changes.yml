name: Apply RPG response required changes

on:
  push:
    branches:
      - agent/rpg-response-generation-0-10

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Install RPG response required changes patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rpg-response-generation-0-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply production integration patch
        run: python scripts/apply_rpg_response_required_changes.py

      - name: Verify new modules compile
        run: |
          python -m py_compile \
            src/app/rpg/response_generation/production_pipeline.py \
            src/app/rpg/response_generation/runtime_bridge.py \
            src/app/rpg/response_generation/orchestration.py \
            src/app/rpg/response_generation/profiled_generator.py \
            src/app/rpg/response_generation/legacy_bridge.py \
            src/tests/rpg/response_generation/test_required_changes_integration.py

      - name: Commit integrated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix RPG response generation production integration'
          git push origin HEAD:agent/rpg-response-generation-0-10
