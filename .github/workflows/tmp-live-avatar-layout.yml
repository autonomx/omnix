name: Temporary live avatar layout patch

on:
  push:
    branches:
      - tmp-live-avatar-phases

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-live-avatar-phases
          fetch-depth: 0
      - name: Apply live avatar layout patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode('''  '''))
          PY
      - name: Commit product changes
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Place live avatar in voice stage and expand transcript"
          git push origin HEAD:tmp-live-avatar-phases
