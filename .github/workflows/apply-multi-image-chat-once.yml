name: Apply multi-image chat once

on:
  push:
    branches: ["agent/coding-quality-phases-20-31"]
    paths:
      - ".github/workflows/apply-multi-image-chat-once.yml"
      - "scripts/apply_multi_image_chat_once.py"
      - "scripts/prepare_multi_image_chat_once.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-multi-image-chat-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coding-quality-phases-20-31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Prepare asserted carrier
        run: |
          python -m py_compile scripts/prepare_multi_image_chat_once.py scripts/apply_multi_image_chat_once.py
          python scripts/prepare_multi_image_chat_once.py
          python -m py_compile scripts/apply_multi_image_chat_once.py
      - name: Apply multi-image patch
        run: python scripts/apply_multi_image_chat_once.py
      - name: Compile affected Python
        run: python -m compileall -q src/app/chat src/app/assistant_context src/app/agent_runtime src/app/gateway src/tests/unit/chat/test_chat_images.py
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Run backend image tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest src/tests/unit/chat/test_chat_images.py -q --tb=short
          python -m pytest src/tests/agent_runtime/test_chat_bridge.py -q --tb=short
      - name: Regenerate API and validate web
        run: |
          npm --workspace @omnix/web run api:generate
          npm --workspace @omnix/web run typecheck
          npm --workspace @omnix/web test -- src/features/chatbot/ChatbotWorkspace.test.tsx
      - name: Commit production result and self-remove carrier
        shell: bash
        run: |
          git rm -f scripts/apply_multi_image_chat_once.py scripts/prepare_multi_image_chat_once.py .github/workflows/apply-multi-image-chat-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(chat): support multiple image attachments"
          git push origin HEAD:agent/coding-quality-phases-20-31
