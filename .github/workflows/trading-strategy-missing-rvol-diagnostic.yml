name: Trading strategy missing RVOL diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/trading-strategy-missing-rvol-diagnostic.yml"
      - "scripts/run_trading_strategy_missing_rvol_diagnostic.py"

permissions:
  contents: read

jobs:
  missing-rvol-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore immutable trading datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v1-${{ runner.os }}-missing-rvol-${{ github.run_id }}
          restore-keys: |
            trading-liquidity-datasets-v1-${{ runner.os }}-

      - name: Verify complete cached dataset
        shell: bash
        run: |
          count="$(find .cache/trading-liquidity-datasets -type f -name 'session-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Frozen session datasets: ${count}"
          if [[ "${count}" -lt 10 ]]; then
            echo "::error::Expected the 10 fingerprint-verified Aug 8-21 session datasets; refusing to call Alpaca from this cache-only diagnostic."
            exit 2
          fi

      - name: Run missing-RVOL fallback diagnostic
        shell: bash
        run: |
          python scripts/run_trading_strategy_missing_rvol_diagnostic.py \
            --lookback-days 14 \
            --initial-cash 100000 \
            --assumed-spread-bps 40 \
            --max-hold-minutes 90 \
            --reconstruction-max-age-days 30 \
            --max-sessions 60 \
            --thresholds "250000,500000,1000000,2000000,5000000,10000000" \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/missing-rvol-diagnostic \
            --require-covered-session

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/missing-rvol-diagnostic/summary.md ]]; then
            cat artifacts/missing-rvol-diagnostic/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f artifacts/missing-rvol-diagnostic/diagnostic-policy.md ]]; then
            cat artifacts/missing-rvol-diagnostic/diagnostic-policy.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-missing-rvol-diagnostic
          path: artifacts/missing-rvol-diagnostic
          if-no-files-found: warn
          retention-days: 30
