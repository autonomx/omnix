name: Temporary TaskGraph API contract generator

on:
  push:
    branches: ["agent/taskgraph-phases-15-19"]
    paths:
      - ".github/workflows/taskgraph-api-generate.yml"

permissions:
  contents: write

jobs:
  generate-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taskgraph-phases-15-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Generate gateway API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated contract
        shell: bash
        run: |
          if git diff --quiet -- src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts; then
            echo "Generated API contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          git commit -m "chore(api): regenerate gateway contract"
          git push origin HEAD:agent/taskgraph-phases-15-19
