name: Direct routing typecheck fix
on:
  push:
    branches: [agent/general-full-duplex-live]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Complete direct routing TypeScript migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-full-duplex-live
      - name: Complete TypeScript migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Store task acknowledgement as authoritative context state.
          replace('apps/web/src/features/assistant-workspace/live-conversation-store.ts',
            "  | { type: 'task_contract'; contract: LiveTaskContract }\n  | { type: 'material_ack'; acceptedSequence: number; contextVersion: number }",
            "  | { type: 'task_contract'; contract: LiveTaskContract }\n  | { type: 'task_contract_ack'; contextVersion: number; taskContractId: string; taskContractVersion: number }\n  | { type: 'material_ack'; acceptedSequence: number; contextVersion: number }")
          replace('apps/web/src/features/assistant-workspace/live-conversation-store.ts',
            "    case 'material_ack':\n      return {",
            "    case 'task_contract_ack':\n      return {\n        ...state,\n        coordination: {\n          ...state.coordination,\n          contextVersion: Math.max(state.coordination.contextVersion, action.contextVersion),\n          lastAction: 'task_contract_acknowledged',\n        },\n      };\n    case 'material_ack':\n      return {")

          # Vite env typing without global augmentation dependency.
          replace('apps/web/src/features/assistant-workspace/live-runtime-provenance.ts',
            "  const env = import.meta.env as Record<string, string | undefined>;",
            "  const env = (import.meta as ImportMeta & { env?: Record<string, string | undefined> }).env ?? {};")

          # Deterministic evaluation material client supports task acknowledgement.
          p = Path('apps/web/src/features/assistant-workspace/live-full-duplex-evaluation.test.ts')
          text = p.read_text(encoding='utf-8')
          marker = "  async append(sessionId: string, request: LiveMaterialAppendRequest): Promise<LiveMaterialAcknowledgement> {"
          method = """  async acknowledgeTaskContract(sessionId: string, request: { task_contract_id: string; task_contract_version: number }) {\n    return { session_id: sessionId, task_contract_id: request.task_contract_id, task_contract_version: request.task_contract_version, context_version: this.contextVersion, idempotent: true };\n  }\n\n"""
          if method not in text: text = text.replace(marker, method + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Coordinator tests use the new typed dependencies and state observer.
          p = Path('apps/web/src/features/assistant-workspace/live-session-coordinator.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import { LiveSegmentSubmitInterceptor } from './live-segment-submit-interceptor';", "import { LiveSegmentStateObserver } from './live-segment-submit-interceptor';")
          text = text.replace('  LIVE_COORDINATION_SUBMIT_EVENT,\n', '')
          text = text.replace('      materialClient: { append },\n      now:', "      materialClient: { append, acknowledgeTaskContract: vi.fn() },\n      chatGateway: { submit: vi.fn() },\n      now:")
          text = text.replace('      materialClient: { append: vi.fn() },\n      now:', "      materialClient: { append: vi.fn(), acknowledgeTaskContract: vi.fn() },\n      chatGateway: { submit: vi.fn() },\n      now:")
          text = text.replace("    expect(events.some((event) => event.type === LIVE_COORDINATION_SUBMIT_EVENT)).toBe(false);", "    expect(events.some((event) => event.type === 'live-chat-gateway-submit')).toBe(false);")
          old = """    const coordinator = new LiveSessionCoordinator({\n      store,\n      materialClient: { append: vi.fn(), acknowledgeTaskContract: vi.fn() },\n      chatGateway: { submit: vi.fn() },\n      now: () => 100,\n      dispatchEvent: (event) => { events.push(event); return true; },\n    });\n\n    await coordinator.coordinate({ text: 'Maya, stop.', segmentId: 's0', sourceSequence: 0, assistantSpeaking: true });"""
          new = """    const submit = vi.fn(async () => undefined);\n    const coordinator = new LiveSessionCoordinator({\n      store,\n      materialClient: { append: vi.fn(), acknowledgeTaskContract: vi.fn() },\n      chatGateway: { submit },\n      now: () => 100,\n      dispatchEvent: (event) => { events.push(event); return true; },\n    });\n\n    await coordinator.coordinate({ text: 'Maya, stop.', segmentId: 's0', sourceSequence: 0, assistantSpeaking: true });"""
          text = text.replace(old, new)
          text = text.replace("    expect(events.filter((event) => event.type === LIVE_COORDINATION_SUBMIT_EVENT)).toHaveLength(1);", "    expect(submit).toHaveBeenCalledTimes(1);")
          start = text.find("describe('LiveSegmentSubmitInterceptor'")
          if start >= 0:
              text = text[:start] + """describe('LiveSegmentStateObserver', () => {\n  it('observes protocol state without owning submission behavior', () => {\n    const observer = new LiveSegmentStateObserver();\n    observer.observePerformanceEvent({ stage: 'stt_segment_state', protocol: 'segmented-v1' });\n    expect(observer.protocol).toBe('segmented-v1');\n    observer.reset();\n    expect(observer.protocol).toBe('legacy');\n  });\n});\n"""
          p.write_text(text, encoding='utf-8')

          # Obsolete DOM enhancer compiles against structured finals. It remains uninitialized.
          p = Path('apps/web/src/features/assistant-workspace/live-voice-websocket-enhancer.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("      onFinalTranscript: (text) => handleFinalTranscript(card, text),", "      onAcceptedFinal: async (final) => {\n        handleFinalTranscript(card, final.text);\n        return { outcome: 'conversation_submitted', segmentId: final.segmentId, sourceSequence: final.sourceSequence, taskContractId: 'legacy-enhancer', taskContractVersion: 1 };\n      },")
          p.write_text(text, encoding='utf-8')

          # Websocket test supplies structured result identity and awaits routing drain.
          p = Path('apps/web/src/features/assistant-workspace/live-voice-websocket.spec.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("      onFinalTranscript: (text) => finals.push(text),", "      onAcceptedFinal: async (final) => { finals.push(final.text); return { outcome: 'ignored', segmentId: final.segmentId, sourceSequence: final.sourceSequence, taskContractId: 'test', taskContractVersion: 1 }; },")
          text = text.replace("type: 'result_available', segmentId: 's1', sequence: 1, resultId: 'r1', text: 'brown fox jumps'", "type: 'result_available', sessionId: 'stt-session', captureEpoch: client.segmentState.captureEpoch, segmentId: 's1', sequence: 1, resultId: 'r1', finalizeRequestId: 'f1', startSample: 2, endSample: 4, text: 'brown fox jumps'")
          text = text.replace("type: 'result_available', segmentId: 's0', sequence: 0, resultId: 'r0', text: 'the brown fox'", "type: 'result_available', sessionId: 'stt-session', captureEpoch: client.segmentState.captureEpoch, segmentId: 's0', sequence: 0, resultId: 'r0', finalizeRequestId: 'f0', startSample: 0, endSample: 2, text: 'the brown fox'")
          text = text.replace("    expect(finals).toEqual(['the brown fox', 'jumps']);", "    await vi.waitFor(() => expect(finals).toEqual(['the brown fox', 'jumps']));")
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-conversation-store.ts apps/web/src/features/assistant-workspace/live-runtime-provenance.ts apps/web/src/features/assistant-workspace/live-full-duplex-evaluation.test.ts apps/web/src/features/assistant-workspace/live-session-coordinator.test.ts apps/web/src/features/assistant-workspace/live-voice-websocket-enhancer.ts apps/web/src/features/assistant-workspace/live-voice-websocket.spec.ts
          git commit -m 'Complete direct routing TypeScript migration'
          git push origin HEAD:agent/general-full-duplex-live
