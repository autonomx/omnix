name: Live voice latency

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/platform/chat/**"
      - "src/app/conversation/**"
      - "src/app/platform/live_voice/**"
      - "src/app/providers/**"
      - "web/src/features/assistant/workspace/**"
      - "src/tests/app/test_live_chat_*.py"
      - "src/tests/app/test_live_voice_*.py"
      - "src/tests/app/test_tts_stream_contract*.py"
      - "src/tests/e2e/test_live_voice_api.py"
      - ".github/workflows/live-voice-latency.yml"
  push:
    branches: [main]
    paths:
      - "src/app/platform/chat/**"
      - "src/app/conversation/**"
      - "src/app/platform/live_voice/**"
      - "src/app/providers/**"
      - "web/src/features/assistant/workspace/**"
      - "src/tests/app/test_live_chat_*.py"
      - "src/tests/app/test_live_voice_*.py"
      - "src/tests/app/test_tts_stream_contract*.py"
      - "src/tests/e2e/test_live_voice_api.py"
      - ".github/workflows/live-voice-latency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-voice-latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMNIX_ALLOWED_HOSTS: testserver
      OMNIX_ALLOWED_ORIGINS: http://testserver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
          npm ci
      - name: Import live voice entry points
        run: |
          python -c "from app.platform.live_voice.hardware_policy import apply_live_voice_process_defaults; from app.composition.launcher.runtime_control_app import app, build_runtime_service_specs; from app.providers.live_stt_contracts import LiveSttNegotiation; from app.providers.nemotron_eou_live_websocket import PROVIDER_NAME; from app.platform.chat.live_chat_speculation import LiveSpeculationRequest; from app.conversation.tts_stream_contract import TtsStreamRequest"

      - name: Lint focused live voice modules
        run: |
          ruff check \
            src/app/platform/live_voice/hardware_policy.py \
            src/app/composition/launcher/runtime_control_app.py \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/nemotron_eou_live_websocket.py \
            src/app/providers/nemotron_eou_quality.py \
            src/app/providers/stt_live_websocket.py \
            src/app/platform/live_voice/llm/lmstudio_responses.py \
            src/app/platform/chat/live_chat_speculation.py \
            src/app/platform/live_voice/speech/tts_lane.py \
            src/app/platform/live_voice/speech/speculative_tts.py \
            src/app/platform/live_voice/prompt/spoken_style.py \
            src/app/platform/live_voice/llm/lmstudio_model_resolution.py \
            src/app/platform/live_voice/speech/startup_frame_policy.py \
            src/app/platform/live_voice/transport/websocket.py \
            src/app/conversation/tts_stream_contract.py \
            src/services/stt/nemotron_eou_stt_server.py \
            src/tests/app/test_runtime_launcher_services.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/live_voice/test_live_voice_hardware_policy.py \
            src/tests/app/test_live_chat_lmstudio_responses.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/live_voice/test_live_voice_speculative_tts.py \
            src/tests/app/test_live_voice_spoken_style.py \
            src/tests/app/test_lmstudio_loaded_model_resolution.py \
            src/tests/app/test_tts_live_call_startup_frame_policy.py \
            src/tests/app/test_tts_stream_contract_performance.py
          # The NeMo streaming import is deliberately lazy inside the stream
          # constructor. Keep all other Ruff checks active for that module.
          ruff check --ignore I001 src/app/providers/nemotron_eou_streaming.py
          # The vendored Qwen file retains its upstream shebang and legacy typing
          # style. Gate all substantive rules while preserving those baselines.
          ruff check --ignore EXE001,UP035,UP006 src/app/providers/vendor/faster_qwen3_tts/streaming.py
          # The API-only benchmark imports this conftest at collection time, so
          # keep its browser-parity orchestration under the focused static gate.
          ruff check src/tests/e2e/conftest.py
          # E2E transport guards intentionally translate malformed wire payloads
          # to RuntimeError and use best-effort cleanup. Keep every other rule,
          # including parser/import/name checks, active on the API harness.
          ruff check --ignore TRY004,S110,BLE001 src/tests/e2e/test_live_voice_api.py

      - name: Run focused Python tests
        run: >-
          python -m pytest
          src/tests/app/test_runtime_launcher_services.py
          src/tests/app/test_live_stt_contracts.py
          src/tests/live_voice/test_live_voice_hardware_policy.py
          src/tests/app/test_live_chat_lmstudio_responses.py
          src/tests/app/test_live_chat_speculation.py
          src/tests/live_voice/test_live_voice_speculative_tts.py
          src/tests/app/test_live_voice_spoken_style.py
          src/tests/app/test_lmstudio_loaded_model_resolution.py
          src/tests/app/test_tts_live_call_startup_frame_policy.py
          src/tests/app/test_tts_stream_contract_performance.py
          -q --tb=short

      - name: Typecheck live voice browser path
        run: npm --workspace @omnix/web run typecheck
