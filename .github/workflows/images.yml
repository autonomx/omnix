name: Omnix images

# WP-11.1: build every image, scan it, record its SBOM and smoke-test the
# gateway image against PostgreSQL. Release tags (vX.Y.Z) also push the
# images to GHCR tagged with the version (WP-11.5).
on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "deploy/docker/**"
      - ".dockerignore"
      - "requirements/*.lock.txt"
      - "src/services/**/*.lock.txt"
      - "docker-compose.yml"

permissions:
  contents: read

concurrency:
  group: omnix-images-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  image:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, web, tts, stt, image]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA images
        if: contains(fromJSON('["tts", "stt", "image"]'), matrix.image)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$version+${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          docker build -f deploy/docker/${{ matrix.image }}.Dockerfile \
            --build-arg OMNIX_SOFTWARE_REVISION=${{ steps.version.outputs.revision }} \
            --build-arg VITE_GIT_SHA=${GITHUB_SHA} \
            -t omnix-${{ matrix.image }}:ci .
          docker image ls omnix-${{ matrix.image }}:ci
      - name: Gateway image is under 500 MB compressed and runs as non-root
        if: matrix.image == 'gateway'
        run: |
          bytes=$(docker save omnix-gateway:ci | gzip -1 | wc -c)
          echo "compressed bytes: $bytes"
          test "$bytes" -lt $((500 * 1024 * 1024))
          test "$(docker run --rm omnix-gateway:ci id -u)" = "10001"
      - name: Ingress checks (nginx -t, security headers, body and rate limits)
        if: matrix.image == 'web'
        run: |
          python -m pip install --quiet httpx
          python scripts/check_web_image.py omnix-web:ci
      - name: Scan (fail on fixable critical vulnerabilities)
        run: |
          mkdir -p artifacts
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts:/out" "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 omnix-${{ matrix.image }}:ci
      - name: SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts:/out" "$TRIVY_IMAGE" \
            image --format cyclonedx --output /out/omnix-${{ matrix.image }}.cdx.json omnix-${{ matrix.image }}:ci
      - name: Smoke-test the gateway against PostgreSQL
        if: matrix.image == 'gateway'
        run: |
          docker network create omnix-smoke
          docker run -d --name pg --network omnix-smoke -e POSTGRES_USER=omnix -e POSTGRES_PASSWORD=smoke-only \
            -e POSTGRES_DB=omnix postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U omnix -d omnix && break; sleep 2; done
          common="--network omnix-smoke --read-only --tmpfs /tmp --tmpfs /var/lib/omnix:uid=10001,gid=10001
            -e OMNIX_DATABASE_URL=postgresql://omnix:smoke-only@pg:5432/omnix -e OMNIX_SECRET_STORE=env
            -e OMNIX_SERVICE_TOKEN=ci-smoke-service-token-not-a-secret-0123456789"
          docker run --rm $common omnix-gateway:ci python -m app.persistence migrate
          docker run -d --name gw $common -e OMNIX_ENV=test -e OMNIX_BIND_HOST=0.0.0.0 -e OMNIX_ALLOW_LAN=true \
            -e OMNIX_ALLOWED_HOSTS=127.0.0.1,127.0.0.1:8000 -e OMNIX_LOCAL_JOB_WORKER=0 omnix-gateway:ci
          for i in $(seq 1 60); do
            docker exec gw python scripts/container_healthcheck.py http://127.0.0.1:8000/ready && exit 0
            sleep 2
          done
          docker logs gw | tail -100
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ matrix.image }}
          path: artifacts/omnix-${{ matrix.image }}.cdx.json
          if-no-files-found: ignore
      - name: Push the release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          target=ghcr.io/${{ github.repository_owner }}/omnix-${{ matrix.image }}
          for tag in ${{ steps.version.outputs.version }} ${GITHUB_SHA::12}; do
            docker tag omnix-${{ matrix.image }}:ci "$target:$tag"
            docker push "$target:$tag"
          done
