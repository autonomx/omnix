      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck live voice integration
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee /tmp/live-voice-remediation-typecheck.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "live-(voice-controller|stt-authority-controller|latency-rollout\\.spec)\\.ts" /tmp/live-voice-remediation-typecheck.txt; then
            exit "${status:-1}"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside the remediated files."
          fi

      - name: Run focused browser tests
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts

      - name: Commit source and remove temporary workflow
        run: |
          rm .github/workflows/apply-live-voice-log-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/assistant-workspace/live-voice-controller.ts \
            apps/web/src/features/assistant-workspace/live-latency-rollout.spec.ts \
            .github/workflows/apply-live-voice-log-remediation.yml
          git commit -m "Wire Kyutai authority into active live voice capture"
          git push origin HEAD:${{ github.head_ref }}
