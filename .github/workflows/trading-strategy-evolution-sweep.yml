name: Trading strategy evolution sweep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: 1
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore frozen datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v1-${{ runner.os }}-v11-unseen-${{ github.run_id }}
          restore-keys: |
            trading-liquidity-datasets-v1-${{ runner.os }}-extended-
            trading-liquidity-datasets-v1-${{ runner.os }}-

      - name: Verify frozen cache
        shell: bash
        run: |
          count="$(find .cache/trading-liquidity-datasets -type f -name 'session-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Frozen session datasets available: ${count}"
          if [[ "${count}" -lt 76 ]]; then
            echo "::error::Expected 76 cached sessions including sealed April/May validation block."
            exit 2
          fi

      - name: Run frozen V11 unseen validation
        shell: bash
        run: |
          python scripts/validate_trading_strategy_failed_selloff_v11_unseen.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/failed-selloff-v11-unseen \
            --initial-cash 100000 \
            --assumed-spread-bps 40

      - name: Publish V11 unseen summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/failed-selloff-v11-unseen/summary.md ]]; then
            cat artifacts/failed-selloff-v11-unseen/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload V11 unseen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-strategy-failed-selloff-v11-unseen
          path: artifacts/failed-selloff-v11-unseen
          if-no-files-found: warn
          retention-days: 30
