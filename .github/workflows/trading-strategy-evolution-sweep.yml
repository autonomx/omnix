name: Trading strategy evolution sweep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: 1
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore revealed development datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v1-${{ runner.os }}-v10-signal-features-${{ github.run_id }}
          restore-keys: |
            trading-liquidity-datasets-v1-${{ runner.os }}-extended-
            trading-liquidity-datasets-v1-${{ runner.os }}-

      - name: Verify revealed development cache
        shell: bash
        run: |
          count="$(find .cache/trading-liquidity-datasets -type f -name 'session-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Frozen session datasets available: ${count}"
          if [[ "${count}" -lt 58 ]]; then
            echo "::error::Expected at least 58 revealed development sessions; this workflow is cache-only."
            exit 2
          fi

      - name: Diagnose V10 causal signal features
        shell: bash
        run: |
          python scripts/diagnose_trading_strategy_v10_signal_features.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v10-signal-features \
            --initial-cash 100000 \
            --assumed-spread-bps 40

      - name: Publish V10 feature summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/v10-signal-features/summary.md ]]; then
            cat artifacts/v10-signal-features/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload V10 feature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-strategy-v10-signal-features
          path: artifacts/v10-signal-features
          if-no-files-found: warn
          retention-days: 30
