name: Trading strategy evolution sweep

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/trading-strategy-evolution-sweep.yml"
      - "scripts/validate_trading_strategy_failed_selloff_v4_unseen.py"

permissions:
  contents: read

jobs:
  strategy-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore fresh immutable validation dataset
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v1-${{ runner.os }}-v4-unseen-${{ github.run_id }}
          restore-keys: |
            trading-liquidity-datasets-v1-${{ runner.os }}-extended-
            trading-liquidity-datasets-v1-${{ runner.os }}-

      - name: Verify untouched validation cache
        shell: bash
        run: |
          count="$(find .cache/trading-liquidity-datasets -type f -name 'session-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Frozen session datasets: ${count}"
          if [[ "${count}" -lt 40 ]]; then
            echo "::error::Expected the 40-session cache including 19 untouched June/July sessions; refusing to call Alpaca."
            exit 2
          fi

      - name: Validate frozen V4 on untouched June/July sessions
        shell: bash
        run: |
          python scripts/validate_trading_strategy_failed_selloff_v4_unseen.py \
            --start-date 2026-06-26 \
            --end-date 2026-07-23 \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/failed-selloff-v4-unseen \
            --initial-cash 100000 \
            --assumed-spread-bps 40

      - name: Publish V4 untouched summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/failed-selloff-v4-unseen/summary.md ]]; then
            cat artifacts/failed-selloff-v4-unseen/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload V4 untouched evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-strategy-failed-selloff-v4-unseen
          path: artifacts/failed-selloff-v4-unseen
          if-no-files-found: warn
          retention-days: 30
