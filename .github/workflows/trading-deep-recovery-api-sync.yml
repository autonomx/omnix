name: Trading deep recovery API sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-deep-recovery-api-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install generator dependencies
        run: |
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install

      - name: Generate shared gateway API contract
        env:
          PYTHONPATH: src
          OMNIX_PERSISTENCE_MODE: legacy_test
          OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
        run: npm --workspace @omnix/web run api:generate

      - name: Commit generated contract and retire workflow
        run: |
          rm .github/workflows/trading-deep-recovery-api-sync.yml
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts .github/workflows/trading-deep-recovery-api-sync.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated delta to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "api: sync deep-recovery operations contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
