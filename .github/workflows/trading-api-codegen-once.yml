name: Trading API codegen one-shot

on:
  push:
    branches:
      - agent/implement-omnix-trading-terminal
    paths:
      - .github/workflows/trading-api-codegen-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install contract generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Regenerate shared gateway contracts
        run: npm --workspace @omnix/web run api:generate
      - name: Commit exact generated contracts
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/api/generated/openapi.json apps/web/src/api/generated/types.ts; then
            echo "Generated contracts already match the repository."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/generated/openapi.json apps/web/src/api/generated/types.ts
          git commit -m "Regenerate Trading API contracts"
          git push origin HEAD:agent/implement-omnix-trading-terminal
