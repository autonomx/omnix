name: Trading Phase 6 contract sync

on:
  push:
    branches: [agent/trading-nextgen-roadmap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-nextgen-roadmap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install contract generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Verify branch has not moved
        run: |
          git fetch origin agent/trading-nextgen-roadmap
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/trading-nextgen-roadmap)"
      - name: Generate shared gateway API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated contract if changed
        run: |
          if git diff --quiet -- src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts; then
            echo "Generated API contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          git commit -m "chore(trading): sync phase6 API contract"
          git push origin HEAD:agent/trading-nextgen-roadmap
