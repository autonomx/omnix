name: MEM-11 one-time prompt patch

on:
  push:
    branches:
      - tmp-mem11-fts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mem11-fts
          fetch-depth: 0
      - run: python scripts/mem11_prompt_patch.py
      - run: rm scripts/mem11_prompt_patch.py .github/workflows/mem11-prompt-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEM-11 integrate FTS history recall"
          git push origin HEAD:tmp-mem11-fts
