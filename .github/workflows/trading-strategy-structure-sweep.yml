name: Trading strategy structure diagnostic

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD); blank uses lookback"
        required: false
        default: ""
        type: string
      end_date:
        description: "End date (YYYY-MM-DD); blank uses yesterday ET"
        required: false
        default: ""
        type: string
      lookback_days:
        description: "Calendar-day lookback when start date is blank"
        required: false
        default: "14"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/trading-strategy-structure-sweep.yml"
      - "scripts/run_trading_strategy_structure_sweep.py"

permissions:
  contents: read

jobs:
  structure-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
      START_DATE: ${{ github.event.inputs.start_date || '' }}
      END_DATE: ${{ github.event.inputs.end_date || '' }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Alpaca historical-data credentials
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Repository Actions secrets OMNIX_ALPACA_API_KEY_ID and OMNIX_ALPACA_API_SECRET_KEY are required."
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Run strict v1.1 structure diagnostic
        shell: bash
        run: |
          args=(
            --lookback-days "${LOOKBACK_DAYS}"
            --initial-cash 100000
            --assumed-spread-bps 40
            --max-hold-minutes 90
            --reconstruction-max-age-days 30
            --max-sessions 60
            --thresholds "250000,500000,1000000,2000000,5000000,10000000"
            --output-dir artifacts/structure-sweep
            --require-covered-session
          )
          if [[ -n "${START_DATE}" ]]; then
            args+=(--start-date "${START_DATE}")
          fi
          if [[ -n "${END_DATE}" ]]; then
            args+=(--end-date "${END_DATE}")
          fi
          python scripts/run_trading_strategy_structure_sweep.py "${args[@]}"

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/structure-sweep/summary.md ]]; then
            cat artifacts/structure-sweep/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "# Trading structure diagnostic" >> "${GITHUB_STEP_SUMMARY}"
            echo "Diagnostic result files were not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-structure-diagnostic
          path: artifacts/structure-sweep
          if-no-files-found: warn
          retention-days: 30
