name: Architecture runtime gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-unit:
    name: architecture-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install architecture test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             pytest fastapi uvicorn httpx pydantic requests python-multipart pillow playwright numpy psutil             "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Run architecture unit gate
        run: python scripts/run_architecture_gates.py --group unit
      - name: Verify production ingress is generated from shared policy
        run: python scripts/render_gateway_ingress.py --check
      - name: Measure provider-free gateway responsiveness
        run: |
          python scripts/benchmark_gateway_baseline.py             --samples 30             --output artifacts/gateway-baseline.json
          python scripts/check_architecture_benchmark.py             --baseline resources/benchmarks/gateway/refactor-baseline.json             --measured artifacts/gateway-baseline.json
      - name: Upload architecture benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-gateway-benchmark
          path: artifacts/gateway-baseline.json
          if-no-files-found: ignore

  architecture-durable:
    name: architecture-durable (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [postgresql, multiprocess]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install durable runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             pytest fastapi uvicorn httpx pydantic requests python-multipart pillow playwright numpy psutil             "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Run durable architecture gate
        run: python scripts/run_architecture_gates.py --group ${{ matrix.group }}

  architecture-web:
    name: architecture-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install web dependencies
        run: npm ci
      - name: Install OpenAPI export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             fastapi pydantic requests python-multipart pillow numpy             "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Typecheck
        run: npm run web:typecheck
      - name: Verify generated API contract
        run: npm --workspace @omnix/web run api:check
      - name: Run architecture-sensitive web tests
        run: >
          npm run web:test --
          src/test/gateway-routing.test.ts
          src/features/chatbot
          src/features/audiobook/AudiobookWorkspace.test.tsx
          src/features/trading