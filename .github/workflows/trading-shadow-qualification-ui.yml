name: Trading shadow qualification UI cleanup

on:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - scripts/patch_trading_shadow_qualification_ui.py
      - .github/workflows/trading-shadow-qualification-ui.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply guarded UI/E2E cleanup
        run: python scripts/patch_trading_shadow_qualification_ui.py

      - name: Install web dependencies
        run: npm install

      - name: Run Trading frontend and typecheck
        run: |
          npm --workspace @omnix/web run test:trading
          npm --workspace @omnix/web run typecheck:trading

      - name: Run Trading Chromium smoke
        run: |
          npx playwright install chromium
          npm --workspace @omnix/web run test:e2e:trading
          git diff --check

      - name: Commit qualified cleanup
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/web/tests/e2e/trading-terminal.spec.ts src/apps/web/src/features/trading/TradingStrategiesPanel.tsx
          git commit -m "test(trading): align alert smoke with active chart"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Report success
        if: success()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "Trading shadow qualification UI/E2E cleanup passed frontend, TypeScript and Chromium smoke and pushed \`${{ steps.commit.outputs.sha }}\`. The BTC alert smoke now explicitly reactivates Chart 1 and expects overlays only on the two BTC charts; the V2 SHADOW notice records the negative older stress result."

      - name: Report failure
        if: failure()
        run: |
          gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "Trading shadow qualification UI/E2E cleanup failed on source head \`${GITHUB_SHA}\`. No cleanup commit from this run should be trusted; inspect the workflow before continuing."
