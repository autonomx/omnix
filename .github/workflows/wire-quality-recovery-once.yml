name: Wire quality recovery once

on:
  push:
    branches:
      - agent/coding-quality-phases-20-31
    paths:
      - .github/workflows/wire-quality-recovery-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coding-quality-phases-20-31
          fetch-depth: 0
      - name: Wire durable quality reconciliation into service supervisor
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/agent_runtime/service.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from .repository_guidance import compile_repository_guidance\n"
          import_line = "from .quality_recovery import reconcile_orphaned_quality_reviews\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("service import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          class_anchor = '''    @staticmethod\n    def _quality_enabled(spec: AgentRunSpec) -> bool:\n        return (\n            spec.profile == "coding"\n            and "diff" in spec.expected_artifacts\n            and spec.quality_policy != "off"\n        )\n'''
          supervisor_method = '''\n    def _supervise_once(self) -> None:\n        # Reconcile durable review-stage parents first. A recovered repair is\n        # changed back to runnable and its stale lease is removed, allowing the\n        # Phase 1-19 generic orphan recovery below to restart Pi immediately in\n        # this same supervisor pass.\n        reconcile_orphaned_quality_reviews(self)\n        super()._supervise_once()\n'''
          if "reconcile_orphaned_quality_reviews(self)" not in text:
              if class_anchor not in text:
                  raise SystemExit("quality-enabled class anchor not found")
              text = text.replace(class_anchor, class_anchor + supervisor_method, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit service wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/agent_runtime/service.py
          git rm .github/workflows/wire-quality-recovery-once.yml
          git diff --cached --check
          git commit -m "feat: recover orphaned coding review stages"
          git push origin HEAD:agent/coding-quality-phases-20-31
