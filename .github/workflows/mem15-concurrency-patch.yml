name: MEM-15 one-time concurrency patch

on:
  push:
    branches:
      - tmp-mem15-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mem15-gate
          fetch-depth: 0
      - run: python scripts/mem15_concurrency_patch.py
      - run: rm scripts/mem15_concurrency_patch.py .github/workflows/mem15-concurrency-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEM-15 serialize Chat mutations"
          git push origin HEAD:tmp-mem15-gate
