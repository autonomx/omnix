name: Trading strategy extended dataset

on:
  workflow_dispatch:
  push:
    branches:
      - agent/trading-auto-strategy-roadmap
    paths:
      - ".github/workflows/trading-strategy-extended-dataset.yml"

# One-shot branch-scoped trigger. The stress candidate was frozen before this
# block was reconstructed; this workflow never searches or retunes parameters.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: trading-historical-alpaca-${{ github.repository }}
  cancel-in-progress: false

jobs:
  extend-frozen-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
      OMNIX_ALPACA_API_KEY_ID: ${{ secrets.OMNIX_ALPACA_API_KEY_ID }}
      OMNIX_ALPACA_API_SECRET_KEY: ${{ secrets.OMNIX_ALPACA_API_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Alpaca historical-data credentials
        shell: bash
        run: |
          if [[ -z "${OMNIX_ALPACA_API_KEY_ID}" || -z "${OMNIX_ALPACA_API_SECRET_KEY}" ]]; then
            echo "::error::Both OMNIX_ALPACA_API_KEY_ID and OMNIX_ALPACA_API_SECRET_KEY are required for cache misses."
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Build dataset cache key
        id: dataset-cache-key
        shell: bash
        run: |
          echo "key=trading-liquidity-datasets-v1-${RUNNER_OS}-extended-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Restore existing frozen datasets
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: ${{ steps.dataset-cache-key.outputs.key }}
          restore-keys: |
            trading-liquidity-datasets-v1-${{ runner.os }}-extended-
            trading-liquidity-datasets-v1-${{ runner.os }}-

      - name: Report starting cache
        shell: bash
        run: |
          datasets="$(find .cache/trading-liquidity-datasets -type f -name 'session-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          empty="$(find .cache/trading-liquidity-datasets -type f -name '*.no-candidates.json' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Starting with ${datasets} frozen datasets and ${empty} no-candidate markers."

      - name: Extend cache across older frozen stress dates
        shell: bash
        run: |
          mkdir -p .cache/trading-liquidity-datasets
          python scripts/run_trading_strategy_liquidity_sweep_resilient.py \
            --start-date 2026-03-31 \
            --end-date 2026-04-28 \
            --initial-cash 100000 \
            --assumed-spread-bps 40 \
            --max-hold-minutes 90 \
            --reconstruction-max-age-days 180 \
            --max-sessions 30 \
            --thresholds "100000" \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/v11-older-stress-dataset \
            --require-covered-session

      - name: Run frozen V11 older stress validator
        shell: bash
        run: |
          python scripts/validate_trading_strategy_failed_selloff_v11_older_stress.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --output-dir artifacts/failed-selloff-v11-older-stress \
            --initial-cash 100000 \
            --assumed-spread-bps 40

      - name: Save extended frozen datasets
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: ${{ steps.dataset-cache-key.outputs.key }}

      - name: Publish stress summary
        if: always()
        shell: bash
        run: |
          echo "# V11 older frozen stress dataset" >> "${GITHUB_STEP_SUMMARY}"
          echo "Stress window: 2026-03-31 through 2026-04-28" >> "${GITHUB_STEP_SUMMARY}"
          echo "Warning: this older reconstruction has stronger current-listing survivorship bias than the primary validation blocks." >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f artifacts/failed-selloff-v11-older-stress/summary.md ]]; then
            cat artifacts/failed-selloff-v11-older-stress/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Report frozen stress result on PR 1494
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/failed-selloff-v11-older-stress/summary.md ]]; then
            {
              echo "<!-- omnix-v11-older-stress:${GITHUB_SHA} -->"
              echo "## Frozen V11 older stress result"
              echo
              echo "Actions run: ${GITHUB_RUN_ID} · commit: ${GITHUB_SHA}"
              echo
              cat artifacts/failed-selloff-v11-older-stress/summary.md
            } > /tmp/v11-stress-comment.md
            gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/v11-stress-comment.md
          else
            gh pr comment 1494 --repo "${GITHUB_REPOSITORY}" --body "Frozen V11 older stress workflow ${GITHUB_RUN_ID} on ${GITHUB_SHA} did not produce a stress summary; inspect the Actions run."
          fi

      - name: Upload extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v11-older-stress-evidence
          path: |
            artifacts/v11-older-stress-dataset
            artifacts/failed-selloff-v11-older-stress
          if-no-files-found: warn
          retention-days: 30