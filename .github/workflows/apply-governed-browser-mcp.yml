name: Apply governed browser MCP integration

on:
  push:
    branches: ["agent/governed-browser-mcp"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-browser-mcp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply asserted compiler patch
        run: python scripts/apply_governed_external_authority.py
      - name: Compile governed provider modules
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/app/agent_runtime/capabilities.py \
            src/app/agent_runtime/profiles.py \
            src/app/agent_runtime/evidence.py \
            src/app/agent_runtime/mcp_policy.py \
            src/app/agent_runtime/coding_external_authority.py \
            src/app/assistant_tools/browser_adapter.py \
            src/app/assistant_tools/mcp_adapter.py \
            src/app/assistant_tools/hermes_bridge.py \
            src/app/assistant_tools/config_store.py \
            src/app/assistant_tools/validation.py
      - name: Run focused provider tests
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -q pytest fastapi httpx pydantic requests python-multipart pillow playwright
          python -m pytest src/tests/agent_runtime/test_governed_browser_mcp.py -q --tb=short
      - name: Commit production integration and remove carrier
        shell: bash
        run: |
          git rm scripts/apply_governed_external_authority.py .github/workflows/apply-governed-browser-mcp.yml
          git add src/app/agent_runtime/evidence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): compile governed browser and MCP authority"
          git push origin HEAD:agent/governed-browser-mcp
