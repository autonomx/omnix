name: Apply Pi engineering tools once

on:
  push:
    branches: ["agent/coding-quality-phases-20-31"]
    paths:
      - ".github/workflows/apply-pi-engineering-tools-once.yml"
      - "scripts/apply_pi_engineering_tools_once.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pi-engineering-tools-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coding-quality-phases-20-31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Tighten coding-only authority assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_pi_engineering_tools_once.py")
          text = path.read_text(encoding="utf-8")
          old = '''replace(
              "src/app/agent_runtime/evidence.py",
              '                "workspace.git_diff",\\n            }',
              '                "workspace.git_diff",\\n                "workspace.lsp",\\n                "workspace.ast_search",\\n                "agent.context",\\n                "agent.clarify",\\n            }',
              count=1,
          )'''
          new = '''replace(
              "src/app/agent_runtime/evidence.py",
              '    if profile.id == "coding":\\n        read_caps = [\\n            capability\\n            for capability in profile.capabilities\\n            if capability in {\\n                "workspace.read",\\n                "workspace.list",\\n                "workspace.search",\\n                "workspace.git_status",\\n                "workspace.git_diff",\\n            }\\n        ]',
              '    if profile.id == "coding":\\n        read_caps = [\\n            capability\\n            for capability in profile.capabilities\\n            if capability in {\\n                "workspace.read",\\n                "workspace.list",\\n                "workspace.search",\\n                "workspace.git_status",\\n                "workspace.git_diff",\\n                "workspace.lsp",\\n                "workspace.ast_search",\\n                "agent.context",\\n                "agent.clarify",\\n            }\\n        ]',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one old authority patch, found {text.count(old)}")
          text = text.replace(old, new)
          replacements = {
              'source.get("OMNIX_AGENT_AST_GREP_COMMAND", "sg")': 'source.get("OMNIX_AGENT_AST_GREP_COMMAND", "ast-grep")',
              'process.env.OMNIX_AGENT_AST_GREP_COMMAND || "sg"': 'process.env.OMNIX_AGENT_AST_GREP_COMMAND || "ast-grep"',
              'Installed: ast-grep/sg, typescript-language-server, pyright-langserver': 'Installed: ast-grep, typescript-language-server, pyright-langserver',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"expected one ast-grep default occurrence: {before!r}, got {text.count(before)}")
              text = text.replace(before, after)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply asserted production patch
        run: python scripts/apply_pi_engineering_tools_once.py
      - name: Explicitly allow governed extension tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path("src/app/agent_runtime/pi_runtime_core.py")
          text = runtime.read_text(encoding="utf-8")
          old = '''    tools = sorted({tool for capability, tool in mapping.items() if capability in spec.capabilities})
    if tools:
        argv.extend(["--tools", ",".join(tools)])
    else:
        argv.append("--no-builtin-tools")'''
          new = '''    extension_tools: set[str] = set()
    if "workspace.lsp" in spec.capabilities:
        extension_tools.update({
            "lsp_diagnostics", "lsp_hover", "lsp_definition", "lsp_references",
            "lsp_document_symbols", "lsp_workspace_symbols", "engineering_diagnostics",
        })
    if "workspace.ast_search" in spec.capabilities:
        extension_tools.update({"ast_grep", "engineering_diagnostics"})
    if "workspace.anchored_edit" in spec.capabilities:
        extension_tools.update({"anchored_read", "anchored_edit"})
    if "agent.clarify" in spec.capabilities:
        extension_tools.add("ask_user_question")
    if "agent.context" in spec.capabilities:
        extension_tools.update({"context_info", "compact_context"})
    if spec.external_capabilities:
        extension_tools.add("omnix_capability")
    tools = sorted(
        {tool for capability, tool in mapping.items() if capability in spec.capabilities}
        | extension_tools
    )
    if tools:
        argv.extend(["--tools", ",".join(tools)])
    else:
        argv.append("--no-builtin-tools")'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one Pi tool allowlist block, found {text.count(old)}")
          runtime.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("src/tests/agent_runtime/test_pi_engineering_tools.py")
          source = tests.read_text(encoding="utf-8")
          marker = "def test_pi_explicitly_allowlists_governed_extension_tools"
          if marker not in source:
              source += '''\n\ndef test_pi_explicitly_allowlists_governed_extension_tools(tmp_path: Path) -> None:\n    spec = _spec(\n        tmp_path,\n        [\n            "workspace.read", "workspace.lsp", "workspace.ast_search",\n            "workspace.anchored_edit", "agent.clarify", "agent.context",\n        ],\n    ).model_copy(update={"external_capabilities": ["github.inspect_ci"]})\n    argv = pi_rpc_argv(spec, pi_path="pi")\n    tools = argv[argv.index("--tools") + 1].split(",")\n    for expected in (\n        "lsp_diagnostics", "lsp_references", "engineering_diagnostics", "ast_grep",\n        "anchored_read", "anchored_edit", "ask_user_question", "context_info",\n        "compact_context", "omnix_capability",\n    ):\n        assert expected in tools\n'''
              tests.write_text(source, encoding="utf-8")
          PY
      - name: Compile Python runtime
        run: python -m compileall -q src/app/agent_runtime src/tests/agent_runtime/test_pi_engineering_tools.py
      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Run focused engineering tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest src/tests/agent_runtime/test_pi_engineering_tools.py src/tests/agent_runtime/test_pi_runtime.py -q --tb=short
      - name: Regenerate API and typecheck web integration
        run: |
          npm --workspace @omnix/web run api:generate
          cp src/apps/web/src/api/generated/openapi.json /tmp/omnix-openapi.json
          cp src/apps/web/src/api/generated/types.ts /tmp/omnix-types.ts
          npm --workspace @omnix/web run typecheck
          npm --workspace @omnix/web run api:generate
          cmp /tmp/omnix-openapi.json src/apps/web/src/api/generated/openapi.json
          cmp /tmp/omnix-types.ts src/apps/web/src/api/generated/types.ts
      - name: Commit production result and self-remove carrier
        shell: bash
        run: |
          git rm scripts/apply_pi_engineering_tools_once.py .github/workflows/apply-pi-engineering-tools-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): add governed Pi engineering tools"
          git push origin HEAD:agent/coding-quality-phases-20-31
