name: Omnix Trading terminal gates

on:
  pull_request:
    branches: [main, "codingagent", "agent/generalized-agent-runtime"]
    paths:
      - "web/src/features/trading/**"
      - "web/src/api/generated/**"
      - "web/src/app/modules.ts"
      - "web/src/app/router.tsx"
      - "web/src/design/primitives.tsx"
      - "web/src/features/ModuleWorkspace.tsx"
      - "web/tests/e2e/trading-terminal.spec.ts"
      - "web/playwright.config.ts"
      - "web/package.json"
      - "web/tsconfig.trading.json"
      - "package-lock.json"
      - "scripts/export_gateway_openapi.py"
      - "src/app/apps/trading/**"
      - "src/app/providers/chatgpt_codex_provider.py"
      - "src/app/providers/__init__.py"
      - "src/app/apps/trading/route_registration.py"
      - "src/app/composition/gateway/__init__.py"
      - "src/app/persistence/migrations/*_trading_*.sql"
      - "src/tests/trading/**"
      - "src/tests/providers/test_chatgpt_codex_reliability.py"
      - "docs/architecture/ADR-0004-omnix-trading-terminal.md"
      - "docs/architecture/ADR-0005-trading-hermes-research-causality.md"
      - "docs/architecture/OMNIX_TRADING_**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/trading-terminal.yml"
  workflow_dispatch:

concurrency:
  group: omnix-trading-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trading-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out immutable workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Expected head: ${expected}"
          echo "Checked out:   ${actual}"
          test "${actual}" = "${expected}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Trading test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
          npm ci
      - name: Trading architecture and backend tests
        run: |
          python -m pytest \
            src/tests/trading \
            src/tests/providers/test_chatgpt_codex_reliability.py \
            -q --tb=short
      - name: Trading TypeScript typecheck
        run: npm --workspace @omnix/web run typecheck:trading
      - name: Generate shared gateway API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Upload generated API contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-generated-api
          path: |
            web/src/api/generated
            web/src/features/*/api/generated.ts
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated API contract is committed
        run: git diff --exit-code -- web/src/api/generated "web/src/features/*/api/generated.ts"
