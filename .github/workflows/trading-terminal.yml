name: Omnix Trading terminal gates

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/features/trading/**"
      - "apps/web/src/api/generated/**"
      - "apps/web/src/app/modules.ts"
      - "apps/web/src/app/router.tsx"
      - "apps/web/src/design/primitives.tsx"
      - "apps/web/src/features/ModuleWorkspace.tsx"
      - "apps/web/package.json"
      - "apps/web/tsconfig.trading.json"
      - "package-lock.json"
      - "scripts/export_gateway_openapi.py"
      - "src/app/trading/**"
      - "src/app/gateway/trading_routes.py"
      - "src/app/gateway/__init__.py"
      - "src/app/persistence/migrations/0024_trading_backtest_bar_indices.sql"
      - "src/app/persistence/migrations/0025_trading_backtest_artifacts.sql"
      - "src/app/persistence/migrations/0026_trading_alert_expiration.sql"
      - "src/tests/trading/**"
      - "docs/architecture/ADR-0004-omnix-trading-terminal.md"
      - "docs/architecture/OMNIX_TRADING_**"
      - "docs/plans/omnix_trading_terminal_roadmap_review.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/trading-terminal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trading-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Trading test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Trading architecture and backend tests
        run: python -m pytest src/tests/trading -q --tb=short
      - name: Trading frontend tests
        run: npm --workspace @omnix/web run test:trading
      - name: Trading TypeScript typecheck
        run: npm --workspace @omnix/web run typecheck:trading
      - name: Generate shared gateway API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated Trading API contract
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/implement-omnix-trading-terminal'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/generated/openapi.json apps/web/src/api/generated/types.ts
          if ! git diff --cached --quiet; then
            git commit -m "Trading API: regenerate alert expiration contracts"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload generated API contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-generated-api
          path: |
            apps/web/src/api/generated/openapi.json
            apps/web/src/api/generated/types.ts
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated API contract is committed
        run: git diff --exit-code -- apps/web/src/api/generated/openapi.json apps/web/src/api/generated/types.ts
