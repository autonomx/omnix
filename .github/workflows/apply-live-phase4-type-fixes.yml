name: Apply Live Phase 4 TypeScript fixes

on:
  push:
    branches:
      - agent/general-full-duplex-live

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-full-duplex-live
          fetch-depth: 0

      - name: Apply exact TypeScript contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          pcm = Path('apps/web/src/features/assistant-workspace/live-voice-pcm-session.ts')
          source = pcm.read_text(encoding='utf-8')
          old = "await terminateSession('turn-finished', { workletAlreadyDrained: true });"
          new = "await terminateSession('turn-finished', true);"
          if old not in source:
              raise SystemExit('Expected stale terminateSession call was not found.')
          pcm.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('apps/web/src/features/assistant-workspace/live-output-coordinator.test.ts')
          source = test.read_text(encoding='utf-8')
          replacements = [
              (
                  "const enqueueOutputPhrase = vi.fn(async () => undefined);",
                  "const enqueueOutputPhrase = vi.fn<LiveVoicePcmSession['enqueueOutputPhrase']>(async () => undefined);",
              ),
              (
                  "const firstOwnership = harness.enqueueOutputPhrase.mock.calls[0][2];",
                  "const firstOwnership = harness.enqueueOutputPhrase.mock.calls[0]![2];",
              ),
              (
                  "const secondOwnership = harness.enqueueOutputPhrase.mock.calls[1][2];",
                  "const secondOwnership = harness.enqueueOutputPhrase.mock.calls[1]![2];",
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected test fragment was not found: {old}')
              source = source.replace(old, new, 1)
          test.write_text(source, encoding='utf-8')
          PY

      - name: Commit branch patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/features/assistant-workspace/live-voice-pcm-session.ts \
            apps/web/src/features/assistant-workspace/live-output-coordinator.test.ts
          git commit -m "Fix Phase 4 Live output TypeScript contracts"
          git push origin HEAD:agent/general-full-duplex-live
