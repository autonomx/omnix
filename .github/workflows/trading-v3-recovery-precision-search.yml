name: Trading V3 recovery precision search

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v3-recovery-precision-search.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact research head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact 103-session causal cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-extended-32621017259-1
          fail-on-cache-miss: true

      - name: Recover exact fingerprinted one-shot script
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          # This historical commit contains the original one-shot payload. The
          # payload had one accidental extra character, so recover the unique
          # source whose SHA-256 matches the reviewed selector source rather
          # than executing malformed or silently changed research code.
          source_commit = "5529cb1bc223aa6f018630792aa5ce5e16c5071f"
          expected = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          historical = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{source_commit}:.github/workflows/trading-v3-recovery-precision-search.yml",
              ],
              text=True,
          )
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', historical)
          if match is None:
              raise SystemExit("historical embedded research payload not found")
          payload = match.group(1)

          recovered = None
          for removed_index in range(len(payload)):
              candidate = payload[:removed_index] + payload[removed_index + 1:]
              try:
                  source = gzip.decompress(base64.b64decode(candidate, validate=True))
              except Exception:
                  continue
              if hashlib.sha256(source).hexdigest() == expected:
                  recovered = (removed_index, source)
                  break
          if recovered is None:
              raise SystemExit("could not recover the exact fingerprinted research script")

          removed_index, source = recovered
          if removed_index != 3382:
              raise SystemExit(f"unexpected corruption index: {removed_index}")
          Path("/tmp/run_recovery_precision_search.py").write_bytes(source)
          print(f"Recovered exact research source sha256={expected}; removed_index={removed_index}")
          PYCODE
          python -m py_compile /tmp/run_recovery_precision_search.py

      - name: Run causal recovery precision search
        run: |
          python /tmp/run_recovery_precision_search.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2025-10-01 \
            --derivation-end 2025-12-31 \
            --oos-start 2026-01-02 \
            --oos-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --output-dir artifacts/v3-recovery-precision-search

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/v3-recovery-precision-search/summary.md ]]; then
            cat artifacts/v3-recovery-precision-search/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-recovery-precision-search
          path: artifacts/v3-recovery-precision-search
          if-no-files-found: warn
          retention-days: 30
