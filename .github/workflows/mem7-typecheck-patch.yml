name: MEM-7 one-time typecheck patch

on:
  push:
    branches:
      - tmp-mem7-manage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mem7-manage
          fetch-depth: 0
      - run: python scripts/mem7_typecheck_patch.py
      - run: rm scripts/mem7_typecheck_patch.py .github/workflows/mem7-typecheck-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEM-7 fix candidate mutation typing"
          git push origin HEAD:tmp-mem7-manage
