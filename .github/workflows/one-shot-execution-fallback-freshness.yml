name: One-shot execution fallback freshness

on:
  push:
    branches: ["agent/taskgraph-phases-15-19"]
    paths:
      - ".github/workflows/one-shot-execution-fallback-freshness.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taskgraph-phases-15-19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply causal freshness guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/app/trading/strategy_ai_shadow.py")
          text = p.read_text()
          old = '''    degraded_price_only = bool(\n        allow_degraded_price_only\n        and last is not None\n        and (bid is None or ask is None)\n        and not halted\n    )\n'''
          new = '''    degraded_price_only = bool(\n        allow_degraded_price_only\n        and last is not None\n        and source_time is not None\n        and abs((source_time - decision_at).total_seconds()) <= float(max_capture_lag_seconds)\n        and (bid is None or ask is None)\n        and not halted\n    )\n'''
          if old not in text:
              raise SystemExit("price-only freshness block not found")
          p.write_text(text.replace(old, new, 1))

          p = Path("src/tests/trading/test_strategy_ai_shadow.py")
          text = p.read_text()
          marker = "def test_position_state_tracks_add_reduce_and_realized_pnl() -> None:\n"
          test = '''def test_ai_price_only_fallback_rejects_stale_research_price() -> None:\n    execution = {\n        "provider": "alpaca_iex",\n        "last": Decimal("10"),\n        "bid": None,\n        "ask": None,\n        "source_time": DECISION_AT - timedelta(minutes=2),\n        "spread_bps": None,\n        "execution_eligible": False,\n        "freshness_mode": "live",\n        "rejection_reasons": ("BID_ASK_UNAVAILABLE", "STALE_MARKET_DATA"),\n        "halted": False,\n        "observation_quality": "price_only",\n    }\n    fill = simulate_ai_shadow_fill(\n        execution,\n        side="buy",\n        instrument_id=INSTRUMENT,\n        binding_id="alpaca:TEST",\n        decision_at=DECISION_AT,\n        requested_units=Decimal("1"),\n        reference_price=Decimal("10"),\n        allow_degraded_price_only=True,\n        degraded_spread_bps=Decimal("150"),\n    )\n\n    assert fill.should_fill is False\n    assert fill.hypothetical is False\n\n\n'''
          if marker not in text or "test_ai_price_only_fallback_rejects_stale_research_price" in text:
              raise SystemExit("stale fallback test insertion mismatch")
          p.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
      - name: Run focused tests
        run: python -m pytest src/tests/trading/test_strategy_ai_shadow.py src/tests/trading/test_trading_alpaca_iex_execution.py -q --tb=short
      - name: Run full Trading backend gate
        run: python -m pytest src/tests/trading src/tests/providers/test_chatgpt_codex_reliability.py -q --tb=short
      - name: Commit verified freshness guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/trading/strategy_ai_shadow.py src/tests/trading/test_strategy_ai_shadow.py
          git commit -m "Require fresh price-only shadow observations"
          git push origin HEAD:agent/taskgraph-phases-15-19
