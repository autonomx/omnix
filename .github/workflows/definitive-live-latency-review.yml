name: Definitive live latency review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  definitive-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Ensure final reviewed source and documentation
        run: |
          REVIEW_COMMIT=34c1fbd53b89bd6d383945a8d55f9b219516b7a5
          for index in 00 01 02 03 04 05 06 07; do
            git show "${REVIEW_COMMIT}:.github/live-latency-review/remaining4.part${index}"
          done | base64 --decode > /tmp/reviewed-remaining.tar.gz
          mkdir -p /tmp/reviewed-source
          tar -xzf /tmp/reviewed-remaining.tar.gz -C /tmp/reviewed-source
          cp \
            /tmp/reviewed-source/apps/web/src/features/assistant-workspace/live-stt-authority-controller.ts \
            apps/web/src/features/assistant-workspace/live-stt-authority-controller.ts
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/live-conversation/kyutai-live-stt.md")
          text = path.read_text()
          marker = "## Measured production authority evidence"
          section = r'''

## Measured production authority evidence

`authority=auto` is fail-closed. Approval booleans do not promote Kyutai by themselves; the adapter also requires finite, non-negative measurements at or below every release threshold.

| Variable | Required threshold |
| --- | --- |
| `KYUTAI_STT_MEDIAN_END_TO_AUDIO_MS` | `<= 750` |
| `KYUTAI_STT_P95_END_TO_AUDIO_MS` | `<= 1000` |
| `KYUTAI_STT_FALSE_ENDPOINT_RATE` | `<= 0.03` |
| `KYUTAI_STT_MISSED_ENDPOINT_RATE` | `<= 0.05` |
| `KYUTAI_STT_INTERRUPTION_TO_SILENCE_MS` | `<= 250` |
| `KYUTAI_STT_UNDERRUN_TURN_RATE` | `<= 0.02` |
| `KYUTAI_STT_DOWNSTREAM_P95_REGRESSION` | `<= 0.15` |

After recording the latest representative RTX 4090 run, explicitly approve it with `KYUTAI_STT_QUALITY_GATE_PASSED=true` and `KYUTAI_STT_CONTENTION_GATE_PASSED=true`. Missing, non-finite, negative, or above-threshold values keep `authority=auto` ineligible and are reported by `/authorityz`. Use `authority=test` for local readiness/warm-model latency experiments that intentionally do not claim production promotion.

Authoritative endpoint commitment is owned by the live-voice controller, which updates normal floor, timeout, continuation-buffer, ordered-sequence, and diagnostics state before sending `finalize`. The WebSocket transport only negotiates readiness and carries provider events.
'''
          if marker not in text:
              path.write_text(text.rstrip() + section + "\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Lint focused Python
        run: |
          ruff check \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/tts_live_capabilities.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py

      - name: Run focused Python tests
        run: |
          python -m pytest \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py \
            -q --tb=short --junitxml=/tmp/live-latency-pytest.xml

      - name: Typecheck focused browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee /tmp/definitive-live-review-typecheck.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(voice-websocket(\\.spec)?|voice-controller|accepted-final|stt-authority-controller|speculation-controller|tts-adaptive-buffer-controller|tts-capability-controller|voice-clause-stabilizer|voice-pcm-worklet|latency-rollout\\.spec)\\.ts|src/main\\.tsx)" /tmp/definitive-live-review-typecheck.txt; then
            exit "${status:-1}"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside focused files."
          fi

      - name: Run focused browser tests
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=/tmp/live-latency-vitest.xml

      - name: Commit final source and remove temporary workflows
        id: commit
        run: |
          rm -f \
            .github/clean-live-latency-browser-failure.txt \
            .github/workflows/clean-live-latency-browser-diagnostics.yml \
            .github/workflows/clean-live-latency-browser-diagnostics-publish.yml \
            .github/workflows/restore-reviewed-live-stt-authority.yml \
            .github/workflows/finalize-live-latency-review.yml \
            .github/workflows/complete-live-latency-review.yml \
            .github/workflows/final-live-latency-review-validation.yml \
            .github/workflows/definitive-live-latency-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            apps/web/src/features/assistant-workspace/live-stt-authority-controller.ts \
            docs/live-conversation/kyutai-live-stt.md \
            .github
          if ! git diff --cached --quiet; then
            git commit -m "Finalize low-latency voice correctness review"
            git push origin HEAD:${{ github.head_ref }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish final review result
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          def count(path: str) -> int:
              root = ET.parse(path).getroot()
              return sum(1 for _ in root.iter("testcase"))

          body = f'''## Final correctness review validation

The remaining correctness and completeness findings were implemented and validated from the clean PR branch at `{os.environ["VALIDATED_SHA"]}`.

- focused Ruff validation passed
- **{count("/tmp/live-latency-pytest.xml")} focused Python unit/bridge tests passed**
- scoped TypeScript validation passed for the complete live-latency browser path
- **{count("/tmp/live-latency-vitest.xml")} focused browser tests passed**

Remediation includes controller-owned authoritative endpoint commitment, negotiated STT readiness, ordered timeout recovery, request-compatible side-effect-free speculation, normal voice-turn identity preservation, active adaptive-TTS worklet updates, and measured fail-closed production promotion gates.

No additional code-completeness blocker remains in the reviewed path. The PR should remain draft only until the real RTX 4090 Kyutai + LLM + Qwen TTS contention, latency, interruption, transcript-quality, and VRAM evidence is recorded.
'''
          Path("/tmp/final-review-comment.md").write_text(body)
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/final-review-comment.md
