name: Temporary gateway OpenAPI export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart playwright
      - name: Export committed gateway schema
        run: python scripts/export_gateway_openapi.py apps/web/src/api/generated/openapi.json
      - name: Commit schema when stale
        run: |
          if git diff --quiet -- apps/web/src/api/generated/openapi.json; then
            echo "Gateway schema is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/generated/openapi.json
          git commit -m "Refresh generated gateway OpenAPI schema"
          git push origin HEAD:${{ github.head_ref }}
