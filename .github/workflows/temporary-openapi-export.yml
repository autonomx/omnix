name: Temporary gateway OpenAPI export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart playwright
      - name: Export current gateway schema
        run: python scripts/export_gateway_openapi.py openapi-current.json
      - name: Upload generated schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-current
          path: openapi-current.json
