name: Trading V3 adaptive exit research

on:
  pull_request:
    branches:
      - main
    paths:
      - src/app/trading/strategy_adaptive_exit_research.py
      - src/tests/trading/test_strategy_adaptive_exit_research.py
      - scripts/run_trading_strategy_v3_adaptive_exit_research.py
      - docs/plans/trading_v3_adaptive_exit_hypothesis.md
      - .github/workflows/trading-v3-adaptive-exit-research.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact frozen exit-policy head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets pytest playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact 103-session causal cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-extended-32621017259-1
          fail-on-cache-miss: true

      - name: Verify adaptive exit policy tests
        run: python -m pytest src/tests/trading/test_strategy_adaptive_exit_research.py -q --tb=short

      - name: Verify replay script compiles
        run: python -m py_compile scripts/run_trading_strategy_v3_adaptive_exit_research.py

      - name: Replay A versus B on identical development entries
        run: |
          python scripts/run_trading_strategy_v3_adaptive_exit_research.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2025-10-01 \
            --development-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --output-dir artifacts/v3-adaptive-exit-research

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/v3-adaptive-exit-research/summary.md ]]; then
            cat artifacts/v3-adaptive-exit-research/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload paired exit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-adaptive-exit-research
          path: artifacts/v3-adaptive-exit-research
          if-no-files-found: warn
          retention-days: 30
