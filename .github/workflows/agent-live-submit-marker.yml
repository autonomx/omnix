name: Agent Live submit marker

on:
  push:
    branches:
      - agent/general-full-duplex-live

permissions:
  contents: write

jobs:
  patch-live-submit-marker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-full-duplex-live
      - name: Mark accepted STT finals before composer submission
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/features/assistant-workspace/live-voice-controller.ts")
          text = path.read_text(encoding="utf-8")
          old = """  resetTurnState(session);
            if (transcript && !suppressTurn) {
              renderTranscript(card, 'You', transcript, 'final');
              populateComposer(transcript);
              submitComposer();
            }
          """
          new = """  resetTurnState(session);
            if (transcript && !suppressTurn) {
              dispatchLiveVoicePerfEvent({
                stage: 'stt_final_submit_requested',
                timestamp: new Date().toISOString(),
                transcriptChars: transcript.length,
                protocol: session.client.segmentedProtocolActive ? 'segmented-v1' : 'legacy',
              });
              renderTranscript(card, 'You', transcript, 'final');
              populateComposer(transcript);
              submitComposer();
            }
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one accepted-final block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/assistant-workspace/live-voice-controller.ts
          git commit -m "Route accepted Live STT finals through coordination"
          git push origin HEAD:agent/general-full-duplex-live
