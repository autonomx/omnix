name: Trading V3 deep recovery census

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/plans/trading_v3_deep_recovery_census_protocol.md
      - scripts/run_trading_strategy_v3_deep_recovery_census.py
      - .github/workflows/trading-v3-deep-recovery-census.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact census head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact 103-session causal cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-extended-32621017259-1
          fail-on-cache-miss: true

      - name: Verify census script
        run: python -m py_compile scripts/run_trading_strategy_v3_deep_recovery_census.py

      - name: Run all-candidate deep-recovery census
        run: |
          python scripts/run_trading_strategy_v3_deep_recovery_census.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2025-10-01 \
            --development-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --output-dir artifacts/v3-deep-recovery-census

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/v3-deep-recovery-census/summary.md ]]; then
            cat artifacts/v3-deep-recovery-census/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-deep-recovery-census
          path: artifacts/v3-deep-recovery-census
          if-no-files-found: warn
          retention-days: 30
