permissions:
  contents: read

jobs:
  phase0-architecture-compliance:
    name: Phase 0 architecture compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart playwright

      - name: Run Phase 0 architecture compliance gates
        run: |
          set -o pipefail
          python -m pytest src/tests/rpg/test_ci_phase0_architecture_compliance.py -q --tb=short 2>&1 | tee phase0-pytest-output.txt

      - name: Upload Phase 0 pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-pytest-output
          path: phase0-pytest-output.txt
