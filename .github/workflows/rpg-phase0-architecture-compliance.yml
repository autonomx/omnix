name: RPG Phase 0 architecture compliance

on:
  pull_request:
    branches: [main, rpg]
  push:
    branches: [main, rpg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-character-runtime:
    if: github.head_ref == 'fix/live-character-runtime-sync' || github.ref == 'refs/heads/fix/live-character-runtime-sync'
    name: Verify live character runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install

      - name: Run active-character regression
        run: npm --workspace @omnix/web run test -- --run src/features/chatbot/ChatbotWorkspace.character-runtime.test.tsx

      - name: Run web typecheck
        run: npm --workspace @omnix/web run typecheck

  phase0-architecture-compliance:
    name: Phase 0 architecture compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart playwright

      - name: Run Phase 0 architecture compliance gates
        run: |
          set -o pipefail
          python -m pytest \
            src/tests/rpg/test_ci_phase0_architecture_compliance.py \
            src/tests/rpg/test_ci_postgresql_migration_guard.py \
            src/tests/rpg/test_ci_narrative_engine_architecture.py \
            -q --tb=short 2>&1 | tee phase0-pytest-output.txt

      - name: Upload Phase 0 pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-pytest-output
          path: phase0-pytest-output.txt
