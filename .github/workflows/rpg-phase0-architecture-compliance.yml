name: RPG Phase 0 architecture compliance

on:
  pull_request:
    branches: [main, rpg]
  push:
    branches: [main, rpg]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-voice-library-recovery:
    if: github.head_ref == 'fix/voice-library-reindex' || github.ref == 'refs/heads/fix/voice-library-reindex'
    name: Apply voice library recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/voice-library-reindex
          fetch-depth: 0

      - name: Apply prepared recovery patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-voice-library-recovery.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          script_lines = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          script = '\n'.join(script_lines)
          exec(compile(script, str(workflow), 'exec'))

          store_path = Path('src/app/assets/store.py')
          store = store_path.read_text(encoding='utf-8')

          def indent_generated_method(source: str, signature: str, next_signature: str) -> str:
              start_at = source.index(signature)
              body_at = source.index('\n', start_at) + 1
              end_at = source.index(next_signature, body_at)
              body = source[body_at:end_at]
              indented = ''.join(
                  f'    {line}' if line.strip() else line
                  for line in body.splitlines(keepends=True)
              )
              return source[:body_at] + indented + source[end_at:]

          store = indent_generated_method(
              store,
              '    def _legacy_voice_clone_assets(self) -> list[AssetRecord]:',
              '    def _legacy_audio_assets(self) -> list[AssetRecord]:',
          )
          store = indent_generated_method(
              store,
              '    def _load_manifest(self) -> dict[str, AssetRecord]:',
              '    def _save_manifest(self, assets: dict[str, AssetRecord]) -> None:',
          )
          store_path.write_text(store, encoding='utf-8')

          test_path = Path('src/tests/app/test_voice_library_index_recovery.py')
          test_source = test_path.read_text(encoding='utf-8').replace(
              '    import app.shared as shared',
              '    from app import shared',
          )
          test_path.write_text(test_source, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx pydantic requests python-multipart
          npm install

      - name: Validate recovery Python correctness
        run: ruff check --select E9,F src/app/assets/store.py src/tests/app/test_voice_library_index_recovery.py

      - name: Run backend voice-library recovery regression
        run: python -m pytest src/tests/app/test_voice_library_index_recovery.py src/tests/app/test_shared_assets_readthrough.py -q --tb=short

      - name: Run frontend voice-library recovery regression
        run: npm --workspace @omnix/web run test -- --run src/features/voice/VoiceWorkspace.library-recovery.test.tsx src/features/voice/VoiceWorkspace.test.tsx

      - name: Run web typecheck
        run: npm --workspace @omnix/web run typecheck

      - name: Commit verified recovery
        shell: bash
        run: |
          rm .github/workflows/apply-voice-library-recovery.yml
          git checkout origin/main -- .github/workflows/rpg-phase0-architecture-compliance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/assets/store.py \
            src/tests/app/test_voice_library_index_recovery.py \
            apps/web/src/features/voice/VoiceWorkspace.tsx \
            apps/web/src/features/voice/VoiceWorkspace.library-recovery.test.tsx \
            .github/workflows/apply-voice-library-recovery.yml \
            .github/workflows/rpg-phase0-architecture-compliance.yml
          git commit -m "fix(voice): recover local voice library index"
          git push origin HEAD:fix/voice-library-reindex

  phase0-architecture-compliance:
    name: Phase 0 architecture compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart playwright

      - name: Run Phase 0 architecture compliance gates
        run: |
          set -o pipefail
          python -m pytest \
            src/tests/rpg/test_ci_phase0_architecture_compliance.py \
            src/tests/rpg/test_ci_postgresql_migration_guard.py \
            src/tests/rpg/test_ci_narrative_engine_architecture.py \
            -q --tb=short 2>&1 | tee phase0-pytest-output.txt

      - name: Upload Phase 0 pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-pytest-output
          path: phase0-pytest-output.txt
