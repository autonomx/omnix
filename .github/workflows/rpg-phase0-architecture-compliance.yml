name: RPG Phase 0 architecture compliance

on:
  pull_request:
    branches: [main, rpg]
  push:
    branches: [main, rpg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-live-character-runtime-fix:
    if: github.head_ref == 'fix/live-character-runtime-sync' || github.ref == 'refs/heads/fix/live-character-runtime-sync'
    name: Apply live character runtime fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-character-runtime-sync
          fetch-depth: 0

      - name: Apply prepared source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-live-character-runtime-fix.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == 'PY')
          script_lines = lines[start + 1:end]
          nonempty_indents = [len(line) - len(line.lstrip()) for line in script_lines if line.strip()]
          indent = min(nonempty_indents)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in script_lines)
          exec(compile(script, str(workflow), 'exec'))
          PY
          git diff --check

      - name: Commit clean fix branch
        shell: bash
        run: |
          rm .github/workflows/apply-live-character-runtime-fix.yml
          git checkout origin/main -- .github/workflows/rpg-phase0-architecture-compliance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/chatbot/ChatbotWorkspace.tsx \
            apps/web/src/features/chatbot/ChatbotWorkspace.character-runtime.test.tsx \
            .github/workflows/apply-live-character-runtime-fix.yml \
            .github/workflows/rpg-phase0-architecture-compliance.yml
          git commit -m "fix(chatbot): keep active character in live voice"
          git push origin HEAD:fix/live-character-runtime-sync

  phase0-architecture-compliance:
    name: Phase 0 architecture compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RPG_TEST_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart playwright

      - name: Run Phase 0 architecture compliance gates
        run: |
          set -o pipefail
          python -m pytest \
            src/tests/rpg/test_ci_phase0_architecture_compliance.py \
            src/tests/rpg/test_ci_postgresql_migration_guard.py \
            src/tests/rpg/test_ci_narrative_engine_architecture.py \
            -q --tb=short 2>&1 | tee phase0-pytest-output.txt

      - name: Upload Phase 0 pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-pytest-output
          path: phase0-pytest-output.txt
