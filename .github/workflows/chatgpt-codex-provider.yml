name: ChatGPT Codex provider

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/providers/chatgpt_codex_provider.py"
      - "src/app/providers/registry.py"
      - "src/app/providers/facade.py"
      - "src/app/providers/__init__.py"
      - "src/app/platform/settings_control.py"
      - "src/app/platform/settings_profile_core.py"
      - "src/apps/web/src/features/settings/**"
      - "src/tests/unit/providers/test_chatgpt_codex_provider.py"
      - ".github/workflows/chatgpt-codex-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-chatgpt-codex-provider:
    name: Validate ChatGPT Codex provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx numpy pydantic requests python-multipart playwright

      - name: Ruff provider and settings changes
        run: |
          ruff check \
            src/app/providers/chatgpt_codex_provider.py \
            src/app/providers/registry.py \
            src/app/providers/facade.py \
            src/app/platform/settings_control.py \
            src/app/platform/settings_profile_core.py \
            src/tests/unit/providers/test_chatgpt_codex_provider.py

      - name: Provider unit tests
        run: |
          python -m pytest \
            src/tests/unit/providers/test_chatgpt_codex_provider.py \
            src/tests/unit/providers/test_registry.py \
            -q --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install

      - name: Web typecheck
        run: npm --workspace @omnix/web run typecheck

      - name: Codex settings adapter regression
        run: npm --workspace @omnix/web run test -- --run src/features/settings/settingsApi.spec.ts
