name: ChatGPT Codex provider

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/chat/store.py"
      - "src/app/agent_runtime/chat_bridge.py"
      - "src/app/agent_runtime/evidence.py"
      - "src/app/agent_runtime/router.py"
      - "src/app/agent_runtime/profiles.py"
      - "src/app/agent_runtime/semantic_classifier.py"
      - "src/app/live_voice/llm/stream.py"
      - "src/app/gateway/main.py"
      - "src/app/providers/service.py"
      - "src/app/settings/service.py"
      - "src/app/providers/chatgpt_codex_provider.py"
      - "src/app/providers/structured/**"
      - "src/app/providers/registry.py"
      - "src/app/providers/facade.py"
      - "src/app/providers/__init__.py"
      - "src/app/gateway/settings_control.py"
      - "src/app/settings/profile_core.py"
      - "src/apps/web/src/api/client.ts"
      - "src/apps/web/src/api/generated/**"
      - "src/apps/web/src/features/settings/**"
      - "src/tests/api/gateway/test_gateway_codex_auth.py"
      - "src/tests/app/test_live_chat_low_latency_stream.py"
      - "src/tests/unit/chat/test_chatgpt_codex_session_routing.py"
      - "src/tests/unit/providers/test_chatgpt_codex_provider.py"
      - "src/tests/unit/providers/test_chatgpt_codex_review_hardening.py"
      - "src/tests/unit/providers/test_provider_cache_lifecycle.py"
      - "src/tests/agent_runtime/test_semantic_classifier.py"
      - "src/tests/agent_runtime/test_coding_classification_matrix.py"
      - "src/tests/agent_runtime/test_live_codex_coding_classification.py"
      - "src/tests/agent_runtime/test_live_codex_semantic_matrix.py"
      - "src/tests/agent_runtime/test_live_codex_steering_matrix.py"
      - "pyproject.toml"
      - ".github/workflows/chatgpt-codex-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-chatgpt-codex-provider:
    name: Validate ChatGPT Codex provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omnix_test
          POSTGRES_USER: omnix
          POSTGRES_PASSWORD: omnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnix -d omnix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      OMNIX_TEST_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
      OMNIX_DATABASE_URL: postgresql://omnix:omnix@127.0.0.1:5432/omnix_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Apply PostgreSQL migrations
        run: python -m app.persistence migrate

      - name: Initialize PostgreSQL authority and local identity
        run: python -c "from app.persistence.startup import bootstrap_postgresql_runtime; bootstrap_postgresql_runtime()"

      - name: Ruff correctness checks
        run: |
          # These files share legacy provider modules that intentionally predate
          # the repository's newer modernization/style rules. Keep this feature
          # gate focused on the touched provider/chat files rather than linting
          # legacy provider implementation wholesale; cache behavior is covered below.
          ruff check --select E4,E7,E9,F \
            src/app/chat/store.py \
            src/app/agent_runtime/chat_bridge.py \
            src/app/agent_runtime/router.py \
            src/app/agent_runtime/profiles.py \
            src/app/agent_runtime/semantic_classifier.py \
            src/app/live_voice/llm/stream.py \
            src/app/providers/chatgpt_codex_provider.py \
            src/app/providers/registry.py \
            src/app/providers/facade.py \
            src/app/gateway/settings_control.py \
            src/app/settings/profile_core.py \
            src/tests/api/gateway/test_gateway_codex_auth.py \
            src/tests/app/test_live_chat_low_latency_stream.py \
            src/tests/unit/chat/test_chatgpt_codex_session_routing.py \
            src/tests/unit/providers/test_chatgpt_codex_provider.py \
            src/tests/unit/providers/test_chatgpt_codex_review_hardening.py \
            src/tests/unit/providers/test_provider_cache_lifecycle.py \
            src/tests/agent_runtime/test_semantic_classifier.py \
            src/tests/agent_runtime/test_coding_classification_matrix.py \
            src/tests/agent_runtime/test_live_codex_coding_classification.py \
            src/tests/agent_runtime/test_live_codex_semantic_matrix.py \
            src/tests/agent_runtime/test_live_codex_steering_matrix.py

      - name: Provider and chat routing unit tests
        run: |
          python -m pytest \
            src/tests/api/gateway/test_gateway_codex_auth.py \
            src/tests/unit/providers/test_chatgpt_codex_provider.py \
            src/tests/unit/providers/test_chatgpt_codex_review_hardening.py \
            src/tests/unit/providers/test_provider_cache_lifecycle.py \
            src/tests/unit/chat/test_chatgpt_codex_session_routing.py \
            src/tests/app/test_live_chat_low_latency_stream.py \
            -q --tb=short

      - name: Semantic classifier contracts
        run: |
          python -m pytest \
            src/tests/agent_runtime/test_semantic_classifier.py \
            src/tests/agent_runtime/test_coding_classification_matrix.py \
            -q --tb=short

      - name: Live Codex semantic matrix contract
        run: |
          # Hosted GitHub runners do not own the user's local Codex login, so
          # live model turns remain opt-in. This still validates imports,
          # marker registration, matrix sizes, and collection. Local live runs
          # use the suite-specific flags:
          #   OMNIX_RUN_LIVE_CODEX_SEMANTIC_TESTS=1
          #   OMNIX_RUN_LIVE_CODEX_CODING_CLASSIFICATION_TESTS=1
          #   OMNIX_RUN_LIVE_CODEX_STEERING_TESTS=1
          python -m pytest \
            src/tests/agent_runtime/test_live_codex_semantic_matrix.py \
            src/tests/agent_runtime/test_live_codex_coding_classification.py \
            src/tests/agent_runtime/test_live_codex_steering_matrix.py \
            -q --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm ci

      - name: Web typecheck
        run: npm --workspace @omnix/web run typecheck

      - name: Codex settings adapter regression
        run: npm --workspace @omnix/web run test -- --run src/features/settings/settingsApi.spec.ts
