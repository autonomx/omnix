name: Stoch guarded branch sync

on:
  push:
    branches:
      - agent/stoch-rsi-guarded-arm-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install API generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic python-multipart httpx requests "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Complete guarded arm registry and UI wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          dynamic = Path('src/app/trading/strategy_dynamic_discovery.py')
          text = dynamic.read_text()
          old = '    "stoch-rsi-5min",\n    "gap-pullback-v2-prospective-20260825",'
          new = '    "stoch-rsi-5min",\n    "stoch-rsi-5min-guarded-v1",\n    "gap-pullback-v2-prospective-20260825",'
          if old not in text:
              raise SystemExit('dynamic strategy registry anchor not found')
          text = text.replace(old, new, 1)
          old = '    if arm == "stoch-rsi-5min":\n        return _clip(row.reversal_prior * 0.45 + row.market_confirmation * 0.30 + row.execution_quality * 0.25)'
          new = '    if arm in {"stoch-rsi-5min", "stoch-rsi-5min-guarded-v1"}:\n        return _clip(row.reversal_prior * 0.45 + row.market_confirmation * 0.30 + row.execution_quality * 0.25)'
          if old not in text:
              raise SystemExit('dynamic strategy score anchor not found')
          dynamic.write_text(text.replace(old, new, 1))

          panel = Path('src/apps/web/src/features/trading/TradingStrategiesPanel.tsx')
          text = panel.read_text()
          old = "  { key: 'stoch-rsi-5min', label: 'E · 5m Stoch RSI', description: 'Linked deterministic child strategy', strategyId: 'stoch-rsi-5min' },\n  { key: 'gap-pullback-v2-prospective-20260825', label: 'F · Gap pullback V2', description: 'Linked deterministic prospective child strategy', strategyId: 'gap-pullback-v2-prospective-20260825' },"
          new = "  { key: 'stoch-rsi-5min', label: 'E · 5m Stoch RSI', description: 'Linked deterministic child strategy', strategyId: 'stoch-rsi-5min' },\n  { key: 'stoch-rsi-5min-guarded-v1', label: 'F · 5m Stoch RSI Guarded', description: 'Linked guarded deterministic research child strategy', strategyId: 'stoch-rsi-5min-guarded-v1' },\n  { key: 'gap-pullback-v2-prospective-20260825', label: 'G · Gap pullback V2', description: 'Linked deterministic prospective child strategy', strategyId: 'gap-pullback-v2-prospective-20260825' },"
          if old not in text:
              raise SystemExit('interday UI arm anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Same frozen Finviz Top-5 cohort · four embedded arms plus two linked deterministic child strategies',
              'Same frozen Finviz Top-5 cohort · four embedded arms plus three linked deterministic child strategies',
              1,
          )
          panel.write_text(text)
          PY
      - name: Regenerate shared API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Remove one-shot workflow and commit synchronized files
        run: |
          rm -f .github/workflows/stoch-guarded-branch-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/trading/strategy_dynamic_discovery.py \
                  src/apps/web/src/features/trading/TradingStrategiesPanel.tsx \
                  src/apps/web/src/api/generated/openapi.json \
                  src/apps/web/src/api/generated/types.ts \
                  .github/workflows/stoch-guarded-branch-sync.yml
          git commit -m 'Trading: finish guarded arm integration wiring'
          git push origin HEAD:${{ github.ref_name }}
