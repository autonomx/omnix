name: Temporary PR OpenAPI refresh

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-chat-message-stream-audio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi pydantic requests python-multipart websockets python-socketio aiohttp pyyaml numpy httpx
      - name: Generate schema
        id: generate
        continue-on-error: true
        run: python scripts/export_gateway_openapi.py apps/web/src/api/generated/openapi.json > schema-generation.log 2>&1
      - name: Upload schema diagnostic
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: temporary-schema-generation-log
          path: schema-generation.log
      - name: Fail after diagnostic upload
        if: steps.generate.outcome == 'failure'
        run: exit 1
      - name: Commit generated schema
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/generated/openapi.json
          git commit -m "Refresh generated gateway OpenAPI" || exit 0
          git push origin HEAD:tmp-chat-message-stream-audio
