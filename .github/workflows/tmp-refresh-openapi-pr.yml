name: Temporary PR OpenAPI refresh

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-chat-message-stream-audio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi pydantic requests python-multipart websockets python-socketio aiohttp pyyaml numpy
      - run: python scripts/export_gateway_openapi.py apps/web/src/api/generated/openapi.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/generated/openapi.json
          git commit -m "Refresh generated gateway OpenAPI" || exit 0
          git push origin HEAD:tmp-chat-message-stream-audio
