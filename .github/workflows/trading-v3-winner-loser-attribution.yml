name: Trading V3 winner loser attribution

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_trading_strategy_v3_winner_loser_attribution.py
      - .github/workflows/trading-v3-winner-loser-attribution.yml

permissions:
  contents: read

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets pytest playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact 103-session causal cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-extended-32621017259-1
          fail-on-cache-miss: true

      - name: Verify research script imports
        run: python -m py_compile scripts/run_trading_strategy_v3_winner_loser_attribution.py

      - name: Run development-only winner loser attribution
        run: |
          python scripts/run_trading_strategy_v3_winner_loser_attribution.py \
            --dataset-cache-dir .cache/trading-liquidity-datasets \
            --development-start 2025-10-01 \
            --development-end 2026-02-27 \
            --initial-cash 100000 \
            --assumed-spread-bps 150 \
            --output-dir artifacts/v3-winner-loser-attribution

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/v3-winner-loser-attribution/summary.md ]]; then
            cat artifacts/v3-winner-loser-attribution/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-winner-loser-attribution
          path: artifacts/v3-winner-loser-attribution
          if-no-files-found: warn
          retention-days: 30
