def test_revision_revokes_invalidated_child_before_current_identity_is_cleared() -> None:
    database = _database()
    try:
        context = bootstrap_local_tenant(database)
        graph_run_id = f"graph-{uuid.uuid4().hex}"
        child_run_id = f"child-{uuid.uuid4().hex}"
