name: Regenerate audiobook API contract once

on:
  push:
    branches: ["agent/audiobook-v1"]
    paths:
      - ".github/workflows/audiobook-api-contract-once.yml"

permissions:
  contents: write

concurrency:
  group: audiobook-api-contract-once
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audiobook-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install API generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm ci
      - name: Regenerate gateway API contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated contract and self-remove
        shell: bash
        run: |
          git rm .github/workflows/audiobook-api-contract-once.yml
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "api: sync audiobook document policy contract"
          git push origin HEAD:agent/audiobook-v1
