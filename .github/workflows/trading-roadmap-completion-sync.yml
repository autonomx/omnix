          amendment = '''\n\n## Completion and correctness amendments — 2026-08-24\n\nThe production strategy catalog now contains persisted `1.0.0`, strict `1.1.0`, reviewed-research-policy `1.2.0`, and frozen prospective `2.0.0` semantics. `2.0.0` remains promotion-gated by prospective SHADOW evidence and explicit operator review.\n\nFinal roadmap hardening makes the following contracts release requirements rather than dashboard-only diagnostics:\n\n- **Exit parity:** AUTO PAPER and the portfolio backtester both evaluate the configured causal RSI cross in addition to shared stop/target semantics. V2 retains its separately versioned profit-protection and max-hold rules.\n- **Immutable initial risk:** strategy protections retain the original stop/target geometry even after a V2 protected stop moves. Canonical paper R is computed from that original risk, not the final moved stop.\n- **Prospective excursions:** AUTO PAPER protections persist favorable/adverse price extrema so completed round trips retain MAE/MFE in R.\n- **Typed supply state:** keyword matches alone are not execution-authoritative dilution vetoes. Supply evidence is classified as active, terminated, exhausted, expired, redeemed, withdrawn, or unknown; only a resolved active state becomes a deterministic `dilution_flag`. Unknown/inactive states remain research evidence.\n- **Soft archive:** normal strategy removal is an archive operation (`mode=off`, disabled, immutable `archived_at`). Runs/events/protections remain first-class queryable evidence; hard database deletion is no longer the operator workflow.\n- **Dashboard regime separation:** SHADOW replay and AUTO PAPER performance are selected separately and compared explicitly. They are not pooled into the default expectancy statistic. Lifecycle funnels count one profile/session/universe/instrument lifecycle and advance only on proven deterministic stages.\n- **Risk history:** equity/risk snapshots are emitted when protection state or stop levels change, not only when balances/positions mutate.\n\nThe paper strategy dashboard is therefore an evidence console for prospective promotion and implementation-loss measurement; it is not a generic brokerage performance screen and historical/reconstructed results remain research evidence rather than a profitability guarantee.\n'''
          if '## Completion and correctness amendments — 2026-08-24' not in text:
              write(path, text + amendment)

          # ------------------------------------------------------------------
          # 9) Repair the known one-character V3 workflow corruption and retire
          #    its repair-only duplicate.
          # ------------------------------------------------------------------
          precision = ROOT / '.github/workflows/trading-v3-recovery-precision-search.yml'
          workflow = precision.read_text(encoding='utf-8')
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', workflow)
          if match is None:
              raise SystemExit('precision payload not found')
          payload = match.group(1)
          fixed = payload[:3382] + payload[3383:]
          source = gzip.decompress(base64.b64decode(fixed, validate=True))
          expected = '5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607'
          if hashlib.sha256(source).hexdigest() != expected:
              raise SystemExit('precision workflow recovery fingerprint mismatch')
          precision.write_text(workflow[:match.start(1)] + fixed + workflow[match.end(1):], encoding='utf-8')
          repair = ROOT / '.github/workflows/trading-v3-recovery-precision-search-repair.yml'
          if repair.exists():
              repair.unlink()

          PYCODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install

      - name: Run focused correctness tests
        run: |
          python -m py_compile src/app/trading/strategy_monitor.py src/app/trading/strategy_repository.py src/app/trading/catalyst_evidence.py src/app/trading/paper_analytics.py
          python -m pytest -q \
            src/tests/trading/test_trading_roadmap_completion.py \
            src/tests/trading/test_trading_paper_analytics.py \
            src/tests/trading/test_trading_catalyst_discovery.py

      - name: Generate exact shared gateway contract
        run: npm --workspace @omnix/web run api:generate

      - name: Commit final implementation without this workflow
        shell: bash
        run: |
          rm .github/workflows/trading-roadmap-completion-sync.yml
          git fetch origin agent/trading-auto-strategy-roadmap
          test "$(git rev-parse origin/agent/trading-auto-strategy-roadmap)" = "${GITHUB_SHA}"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(trading): close roadmap correctness gaps"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
