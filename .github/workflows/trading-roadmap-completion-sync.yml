name: Trading roadmap completion sync

on:
  push:
    branches: [agent/trading-auto-strategy-roadmap]
    paths:
      - ".github/workflows/trading-roadmap-completion-sync.yml"

permissions:
  contents: write

jobs:
  apply-roadmap-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse to publish over a newer branch head
        shell: bash
        run: |
          git fetch origin agent/trading-auto-strategy-roadmap
          test "$(git rev-parse origin/agent/trading-auto-strategy-roadmap)" = "${GITHUB_SHA}"

      - name: Apply completion fixes
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re
          import textwrap

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f'expected patch context missing: {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # 1) AUTO PAPER / backtest parity + durable trade excursion evidence.
          # ------------------------------------------------------------------
          path = 'src/app/trading/strategy_monitor.py'
          replace_once(
              path,
              'from .gapper_dataset import GapperCandidate\nfrom .paper import PaperMarketObservation, PaperOrderRequest, paper_protection_trigger\n',
              'from .gapper_dataset import GapperCandidate\nfrom .indicators.engine import relative_strength_index\nfrom .paper import PaperMarketObservation, PaperOrderRequest, paper_protection_trigger\n',
          )
          anchor = '''def _paper_observation(execution) -> PaperMarketObservation:\n    return PaperMarketObservation(\n        instrument_id=execution.instrument_id,\n        binding_id=execution.binding_id,\n        provider=execution.provider,\n        price=execution.last,\n        bid=execution.bid,\n        ask=execution.ask,\n        bid_size=execution.bid_size,\n        ask_size=execution.ask_size,\n        high=execution.high,\n        low=execution.low,\n        volume=execution.bar_volume,\n        bar_start_time=execution.bar_start_time,\n        source_time=execution.source_time,\n        evaluated_at=datetime.now(timezone.utc),\n        execution_eligible=execution.execution_eligible,\n        freshness_mode=execution.freshness_mode,\n        rejection_reasons=execution.rejection_reasons,\n        halted=execution.halted is True,\n    )\n\n\n'''
          helpers = anchor + '''_BASIC_MARKET_REJECTIONS = {\n    "GAP_BELOW_MINIMUM",\n    "PRICE_OUT_OF_RANGE",\n    "PREMARKET_DOLLAR_VOLUME_LOW",\n    "TOD_RVOL_MISSING",\n    "TOD_RVOL_LOW",\n    "SPREAD_MISSING",\n    "SPREAD_TOO_WIDE",\n}\n_RESEARCH_SUPPLY_REJECTIONS = {\n    "CATALYST_EVIDENCE_REQUIRED",\n    "DILUTION_SUPPLY_RISK",\n    "FLOAT_OUTSIDE_REQUIRED_RANGE",\n}\n\n\ndef _candidate_lifecycle_stage(result: GapPullbackResult) -> int:\n    \"\"\"Highest lifecycle rank actually proven by this causal evaluation.\"\"\"\n    transitions = set(result.transitions)\n    if result.state == "entry_ready":\n        return 4\n    if "higher_low_confirmed" in transitions or result.state in {\n        "higher_low_confirmed", "vwap_reclaim", "lower_high_break", "breakout_hold"\n    }:\n        return 3\n    if result.reason_code in _BASIC_MARKET_REJECTIONS:\n        return 0\n    if result.reason_code in _RESEARCH_SUPPLY_REJECTIONS:\n        return 1\n    if "qualified_gap" in transitions or result.state not in {"discovered", "rejected"}:\n        return 2\n    return 0\n\n\ndef _rsi_crossed_after_activation(\n    bars,\n    *,\n    period: int,\n    threshold: Decimal,\n    activated_at: datetime,\n    observed_at: datetime,\n) -> bool:\n    \"\"\"Return true when any finalized post-entry bar confirms the configured RSI cross.\n\n    RSI values use the same shared indicator implementation as the portfolio\n    backtester. Looking across all bars since activation prevents a 30-second\n    monitor from missing a cross that occurred between polling cycles.\n    \"\"\"\n    session_date = activated_at.astimezone(_ET).date()\n    finalized = sorted(\n        (\n            bar for bar in bars\n            if bar.is_final\n            and bar.end_time <= observed_at\n            and bar.start_time.astimezone(_ET).date() == session_date\n        ),\n        key=lambda bar: bar.start_time,\n    )\n    values = relative_strength_index([bar.close for bar in finalized], period)\n    for index in range(1, len(values)):\n        bar_index = period + index\n        if bar_index >= len(finalized) or finalized[bar_index].end_time <= activated_at:\n            continue\n        if values[index - 1] >= threshold and values[index] < threshold:\n            return True\n    return False\n\n\n'''
          replace_once(path, anchor, helpers)

          replace_once(
              path,
              '''                    "features": result.features.model_dump(mode="json"),\n                    "transitions": list(result.transitions),\n                    "mode": config.mode,\n                    "universe_id": universe.universe_id,\n''',
              '''                    "features": result.features.model_dump(mode="json"),\n                    "transitions": list(result.transitions),\n                    "lifecycle_stage": _candidate_lifecycle_stage(result),\n                    "strategy_version": config.config.strategy_version,\n                    "profile_fingerprint": (\n                        v2_profile_fingerprint(config.config)\n                        if config.config.strategy_version == "2.0.0"\n                        else config.config.strategy_version\n                    ),\n                    "mode": config.mode,\n                    "universe_id": universe.universe_id,\n''',
          )

          replace_once(
              path,
              '''                        activated_at = entry_order.updated_at or entry_order.created_at or datetime.now(timezone.utc)\n                        if config.config.strategy_version == "2.0.0":\n                            fill_price = entry_order.average_fill_price\n                            if fill_price is None:\n''',
              '''                        activated_at = entry_order.updated_at or entry_order.created_at or datetime.now(timezone.utc)\n                        fill_price = entry_order.average_fill_price\n                        if protection.initial_stop_price is None:\n                            protection.initial_stop_price = protection.stop_price\n                        if fill_price is not None:\n                            protection.mae_price = fill_price if protection.mae_price is None else min(protection.mae_price, fill_price)\n                            protection.mfe_price = fill_price if protection.mfe_price is None else max(protection.mfe_price, fill_price)\n                        if config.config.strategy_version == "2.0.0":\n                            if fill_price is None:\n''',
          )
          replace_once(
              path,
              '''                            # Match the V11 backtester: keep the structural L2 stop,\n                            # but anchor R/target to the actual pessimistic fill.\n                            protection.target_price = levels.target_price\n                        protection.status = "active"\n''',
              '''                            # Match the V11 backtester: keep the structural L2 stop,\n                            # but anchor R/target to the actual pessimistic fill.\n                            protection.target_price = levels.target_price\n                            protection.initial_target_price = levels.target_price\n                        elif protection.initial_target_price is None:\n                            protection.initial_target_price = protection.target_price\n                        protection.status = "active"\n''',
          )
          replace_once(
              path,
              '''                    initial_stop = v2_initial_stop_from_target(\n                        config.config,\n                        entry_price=entry_price,\n                        target_price=protection.target_price,\n                    )\n''',
              '''                    initial_stop = protection.initial_stop_price or v2_initial_stop_from_target(\n                        config.config,\n                        entry_price=entry_price,\n                        target_price=protection.target_price,\n                    )\n''',
          )

          replace_once(
              path,
              '''            trigger = None\n            activated_at = None\n            if entry_order is not None:\n                activated_at = entry_order.updated_at or entry_order.created_at\n\n            if (\n''',
              '''            trigger = None\n            activated_at = None\n            if entry_order is not None:\n                activated_at = entry_order.updated_at or entry_order.created_at\n\n            if activated_at is not None and entry_order is not None and entry_order.average_fill_price is not None:\n                mark = execution.last or execution.bid or execution.ask\n                if mark is not None:\n                    range_is_post_entry = (\n                        execution.bar_start_time is not None\n                        and execution.bar_start_time >= activated_at\n                    )\n                    observed_low = execution.low if range_is_post_entry and execution.low is not None else mark\n                    observed_high = execution.high if range_is_post_entry and execution.high is not None else mark\n                    next_mae = observed_low if protection.mae_price is None else min(protection.mae_price, observed_low)\n                    next_mfe = observed_high if protection.mfe_price is None else max(protection.mfe_price, observed_high)\n                    if next_mae != protection.mae_price or next_mfe != protection.mfe_price:\n                        protection.mae_price = next_mae\n                        protection.mfe_price = next_mfe\n                        protection = await asyncio.to_thread(strategy_repository.save_protection, protection)\n\n            if (\n''',
          )

          old_trigger = '''                if trigger_kind == "stop":\n                    trigger = "protective_stop"\n                elif trigger_kind == "target":\n                    trigger = "profit_target"\n                elif (\n                    config.config.strategy_version == "2.0.0"\n                    and activated_at is not None\n                    and v2_hold_expired(\n                        config.config,\n                        activated_at=activated_at,\n                        observed_at=execution.source_time,\n                    )\n                ):\n                    trigger = "max_hold"\n                elif force_flat:\n                    trigger = "force_flat"\n'''
          new_trigger = '''                if trigger_kind == "stop":\n                    trigger = "protective_stop"\n                elif trigger_kind == "target":\n                    trigger = "profit_target"\n\n                if trigger is None and activated_at is not None:\n                    try:\n                        indicator_response = await asyncio.to_thread(\n                            market_service.bars,\n                            protection.instrument_id,\n                            config.config.execution_interval,\n                            240,\n                            binding_id,\n                        )\n                        if _rsi_crossed_after_activation(\n                            indicator_response.bars,\n                            period=config.config.exit_rsi_period,\n                            threshold=config.config.exit_rsi_threshold,\n                            activated_at=activated_at,\n                            observed_at=execution.source_time,\n                        ):\n                            trigger = "rsi"\n                    except Exception as exc:\n                        # Indicator refresh is diagnostic/fail-safe only: static\n                        # stop/target and force-flat protection remain authoritative.\n                        self.last_error = f"protection_rsi: {type(exc).__name__}: {exc}"\n                        trade_log(\n                            "auto_trading",\n                            "protection_rsi_error",\n                            run_id=self.current_run_id,\n                            strategy_id=config.strategy_id,\n                            instrument_id=protection.instrument_id,\n                            error_type=type(exc).__name__,\n                            detail=str(exc),\n                        )\n\n                if (\n                    trigger is None\n                    and config.config.strategy_version == "2.0.0"\n                    and activated_at is not None\n                    and v2_hold_expired(\n                        config.config,\n                        activated_at=activated_at,\n                        observed_at=execution.source_time,\n                    )\n                ):\n                    trigger = "max_hold"\n                elif trigger is None and force_flat:\n                    trigger = "force_flat"\n'''
          replace_once(path, old_trigger, new_trigger)

          replace_once(
              path,
              '''                stop_price=result.signal.stop_price,\n                target_price=result.signal.target_price,\n                quantity=decision.quantity,\n''',
              '''                stop_price=result.signal.stop_price,\n                target_price=result.signal.target_price,\n                initial_stop_price=result.signal.stop_price,\n                initial_target_price=(\n                    None if config.config.strategy_version == "2.0.0"\n                    else result.signal.target_price\n                ),\n                quantity=decision.quantity,\n''',
          )

          # ------------------------------------------------------------------
          # 2) Strategy soft archive + immutable initial risk/extrema fields.
          # ------------------------------------------------------------------
          path = 'src/app/trading/strategy_repository.py'
          replace_once(
              path,
              '    enabled: bool = True\n    revision: int = Field(default=1, ge=1)\n',
              '    enabled: bool = True\n    archived_at: datetime | None = None\n    archived_reason: str | None = None\n    revision: int = Field(default=1, ge=1)\n',
          )
          replace_once(
              path,
              '''    stop_price: Decimal = Field(gt=0)\n    target_price: Decimal = Field(gt=0)\n    quantity: Decimal = Field(gt=0)\n''',
              '''    stop_price: Decimal = Field(gt=0)\n    target_price: Decimal = Field(gt=0)\n    initial_stop_price: Decimal | None = Field(default=None, gt=0)\n    initial_target_price: Decimal | None = Field(default=None, gt=0)\n    mae_price: Decimal | None = Field(default=None, gt=0)\n    mfe_price: Decimal | None = Field(default=None, gt=0)\n    quantity: Decimal = Field(gt=0)\n''',
          )
          replace_once(
              path,
              '''        enabled=bool(row[8]),\n        revision=int(row[9]),\n        created_at=row[10],\n        updated_at=row[11],\n''',
              '''        enabled=bool(row[8]),\n        archived_at=row[9],\n        archived_reason=str(row[10]) if row[10] is not None else None,\n        revision=int(row[11]),\n        created_at=row[12],\n        updated_at=row[13],\n''',
          )
          replace_once(
              path,
              '''        stop_price=Decimal(row[6]),\n        target_price=Decimal(row[7]),\n        quantity=Decimal(row[8]),\n        status=str(row[9]),\n        trigger_reason=str(row[10]) if row[10] is not None else None,\n        revision=int(row[11]),\n        created_at=row[12],\n        updated_at=row[13],\n''',
              '''        stop_price=Decimal(row[6]),\n        target_price=Decimal(row[7]),\n        initial_stop_price=Decimal(row[8]) if row[8] is not None else None,\n        initial_target_price=Decimal(row[9]) if row[9] is not None else None,\n        mae_price=Decimal(row[10]) if row[10] is not None else None,\n        mfe_price=Decimal(row[11]) if row[11] is not None else None,\n        quantity=Decimal(row[12]),\n        status=str(row[13]),\n        trigger_reason=str(row[14]) if row[14] is not None else None,\n        revision=int(row[15]),\n        created_at=row[16],\n        updated_at=row[17],\n''',
          )
          replace_once(
              path,
              '''strategy_id, account_id, strategy_kind, strategy_version, mode,\nactive_universe_id, config, risk, enabled, revision, created_at, updated_at\n''',
              '''strategy_id, account_id, strategy_kind, strategy_version, mode,\nactive_universe_id, config, risk, enabled, archived_at, archived_reason,\nrevision, created_at, updated_at\n''',
          )
          replace_once(
              path,
              '''strategy_id, protection_id, account_id, instrument_id, entry_order_id,\nexit_order_id, stop_price, target_price, quantity, status, trigger_reason,\nrevision, created_at, updated_at\n''',
              '''strategy_id, protection_id, account_id, instrument_id, entry_order_id,\nexit_order_id, stop_price, target_price, initial_stop_price, initial_target_price,\nmae_price, mfe_price, quantity, status, trigger_reason, revision, created_at, updated_at\n''',
          )
          replace_once(
              path,
              '''        if strategy_id != document.strategy_id:\n            raise ValueError("strategy_id_mismatch")\n        with self.uow_factory() as uow:\n''',
              '''        if strategy_id != document.strategy_id:\n            raise ValueError("strategy_id_mismatch")\n        if document.archived_at is not None:\n            raise ValueError("archived_strategy_is_read_only")\n        with self.uow_factory() as uow:\n''',
          )
          replace_once(
              path,
              '''                 WHERE workspace_id = %s AND strategy_id = %s AND revision = %s\n                RETURNING {_CONFIG_COLUMNS}\n''',
              '''                 WHERE workspace_id = %s AND strategy_id = %s AND revision = %s\n                   AND archived_at IS NULL\n                RETURNING {_CONFIG_COLUMNS}\n''',
          )

          text = read(path)
          archive_pattern = re.compile(r'    def delete_config\(self, strategy_id: str, \*, expected_revision: int\) -> None:\n.*?\n    def list_configs\(', re.S)
          archive_replacement = '''    def delete_config(self, strategy_id: str, *, expected_revision: int) -> None:\n        \"\"\"Soft-archive a safely stopped strategy without deleting evidence.\"\"\"\n\n        with self.uow_factory() as uow:\n            row = uow.connection.execute(\n                \"\"\"\n                SELECT mode, revision, archived_at\n                  FROM omnix_trading_strategy_configs\n                 WHERE workspace_id = %s AND strategy_id = %s\n                 FOR UPDATE\n                \"\"\",\n                (self.context.workspace_id, strategy_id),\n            ).fetchone()\n            if row is None:\n                raise ValueError("strategy_config_not_found")\n            if int(row[1]) != expected_revision:\n                raise RevisionConflict("stale trading strategy configuration")\n            if row[2] is not None:\n                raise ValueError("strategy_already_archived")\n            if str(row[0]) == "auto_paper":\n                raise ValueError("disable_auto_paper_before_archive")\n            active = uow.connection.execute(\n                \"\"\"\n                SELECT COUNT(*)\n                  FROM omnix_trading_strategy_protections\n                 WHERE workspace_id = %s AND strategy_id = %s\n                   AND status IN ('pending_entry', 'active', 'exit_submitted')\n                \"\"\",\n                (self.context.workspace_id, strategy_id),\n            ).fetchone()\n            if active is not None and int(active[0]) > 0:\n                raise ValueError("close_strategy_protections_before_archive")\n            archived = uow.connection.execute(\n                \"\"\"\n                UPDATE omnix_trading_strategy_configs\n                   SET mode = 'off', enabled = FALSE,\n                       archived_at = CURRENT_TIMESTAMP,\n                       archived_reason = 'operator_archive',\n                       revision = revision + 1, updated_at = CURRENT_TIMESTAMP\n                 WHERE workspace_id = %s AND strategy_id = %s\n                   AND revision = %s AND archived_at IS NULL\n                RETURNING strategy_id\n                \"\"\",\n                (self.context.workspace_id, strategy_id, expected_revision),\n            ).fetchone()\n            if archived is None:\n                raise RevisionConflict("stale trading strategy configuration")\n            uow.commit()\n\n    def list_configs('''
          text, count = archive_pattern.subn(archive_replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not replace delete_config with soft archive')
          write(path, text)
          replace_once(
              path,
              '''        predicate = "AND enabled = TRUE AND mode <> 'off'" if active_only else ""\n''',
              '''        predicate = "AND archived_at IS NULL AND enabled = TRUE AND mode <> 'off'" if active_only else ""\n''',
          )
          replace_once(
              path,
              '''                 ORDER BY updated_at DESC, strategy_id\n''',
              '''                 ORDER BY (archived_at IS NOT NULL), updated_at DESC, strategy_id\n''',
          )

          text = read(path)
          save_pattern = re.compile(r'    def save_protection\(self, protection: StrategyProtection\) -> StrategyProtection:\n.*?\n    def list_protections\(', re.S)
          save_replacement = '''    def save_protection(self, protection: StrategyProtection) -> StrategyProtection:\n        with self.uow_factory() as uow:\n            row = uow.connection.execute(\n                f\"\"\"\n                INSERT INTO omnix_trading_strategy_protections (\n                    workspace_id, strategy_id, protection_id, account_id,\n                    instrument_id, entry_order_id, exit_order_id, stop_price,\n                    target_price, initial_stop_price, initial_target_price,\n                    mae_price, mfe_price, quantity, status, trigger_reason\n                ) VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)\n                ON CONFLICT (workspace_id, strategy_id, entry_order_id) DO UPDATE\n                   SET exit_order_id = EXCLUDED.exit_order_id,\n                       stop_price = EXCLUDED.stop_price,\n                       target_price = EXCLUDED.target_price,\n                       initial_stop_price = COALESCE(omnix_trading_strategy_protections.initial_stop_price, EXCLUDED.initial_stop_price),\n                       initial_target_price = COALESCE(EXCLUDED.initial_target_price, omnix_trading_strategy_protections.initial_target_price),\n                       mae_price = EXCLUDED.mae_price,\n                       mfe_price = EXCLUDED.mfe_price,\n                       quantity = EXCLUDED.quantity,\n                       status = EXCLUDED.status,\n                       trigger_reason = EXCLUDED.trigger_reason,\n                       revision = omnix_trading_strategy_protections.revision + 1,\n                       updated_at = CURRENT_TIMESTAMP\n                RETURNING {_PROTECTION_COLUMNS}\n                \"\"\",\n                (\n                    self.context.workspace_id,\n                    protection.strategy_id,\n                    protection.protection_id,\n                    protection.account_id,\n                    protection.instrument_id,\n                    protection.entry_order_id,\n                    protection.exit_order_id,\n                    protection.stop_price,\n                    protection.target_price,\n                    protection.initial_stop_price,\n                    protection.initial_target_price,\n                    protection.mae_price,\n                    protection.mfe_price,\n                    protection.quantity,\n                    protection.status,\n                    protection.trigger_reason,\n                ),\n            ).fetchone()\n            uow.commit()\n        saved = _protection(row)\n        trade_log(\n            "auto_trading",\n            "protection_saved",\n            strategy_id=saved.strategy_id,\n            protection_id=saved.protection_id,\n            account_id=saved.account_id,\n            instrument_id=saved.instrument_id,\n            entry_order_id=saved.entry_order_id,\n            exit_order_id=saved.exit_order_id,\n            stop_price=saved.stop_price,\n            target_price=saved.target_price,\n            initial_stop_price=saved.initial_stop_price,\n            initial_target_price=saved.initial_target_price,\n            mae_price=saved.mae_price,\n            mfe_price=saved.mfe_price,\n            quantity=saved.quantity,\n            status=saved.status,\n            trigger_reason=saved.trigger_reason,\n            revision=saved.revision,\n            created_at=saved.created_at,\n            updated_at=saved.updated_at,\n        )\n        return saved\n\n    def list_protections('''
          text, count = save_pattern.subn(save_replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not replace save_protection')
          write(path, text)

          # ------------------------------------------------------------------
          # 3) State-aware typed supply evidence. Unknown/terminated facilities
          #    are research evidence, not deterministic hard-veto flags.
          # ------------------------------------------------------------------
          write('src/app/trading/catalyst_evidence.py', '''from __future__ import annotations\n\nimport hashlib\nimport json\nimport re\nfrom datetime import datetime, timezone\nfrom typing import Literal, Protocol\n\nfrom pydantic import BaseModel, ConfigDict, Field, field_validator\n\n\nCatalystSourceType = Literal["sec", "company", "news", "manual"]\nSupplyType = Literal[\n    "registered_offering", "atm", "warrants", "convertible",\n    "shelf_registration", "resale_registration", "equity_line",\n]\nSupplyStatus = Literal[\n    "active", "terminated", "exhausted", "expired", "redeemed",\n    "withdrawn", "unknown",\n]\n\n\nclass CatalystSupplyFact(BaseModel):\n    model_config = ConfigDict(extra="forbid", frozen=True)\n\n    supply_type: SupplyType\n    status: SupplyStatus = "unknown"\n    resolution_status: Literal["resolved", "unresolved"] = "unresolved"\n    source_excerpt: str = ""\n\n\nclass CatalystEvidence(BaseModel):\n    \"\"\"Timestamped immutable evidence; never a naked bullish/bearish flag.\"\"\"\n\n    model_config = ConfigDict(extra="forbid", frozen=True)\n\n    evidence_id: str\n    instrument_id: str\n    source_type: CatalystSourceType\n    source_locator: str\n    published_at: datetime\n    captured_at: datetime\n    headline: str | None = None\n    content: str = Field(min_length=1, max_length=100_000)\n    text_hash: str = Field(min_length=64, max_length=64)\n    facts: dict[str, object] = Field(default_factory=dict)\n    dilution_flags: tuple[str, ...] = ()\n    immutable_fingerprint: str = Field(min_length=64, max_length=64)\n\n    @field_validator("published_at", "captured_at")\n    @classmethod\n    def aware(cls, value: datetime) -> datetime:\n        if value.tzinfo is None:\n            raise ValueError("catalyst evidence timestamps must be timezone-aware")\n        return value.astimezone(timezone.utc)\n\n    @field_validator("content")\n    @classmethod\n    def content_matches_normalized_form(cls, value: str) -> str:\n        normalized = " ".join(value.split())\n        if not normalized:\n            raise ValueError("catalyst evidence content cannot be empty")\n        return normalized\n\n\nclass CatalystShadowClassification(BaseModel):\n    \"\"\"Read-only classifier output. It is not an execution authorization.\"\"\"\n\n    model_config = ConfigDict(extra="forbid", frozen=True)\n\n    classifier_id: str\n    classifier_version: str\n    catalyst_class: Literal[\n        "earnings", "regulatory", "contract_partnership", "financing",\n        "corporate_action", "clinical", "legal", "other", "unknown",\n    ] = "unknown"\n    directional_bias: Literal["positive", "negative", "mixed", "unknown"] = "unknown"\n    novelty: Literal["new", "recycled", "unclear"] = "unclear"\n    dilution_risk: Literal["none_seen", "possible", "explicit", "unknown"] = "unknown"\n    confidence: float = Field(default=0.0, ge=0, le=1)\n    evidence_ids: tuple[str, ...]\n    rationale: str = ""\n    shadow_only: Literal[True] = True\n\n\nclass CatalystClassifier(Protocol):\n    def classify(self, evidence: tuple[CatalystEvidence, ...]) -> CatalystShadowClassification: ...\n\n\n_SUPPLY_PATTERNS: tuple[tuple[SupplyType, re.Pattern[str]], ...] = (\n    ("registered_offering", re.compile(r"\\b(registered direct|public offering|securities offering)\\b", re.I)),\n    ("atm", re.compile(r"\\b(?:at[- ]the[- ]market|ATM (?:offering|program|facility|sales agreement))\\b", re.I)),\n    ("warrants", re.compile(r"\\bwarrants?\\b", re.I)),\n    ("convertible", re.compile(r"\\bconvertible (?:note|notes|debt|preferred|securities)\\b", re.I)),\n    ("shelf_registration", re.compile(r"\\bshelf (?:registration|offering)\\b", re.I)),\n    ("resale_registration", re.compile(r"\\b(?:resale registration|selling stockholders?|resale prospectus)\\b", re.I)),\n    ("equity_line", re.compile(r"\\b(?:equity line|equity purchase agreement)\\b", re.I)),\n)\n_TERMINATED = re.compile(r"\\b(?:terminated|cancelled|canceled|ended|no longer available|closed)\\b", re.I)\n_EXHAUSTED = re.compile(r"\\b(?:exhausted|fully utilized|fully used|all outstanding warrants? (?:have been |were )?exercised|paid in full)\\b", re.I)\n_EXPIRED = re.compile(r"\\bexpired\\b", re.I)\n_REDEEMED = re.compile(r"\\bredeemed\\b", re.I)\n_WITHDRAWN = re.compile(r"\\bwithdrawn\\b", re.I)\n_ACTIVE = re.compile(\n    r"\\b(?:active|remains? available|outstanding|effective|may sell|may issue|may offer|"\n    r"entered into|enters? into|commenced|launched|currently available)\\b",\n    re.I,\n)\n\n\ndef _status(statement: str) -> tuple[SupplyStatus, str]:\n    if _EXHAUSTED.search(statement):\n        return "exhausted", "resolved"\n    if _WITHDRAWN.search(statement):\n        return "withdrawn", "resolved"\n    if _REDEEMED.search(statement):\n        return "redeemed", "resolved"\n    if _EXPIRED.search(statement):\n        return "expired", "resolved"\n    if _TERMINATED.search(statement):\n        return "terminated", "resolved"\n    if _ACTIVE.search(statement):\n        return "active", "resolved"\n    return "unknown", "unresolved"\n\n\ndef supply_facts(text: str) -> tuple[CatalystSupplyFact, ...]:\n    output: list[CatalystSupplyFact] = []\n    statements = [part.strip() for part in re.split(r"(?<=[.!?;])\\s+|\\n+", text) if part.strip()]\n    for statement in statements:\n        for supply_type, pattern in _SUPPLY_PATTERNS:\n            if not pattern.search(statement):\n                continue\n            status, resolution = _status(statement)\n            output.append(CatalystSupplyFact(\n                supply_type=supply_type,\n                status=status,\n                resolution_status=resolution,\n                source_excerpt=statement[:500],\n            ))\n    unique: dict[tuple[str, str, str], CatalystSupplyFact] = {}\n    for fact in output:\n        unique[(fact.supply_type, fact.status, fact.source_excerpt)] = fact\n    return tuple(unique.values())\n\n\ndef dilution_flags(text: str) -> tuple[str, ...]:\n    \"\"\"Only resolved active supply states are deterministic hard-veto flags.\"\"\"\n    return tuple(sorted({fact.supply_type for fact in supply_facts(text) if fact.status == "active"}))\n\n\ndef _provided_supply_facts(facts: dict[str, object]) -> tuple[CatalystSupplyFact, ...] | None:\n    raw = facts.get("supply_facts")\n    if raw is None:\n        return None\n    if not isinstance(raw, (list, tuple)):\n        raise ValueError("facts.supply_facts must be a list")\n    normalized = []\n    for item in raw:\n        if not isinstance(item, dict):\n            raise ValueError("facts.supply_facts items must be objects")\n        payload = dict(item)\n        if payload.get("supply_type") == "warrant":\n            payload["supply_type"] = "warrants"\n        normalized.append(CatalystSupplyFact.model_validate(payload))\n    return tuple(normalized)\n\n\ndef capture_catalyst_evidence(\n    *,\n    evidence_id: str,\n    instrument_id: str,\n    source_type: CatalystSourceType,\n    source_locator: str,\n    published_at: datetime,\n    raw_text: str,\n    headline: str | None = None,\n    captured_at: datetime | None = None,\n    facts: dict[str, object] | None = None,\n) -> CatalystEvidence:\n    captured = captured_at or datetime.now(timezone.utc)\n    normalized = " ".join(raw_text.split())\n    if not normalized:\n        raise ValueError("catalyst evidence content cannot be empty")\n    text_hash = hashlib.sha256(normalized.encode("utf-8")).hexdigest()\n    fact_payload = dict(facts or {})\n    typed_supply = _provided_supply_facts(fact_payload)\n    if typed_supply is None:\n        typed_supply = supply_facts(normalized)\n    fact_payload["supply_facts"] = [item.model_dump(mode="json") for item in typed_supply]\n    flags = tuple(sorted({item.supply_type for item in typed_supply if item.status == "active"}))\n    payload = {\n        "evidence_id": evidence_id,\n        "instrument_id": instrument_id,\n        "source_type": source_type,\n        "source_locator": source_locator,\n        "published_at": published_at.astimezone(timezone.utc).isoformat(),\n        "captured_at": captured.astimezone(timezone.utc).isoformat(),\n        "headline": headline,\n        "content": normalized,\n        "text_hash": text_hash,\n        "facts": fact_payload,\n        "dilution_flags": flags,\n    }\n    fingerprint_payload = {**payload, "content": None}\n    fingerprint = hashlib.sha256(\n        json.dumps(fingerprint_payload, sort_keys=True, separators=(",", ":"), default=str).encode("utf-8")\n    ).hexdigest()\n    return CatalystEvidence(**payload, immutable_fingerprint=fingerprint)\n\n\ndef classify_catalyst_shadow(\n    evidence: list[CatalystEvidence] | tuple[CatalystEvidence, ...],\n    classifier: CatalystClassifier,\n) -> CatalystShadowClassification:\n    \"\"\"Invoke an LLM/deterministic classifier strictly as a shadow annotation.\"\"\"\n    frozen = tuple(sorted(evidence, key=lambda item: (item.published_at, item.evidence_id)))\n    output = classifier.classify(frozen)\n    expected_ids = tuple(item.evidence_id for item in frozen)\n    if tuple(sorted(output.evidence_ids)) != tuple(sorted(expected_ids)):\n        raise ValueError("catalyst classifier must cite exactly the supplied evidence ids")\n    if output.shadow_only is not True:\n        raise ValueError("catalyst classifier output must remain shadow-only")\n    return output\n''')

