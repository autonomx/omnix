name: Trading V3 recovery leg risk geometry

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trading-v3-recovery-leg-risk.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Restore exact Oct-Feb causal cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trading-liquidity-datasets
          key: trading-liquidity-datasets-v2-causal-Linux-extended-32621017259-1
          fail-on-cache-miss: true

      - name: Recover frozen recovery-selector source
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, re
          from pathlib import Path
          expected = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          text = Path(".github/workflows/trading-v3-recovery-precision-search.yml").read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', text)
          if match is None:
              raise SystemExit("embedded selector payload not found")
          payload = match.group(1)
          for index in range(-1, len(payload)):
              candidate = payload if index < 0 else payload[:index] + payload[index + 1:]
              try:
                  source = gzip.decompress(base64.b64decode(candidate, validate=True))
              except Exception:
                  continue
              if hashlib.sha256(source).hexdigest() == expected:
                  Path("/tmp/recovery_selector.py").write_bytes(source)
                  print(f"Recovered exact selector source sha256={expected}")
                  break
          else:
              raise SystemExit("exact selector source fingerprint not recoverable")
          PYCODE
          python -m py_compile /tmp/recovery_selector.py

      - name: Run recovery-leg risk study
        shell: bash
        run: |
          python - <<'PYCODE'
          import importlib.util
          import json
          import sys
          from datetime import date, time
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import app.trading.strategy_backtest as strategy_backtest
          from app.trading.strategy_v2_qualification import frozen_v2_config
          from scripts.run_trading_strategy_backtest import strict_v11_strategy
          from scripts.run_trading_strategy_liquidity_sweep import _cache_namespace
          from scripts.run_trading_strategy_v2_extended_exploration import _load_block, _run_variant

          ET = ZoneInfo("America/New_York")
          SOURCE_SHA = "5c98837cc96ad7c692d45b0bafff6a025f04f52599985cc6e85af734f6917607"
          spec = importlib.util.spec_from_file_location("recovery_selector", "/tmp/recovery_selector.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          rule = module.Rule((
              module.Predicate("rebound>=20", "recovery", "recovery_pct", ">=", 20),
              module.Predicate("retrace>=80", "retracement", "retracement_pct", ">=", 80),
              module.Predicate("selloff>=15", "selloff", "selloff_pct", ">=", 15),
              module.Predicate("vol5x>=1.5", "volume_ratio", "volume_ratio5", ">=", 1.5),
          ))
          base_evaluator = module._evaluator_for(rule)

          def recovery_trough(bars):
              opening = [bar for bar in bars if time(9,30) <= bar.end_time.astimezone(ET).time() <= time(9,45)]
              if not opening:
                  return None
              opening_high = max(bar.high for bar in opening)
              high_index = next((i for i, bar in enumerate(bars) if bar in opening and bar.high == opening_high), None)
              if high_index is None or high_index + 1 >= len(bars):
                  return None
              lows = [bar.low for bar in bars[high_index + 1:]]
              return min(lows) if lows else None

          def evaluator_with_recovery_stop(retention):
              def evaluate(candidate, bars, config):
                  result = base_evaluator(candidate, bars, config)
                  if result.state != "entry_ready" or result.signal is None:
                      return result
                  trough = recovery_trough(bars)
                  signal_close = bars[-1].close if bars else None
                  if trough is None or signal_close is None or signal_close <= trough:
                      return result.model_copy(update={"state": "rejected", "reason_code": "RECOVERY_STOP_UNAVAILABLE", "signal": None})
                  stop = trough + (signal_close - trough) * retention
                  if stop >= result.signal.entry_price:
                      return result.model_copy(update={"state": "rejected", "reason_code": "RECOVERY_STOP_INVALID", "signal": None})
                  risk = result.signal.entry_price - stop
                  signal = result.signal.model_copy(update={
                      "stop_price": stop,
                      "risk_per_share": risk,
                      "target_price": result.signal.entry_price + risk * config.reward_multiple,
                  })
                  return result.model_copy(update={"signal": signal})
              return evaluate

          spread = Decimal("150")
          initial_cash = Decimal("100000")
          basis = strict_v11_strategy(minimum_premarket_dollar_volume=Decimal("100000"))
          namespace, _ = _cache_namespace(basis, spread)
          datasets, coverage = _load_block(Path(".cache/trading-liquidity-datasets") / namespace, date(2025,10,1), date(2026,2,27))
          if int(coverage["covered_sessions"]) != int(coverage["requested_sessions"]):
              raise SystemExit("complete Oct-Feb cache required")

          config = frozen_v2_config().model_copy(update={"reward_multiple": Decimal("1.0")})
          original_rsi = strategy_backtest.relative_strength_index
          strategy_backtest.relative_strength_index = lambda values, period: [Decimal("0")] * max(0, len(values) - int(period))
          variants = []
          try:
              experiments = [
                  ("latest5_stop_no_rsi", base_evaluator, None),
                  ("recovery_leg_retain_50", evaluator_with_recovery_stop(Decimal("0.50")), Decimal("0.50")),
                  ("recovery_leg_retain_60", evaluator_with_recovery_stop(Decimal("0.60")), Decimal("0.60")),
                  ("recovery_leg_retain_70", evaluator_with_recovery_stop(Decimal("0.70")), Decimal("0.70")),
              ]
              for variant_id, evaluator, retention in experiments:
                  with module._research_evaluator(evaluator):
                      run = _run_variant(datasets, config, initial_cash=initial_cash, spread=spread)
                  metrics = module._trade_metrics(run)
                  count = int(metrics.get("trade_count") or 0)
                  win = float(metrics.get("win_rate") or 0)
                  exp = float(metrics.get("expectancy_r") or -999)
                  lcb = float(metrics.get("one_sided_90_lcb_r") or -999)
                  dd = float(metrics.get("max_drawdown_r") or 999)
                  gate = count >= 20 and win >= 0.75 and exp >= 0.20 and lcb > 0 and dd <= 5
                  variants.append({
                      "variant_id": variant_id,
                      "recovery_leg_retention": None if retention is None else str(retention),
                      "development_gate_pass": gate,
                      **metrics,
                      "trades": run.get("trades"),
                  })
          finally:
              strategy_backtest.relative_strength_index = original_rsi

          passing = [row for row in variants if row["development_gate_pass"]]
          passing.sort(key=lambda row: (float(row["expectancy_r"]), float(row["win_rate"]), -float(row["max_drawdown_r"])), reverse=True)
          selected = passing[0] if passing else None
          payload = {
              "purpose": "causal recovery-leg risk geometry; development only",
              "research_only": True,
              "production_strategy_changed": False,
              "execution_authority": False,
              "provider_calls": 0,
              "march_holdout_loaded": False,
              "selector_rule": rule.key,
              "selector_source_sha256": SOURCE_SHA,
              "development_block": ["2025-10-01", "2026-02-27"],
              "rsi_exit": "disabled in research harness to isolate documented V2 target/protection/time management",
              "reward_multiple": "1.0",
              "profit_protection": "+0.75R arm -> +0.25R protected stop",
              "max_hold_minutes": 60,
              "recovery_stop_definition": "stop = observed_trough + retention * (signal_close - observed_trough); all values known at signal time",
              "development_gate": {"minimum_trades": 20, "minimum_win_rate": 0.75, "minimum_expectancy_r": 0.20, "one_sided_90_lcb_r": ">0", "maximum_drawdown_r": 5},
              "variants": variants,
              "selected_for_future_holdout": None if selected is None else {k:v for k,v in selected.items() if k != "trades"},
              "holdout_rule": "March remains sealed unless one predeclared variant passes every development gate.",
          }
          out = Path("artifacts/v3-recovery-leg-risk")
          out.mkdir(parents=True, exist_ok=True)
          (out / "results.json").write_text(json.dumps(payload, indent=2, default=str) + "\n", encoding="utf-8")
          lines = [
              "# V3 recovery-leg risk geometry",
              "",
              "Development only; RSI exit disabled to isolate the documented V2 target/protection/time policy. March remains sealed.",
              "",
              f"Selector: `{rule.key}`",
              "",
              "| Variant | Trades | Win rate | Exp R | 90% LCB R | Max DD R | Gate |",
              "|---|---:|---:|---:|---:|---:|---|",
          ]
          for row in variants:
              lines.append(f"| {row['variant_id']} | {row['trade_count']} | {row['win_rate']} | {row['expectancy_r']} | {row['one_sided_90_lcb_r']} | {row['max_drawdown_r']} | {'PASS' if row['development_gate_pass'] else 'FAIL'} |")
          lines.extend(["", f"Selected for future holdout: **{selected['variant_id'] if selected else 'NONE'}**."])
          (out / "summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PYCODE

      - name: Publish summary
        if: always()
        run: cat artifacts/v3-recovery-leg-risk/summary.md >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-v3-recovery-leg-risk
          path: artifacts/v3-recovery-leg-risk
          if-no-files-found: warn
          retention-days: 30
