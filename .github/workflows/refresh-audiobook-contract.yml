name: One-shot Audiobook Contract Refresh

on:
  push:
    branches:
      - agent/audiobook-v1
    paths:
      - .github/workflows/refresh-audiobook-contract.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audiobook-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install contract generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright websockets "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"
          npm install
      - name: Generate shared gateway contract
        run: npm --workspace @omnix/web run api:generate
      - name: Commit generated contract
        shell: bash
        run: |
          git add src/apps/web/src/api/generated/openapi.json src/apps/web/src/api/generated/types.ts
          if git diff --cached --quiet; then
            echo "Generated contract is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated gateway API contract"
          git push origin HEAD:agent/audiobook-v1
