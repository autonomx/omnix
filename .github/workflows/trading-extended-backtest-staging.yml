name: Trading extended backtest staging

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch_trading_extended_backtest_cache.py
      - scripts/patch_trading_extended_backtest_resilience.py
      - .github/workflows/trading-extended-backtest-staging.yml

permissions:
  contents: write

concurrency:
  group: trading-extended-backtest-staging-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qualify-and-promote-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: "src:."
      OMNIX_PERSISTENCE_MODE: legacy_test
      OMNIX_ALLOW_LEGACY_TEST_PERSISTENCE: "1"
    steps:
      - name: Check out staging source head
        uses: actions/checkout@v4
        with:
          ref: agent/trading-auto-strategy-roadmap
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install targeted trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic requests python-multipart pillow websockets pytest playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Apply already-evidenced causal cache patch
        run: |
          python scripts/patch_trading_extended_backtest_cache.py
          python scripts/patch_trading_extended_backtest_resilience.py
          python -m py_compile scripts/run_trading_strategy_v2_extended_exploration.py

      - name: Requalify causal reconstruction and V2 regressions
        run: |
          pytest -q \
            src/tests/trading/test_trading_historical_gapper_reconstruction.py \
            src/tests/trading/test_trading_strategy_historical_bars.py \
            src/tests/trading/test_trading_gap_pullback_v2.py \
            src/tests/trading/test_trading_gap_pullback_v2_backtest_management.py \
            src/tests/trading/test_trading_strategy_v2_qualification.py

      - name: Commit qualified code only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_trading_extended_backtest_cache.py
          git rm scripts/patch_trading_extended_backtest_resilience.py
          git add \
            src/app/trading/historical_gapper_reconstruction.py \
            src/tests/trading/test_trading_historical_gapper_reconstruction.py \
            scripts/run_trading_strategy_liquidity_sweep.py \
            scripts/run_trading_strategy_v2_extended_exploration.py
          git commit -m "backtest: add causal cached V2 exploration"
          git push origin HEAD:agent/trading-auto-strategy-roadmap
