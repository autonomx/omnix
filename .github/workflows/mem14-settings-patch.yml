name: MEM-14 one-time settings patch

on:
  push:
    branches:
      - tmp-mem14-settings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mem14-settings
          fetch-depth: 0
      - run: python scripts/mem14_settings_patch.py
      - run: rm scripts/mem14_settings_patch.py .github/workflows/mem14-settings-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEM-14 enforce centralized memory settings"
          git push origin HEAD:tmp-mem14-settings
