name: Publish live latency review fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-reviewed-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply reviewed source bundle
        run: |
          cp src/tests/app/test_kyutai_authority.py /tmp/test_kyutai_authority.py
          cat \
            .github/live-latency-review/controller4.part00 \
            .github/live-latency-review/controller4.part01 \
            .github/live-latency-review/controller4.part02 \
            .github/live-latency-review/controller4.part03 \
            .github/live-latency-review/controller4.part04 \
            .github/live-latency-review/controller4.part05 \
            .github/live-latency-review/controller4.part06 \
            | base64 --decode > /tmp/controller.tar.gz
          tar -xzf /tmp/controller.tar.gz
          cat \
            .github/live-latency-review/remaining4.part00 \
            .github/live-latency-review/remaining4.part01 \
            .github/live-latency-review/remaining4.part02 \
            .github/live-latency-review/remaining4.part03 \
            .github/live-latency-review/remaining4.part04 \
            .github/live-latency-review/remaining4.part05 \
            .github/live-latency-review/remaining4.part06 \
            .github/live-latency-review/remaining4.part07 \
            | base64 --decode > /tmp/remaining.tar.gz
          tar -xzf /tmp/remaining.tar.gz
          cp /tmp/test_kyutai_authority.py src/tests/app/test_kyutai_authority.py
          python - <<'PY'
          from pathlib import Path

          speculation = Path("src/app/gateway/live_chat_speculation.py")
          text = speculation.read_text()
          start_marker = '                "user_turn_id": (\n'
          end_marker = '                "live_voice_turn_id": request.live_voice_turn_id,\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("speculation identity block not found")
          replacement = '''                "user_turn_id": (
                    request.user_turn_id
                    or (
                        f"voice-user-turn:{request.live_voice_turn_id}"[:160]
                        if request.live_voice_turn_id
                        else f"speculation-user:{generation_id}"[:160]
                    )
                ),
                "speech_segment_id": (
                    request.speech_segment_id
                    or (
                        f"voice-segment:{request.live_voice_turn_id}"[:160]
                        if request.live_voice_turn_id
                        else f"speculation-segment:{speculation.segment_id}"[:160]
                    )
                ),
          '''
          speculation.write_text(text[:start] + replacement + text[end:])

          test_path = Path("src/tests/app/test_live_chat_speculation.py")
          test_text = test_path.read_text()
          old_memory = '"/remember my access token"'
          if old_memory not in test_text:
              raise SystemExit("memory command test target not found")
          test_path.write_text(
              test_text.replace(
                  old_memory,
                  '"remember that my access token is private"',
              )
          )

          websocket = Path(
              "apps/web/src/features/assistant-workspace/live-voice-websocket.ts"
          )
          websocket_text = websocket.read_text()
          old_ready = '''  get connectionReady(): boolean {
    return Boolean(this.socket && this.socket.readyState === WebSocket.OPEN);
  }
          '''
          new_ready = '''  get connectionReady(): boolean {
    return Boolean(
      this.socket
      && this.socket.readyState === WebSocket.OPEN
      && this.negotiation
      && this.sessionReady
    );
  }
          '''
          if old_ready not in websocket_text:
              raise SystemExit("connectionReady getter target not found")
          websocket.write_text(websocket_text.replace(old_ready, new_ready))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest fastapi httpx uvicorn msgpack pillow playwright requests "websockets>=12"
          npm install

      - name: Lint reviewed Python
        run: |
          ruff check \
            src/app/providers/live_stt_contracts.py \
            src/app/providers/kyutai_authority.py \
            src/app/providers/kyutai_live_stt.py \
            src/app/providers/kyutai_stt_websocket.py \
            src/app/providers/stt_live_websocket.py \
            src/app/gateway/live_chat_speculation.py \
            src/app/gateway/tts_live_capabilities.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py

      - name: Test reviewed Python
        run: |
          python -m pytest \
            src/tests/app/test_live_stt_contracts.py \
            src/tests/app/test_kyutai_authority.py \
            src/tests/app/test_kyutai_live_stt.py \
            src/tests/app/test_kyutai_stt_websocket.py \
            src/tests/app/test_stt_streaming_audio.py \
            src/tests/app/test_live_chat_speculation.py \
            src/tests/app/test_tts_live_capabilities.py \
            -q --tb=short

      - name: Typecheck reviewed browser path
        run: |
          set +e
          npm --workspace @omnix/web run typecheck 2>&1 | tee live-review-typecheck.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "(live-(voice-websocket(\\.spec)?|voice-controller|accepted-final|stt-authority-controller|speculation-controller|tts-adaptive-buffer-controller|tts-capability-controller|voice-clause-stabilizer|voice-pcm-worklet|latency-rollout\\.spec)\\.ts|src/main\\.tsx)" live-review-typecheck.txt; then
            exit "${status:-1}"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide typecheck has baseline failures outside reviewed files."
          fi

      - name: Test reviewed browser path
        run: |
          npm --workspace @omnix/web run test -- --run \
            src/features/assistant-workspace/live-voice-websocket.spec.ts \
            src/features/assistant-workspace/live-latency-rollout.spec.ts

      - name: Commit reviewed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/assistant-workspace/live-voice-controller.ts \
            apps/web/src/features/assistant-workspace/live-voice-websocket.ts \
            apps/web/src/features/assistant-workspace/live-voice-websocket.spec.ts \
            apps/web/src/features/assistant-workspace/live-voice-pcm-worklet.ts \
            apps/web/src/features/assistant-workspace/live-latency-rollout.spec.ts \
            apps/web/src/features/assistant-workspace/live-tts-adaptive-buffer-controller.ts \
            apps/web/src/features/assistant-workspace/live-speculation-controller.ts \
            src/app/gateway/live_chat_speculation.py \
            src/kyutai_stt_runtime.py \
            src/tests/app/test_live_chat_speculation.py
          git commit -m "Complete live voice correctness review fixes"
          git push origin HEAD:${{ github.head_ref }}
