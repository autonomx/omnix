services:
  postgres:
    extends:
      file: docker-compose.postgres.yml
      service: postgres

  omnix-migrate:
    image: omnix:latest
    build: .
    command: ["python", "-m", "app.persistence", "migrate"]
    volumes:
      - ./resources:/app/resources
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      OMNIX_DATABASE_URL: "postgresql://${OMNIX_POSTGRES_USER:-omnix}:${OMNIX_POSTGRES_PASSWORD:-omnix}@postgres:5432/${OMNIX_POSTGRES_DB:-omnix}"
      OMNIX_MIGRATION_DATABASE_URL: "postgresql://${OMNIX_POSTGRES_USER:-omnix}:${OMNIX_POSTGRES_PASSWORD:-omnix}@postgres:5432/${OMNIX_POSTGRES_DB:-omnix}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  omnix:
    image: omnix:latest
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./resources:/app/resources
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      OMNIX_GATEWAY_BACKGROUND_ROLE: worker
      OMNIX_DATABASE_URL: "postgresql://${OMNIX_POSTGRES_USER:-omnix}:${OMNIX_POSTGRES_PASSWORD:-omnix}@postgres:5432/${OMNIX_POSTGRES_DB:-omnix}"
    depends_on:
      omnix-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  omnix-api:
    profiles: [replicas]
    image: omnix:latest
    build: .
    expose:
      - "8000"
    volumes:
      - ./resources:/app/resources
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      OMNIX_GATEWAY_BACKGROUND_ROLE: api
      OMNIX_TTS_STARTUP_WARMUP: "0"
      OMNIX_DATABASE_URL: "postgresql://${OMNIX_POSTGRES_USER:-omnix}:${OMNIX_POSTGRES_PASSWORD:-omnix}@postgres:5432/${OMNIX_POSTGRES_DB:-omnix}"
    depends_on:
      omnix-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  omnix-postgres-data:
    name: omnix-postgres-data
