services:
  postgres:
    extends:
      file: docker-compose.postgres.yml
      service: postgres

  omnix:
    image: omnix:latest
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./resources:/app/resources
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      OMNIX_DATABASE_URL: "postgresql://${OMNIX_POSTGRES_USER:-omnix}:${OMNIX_POSTGRES_PASSWORD:-omnix}@postgres:5432/${OMNIX_POSTGRES_DB:-omnix}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  omnix-postgres-data:
    name: omnix-postgres-data
