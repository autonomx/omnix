# Generated by scripts/render_gateway_ingress.py; install inside Nginx http {}.
# Replace addresses, certificate paths and the static web root for your deployment.
upstream omnix_worker { server gateway-worker:8000; keepalive 32; }
upstream omnix_api {
    least_conn;
    server api:8000;
    keepalive 64;
}
map $http_x_omnix_call_id $omnix_call_affinity_key {
    default $http_x_omnix_call_id;
    "" $cookie_omnix_call_affinity;
}
upstream omnix_live_api {
    hash $omnix_call_affinity_key consistent;
    server api:8000;
    keepalive 64;
}
map $http_upgrade $omnix_connection { default upgrade; '' ''; }
# Change to 1 only when EVERY API process uses the shared remote TTS service.
map $host $omnix_speech_on_api { default 0; }
map $uri $omnix_chat_target {
    default omnix_worker;
    ~^/api/chat/sessions(?:/[^/]+(?:/(?:attachments|messages(?:/stream)?))?)?$ omnix_api;
}
map "$request_method:$uri" $omnix_read_target {
    default $omnix_chat_target;
    ~^(?:GET|HEAD):(?:/events|/api/jobs(?:/[^/]+)?|/api/trading/(?:bars|quotes))$ omnix_api;
}
map "$omnix_speech_on_api:$omnix_call_affinity_key:$request_method:$uri" $omnix_live_chat_target {
    default $omnix_read_target;
    ~^0:.*:POST:/api/chat/sessions/[^/]+/messages/stream$ omnix_worker;
    ~^1::POST:/api/chat/sessions/[^/]+/messages/stream$ omnix_worker;
    ~^1:.+:POST:/api/chat/sessions/[^/]+/messages/stream$ omnix_live_api;
}
map "$omnix_speech_on_api:$omnix_call_affinity_key:$uri" $omnix_speech_target {
    default $omnix_live_chat_target;
    ~^1:.+:/api/tts/live\-call/websocket$ omnix_live_api;
    ~^1:.*:(?:/api/tts/stream/websocket|/api/tts/stream/server\-sent\-events)$ omnix_api;
}
# External requests cannot select the worker (policy external_worker_affinity=false).
map $omnix_speech_target $omnix_target { default $omnix_speech_target; }
# Per-client request rates (behind another proxy, set real_ip so this is the client).
limit_req_zone $binary_remote_addr zone=omnix_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=omnix_api:10m rate=50r/s;
limit_req_status 429;
server {
    listen 8080;
    server_tokens off;
    root /srv/omnix/web;
    location ~ ^/api/auth/ {
        client_max_body_size 1m;
        limit_req zone=omnix_auth burst=10 nodelay;
        proxy_pass http://$omnix_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Omnix-Call-Id $omnix_call_affinity_key;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnix_connection;
        # Clients cannot pick the worker; only the policy maps above route there.
        proxy_set_header X-Omnix-Gateway-Affinity "";
        # Preserve one upstream for the whole stream and never replay a write.
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Omnix-Gateway-Route $omnix_target always;
    }
    location ~ ^/api/audiobook/projects/[^/]+/source$ {
        client_max_body_size 200m;
        limit_req zone=omnix_api burst=400 nodelay;
        proxy_pass http://$omnix_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Omnix-Call-Id $omnix_call_affinity_key;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnix_connection;
        # Clients cannot pick the worker; only the policy maps above route there.
        proxy_set_header X-Omnix-Gateway-Affinity "";
        # Preserve one upstream for the whole stream and never replay a write.
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Omnix-Gateway-Route $omnix_target always;
    }
    location ~ ^/api/rpg/worlds/import$ {
        client_max_body_size 512m;
        limit_req zone=omnix_api burst=400 nodelay;
        proxy_pass http://$omnix_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Omnix-Call-Id $omnix_call_affinity_key;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnix_connection;
        # Clients cannot pick the worker; only the policy maps above route there.
        proxy_set_header X-Omnix-Gateway-Affinity "";
        # Preserve one upstream for the whole stream and never replay a write.
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Omnix-Gateway-Route $omnix_target always;
    }
    location ~ ^/(?:api(?:/|$)|events$|health$|ready$) {
        client_max_body_size 64m;
        limit_req zone=omnix_api burst=400 nodelay;
        proxy_pass http://$omnix_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Omnix-Call-Id $omnix_call_affinity_key;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnix_connection;
        # Clients cannot pick the worker; only the policy maps above route there.
        proxy_set_header X-Omnix-Gateway-Affinity "";
        # Preserve one upstream for the whole stream and never replay a write.
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Omnix-Gateway-Route $omnix_target always;
    }
    # Content-hashed build output: cache for a year.
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "microphone=(self), display-capture=(self), camera=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "microphone=(self), display-capture=(self), camera=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
